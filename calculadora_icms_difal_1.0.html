<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora ICMS DIFAL Pro - Base Dupla</title>

  <!-- Fontes Profissionais -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --ecac-blue: #003366;
      --ecac-blue-light: #e6f0f7;
      --ecac-gray: #f2f2f2;
      --ecac-border: #cccccc;
      --ecac-text: #333333;
      --primary: var(--ecac-blue);
      --danger: #cc0000;
      --success: #10b981;
      --bg: #f8f9fa;
      --card: #ffffff;
      --border: var(--ecac-border);
      --text: var(--ecac-text);
      --shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 5px;
      line-height: 1.1;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 1800px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    .main-area {
      flex: 1;
      min-width: 0;
    }

    .sidebar {
      width: 180px;
      flex-shrink: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px;
      box-shadow: var(--shadow);
      max-height: 95vh;
      overflow-y: auto;
      position: sticky;
      top: 5px;
    }

    .sidebar h3 {
      font-size: 0.75rem;
      color: var(--ecac-blue);
      font-weight: 800;
      text-transform: uppercase;
      border-bottom: 1px solid var(--ecac-border);
      padding-bottom: 4px;
      margin-bottom: 6px;
    }

    .note-list { display: flex; flex-direction: column; gap: 4px; }

    .note-item {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 8px;
      border: 1px solid var(--ecac-border);
      border-radius: 3px;
      background: #f8f9fa;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 700;
      transition: background 0.15s, border-color 0.15s;
    }

    .note-item:hover { background: var(--ecac-blue-light); border-color: var(--ecac-blue); }
    .note-item.active {
      background: var(--ecac-blue);
      color: #fff;
      border-color: var(--ecac-blue);
    }

    .note-item .note-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .note-item .btn-del-note {
      width: 18px;
      height: 18px;
      padding: 0;
      font-size: 0.7rem;
      background: transparent;
      border: none;
      color: #cc0000;
      cursor: pointer;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .note-item.active .btn-del-note { color: #ffb3b3; }
    .note-item .btn-del-note:hover { background: rgba(204,0,0,0.15); }

    .sidebar-actions {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }
    .sidebar-actions .btn { flex: 1; height: 26px; font-size: 0.65rem; padding: 0 4px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px;
      box-shadow: var(--shadow);
      margin-bottom: 5px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
      border-bottom: 2px solid var(--ecac-blue);
      padding-bottom: 2px;
    }

    h1 { font-size: 1.1rem; color: var(--ecac-blue); font-weight: 800; }

    h2 {
      font-size: 0.75rem;
      margin: 8px 0 4px 0;
      color: var(--ecac-blue);
      font-weight: 800;
      text-transform: uppercase;
      border-bottom: 1px solid var(--ecac-border);
      padding-bottom: 1px;
    }

    .upload-section {
      background: var(--ecac-blue-light);
      border: 1px dashed var(--ecac-blue);
      border-radius: 4px;
      padding: 10px;
      text-align: center;
      margin: 5px 0;
      cursor: pointer;
    }

    .upload-section p { font-weight: 800; color: var(--ecac-blue); font-size: 0.8rem; }

    #fileInput { display: none; }

    .produtos-container { display: flex; flex-direction: column; gap: 3px; }

    .linha-produto {
      display: grid;
      grid-template-columns: 2.0fr 0.55fr 0.7fr 0.85fr 0.7fr 0.7fr 0.7fr 0.7fr 0.85fr 28px 28px;
      gap: 5px;
      align-items: flex-end;
      background: #fff;
      padding: 3px 6px;
      border-radius: 2px;
      border: 1px solid var(--border);
    }

    .campo { display: flex; flex-direction: column; gap: 1px; }

    label { font-size: 0.6rem; font-weight: 800; color: var(--ecac-blue); text-transform: uppercase; }

    input {
      height: 24px;
      border: 1px solid var(--ecac-border);
      border-radius: 2px;
      padding: 0 5px;
      font-size: 0.85rem;
      font-weight: 700;
      width: 100%;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      height: 28px;
      border-radius: 2px;
      font-weight: 800;
      font-size: 0.75rem;
      cursor: pointer;
      border: none;
      gap: 5px;
    }

    .btn-primary { background: var(--ecac-blue); color: white; }
    .btn-success { background: #28a745; color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-warning { background: #f39c12; color: white; }
    
    .btn-icon { width: 24px; height: 24px; padding: 0; font-size: 1rem; }

    .action-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 10px 0;
      padding: 8px;
      background: var(--ecac-gray);
      border-radius: 4px;
      border: 1px solid var(--ecac-border);
    }

    .grid-config {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
      margin-top: 5px;
      background: var(--ecac-gray);
      padding: 6px;
      border-radius: 2px;
      border: 1px solid var(--border);
    }

    .table-container { overflow-x: auto; margin-top: 10px; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.7rem;
      border: 1px solid var(--ecac-border);
      table-layout: fixed;
    }

    th {
      background: var(--ecac-blue);
      padding: 3px 1px;
      text-align: center;
      font-weight: 800;
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      text-transform: uppercase;
      font-size: 0.58rem;
      line-height: 1.15;
      word-break: break-word;
      white-space: normal;
    }

    td {
      padding: 2px 1px;
      text-align: center;
      border: 1px solid var(--ecac-border);
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.68rem;
    }

    th:nth-child(1), td:nth-child(1) { width: 18%; text-align: left; padding-left: 3px; }
    th:nth-child(2), td:nth-child(2) { width: 7%; }
    th:nth-child(3), td:nth-child(3) { width: 7%; }
    th:nth-child(4), td:nth-child(4) { width: 6%; }
    th:nth-child(5), td:nth-child(5) { width: 5%; }
    th:nth-child(6), td:nth-child(6) { width: 7%; }
    th:nth-child(7), td:nth-child(7) { width: 7%; }
    th:nth-child(8), td:nth-child(8) { width: 5%; }
    th:nth-child(9), td:nth-child(9) { width: 5%; }
    th:nth-child(10), td:nth-child(10) { width: 7%; }
    th:nth-child(11), td:nth-child(11) { width: 7%; }
    th:nth-child(12), td:nth-child(12) { width: 7%; }
    th:nth-child(13), td:nth-child(13) { width: 5%; }

    tfoot tr { background: #dcfce7 !important; }
    tfoot td { padding: 3px 1px; font-weight: 900; color: #065f46 !important; font-size: 0.68rem; }
    tfoot td:first-child { background: #10b981; color: #ffffff !important; text-align: center; }

    .modo-icms-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin: 8px 0 4px 0;
      padding: 8px 12px;
      background: #fffdf0;
      border: 1px solid #ffeeba;
      border-radius: 4px;
    }
    .modo-icms-opt {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }
    .modo-icms-opt input {
      width: 15px;
      height: 15px;
      margin: 0;
      cursor: pointer;
      accent-color: var(--ecac-blue);
      flex-shrink: 0;
    }
    .modo-icms-opt span {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--ecac-blue);
      white-space: nowrap;
    }
    .modo-icms-opt small {
      font-size: 0.68rem;
      font-weight: 600;
      color: #555;
      white-space: nowrap;
    }

    

    @media (max-width: 1100px) {
      .sidebar { width: 150px; padding: 5px; }
      .sidebar h3 { font-size: 0.65rem; }
      .note-item { font-size: 0.65rem; padding: 4px 5px; }
      table { font-size: 0.62rem; }
      th { font-size: 0.52rem; padding: 2px 0; }
      td { font-size: 0.6rem; padding: 2px 0; }
      tfoot td { font-size: 0.6rem; }
    }

    /* ========== IMPRESSÃO ========== */
    @media print {
      @page {
        size: A4 landscape;
        margin: 8mm;
      }

      body {
        background: #fff !important;
        padding: 0 !important;
        color: #000 !important;
        font-size: 10pt;
      }

      /* Esconde sidebar e controles */
      .sidebar,
      .upload-section,
      #fileInput,
      #statusMsg,
      .action-bar,
      .modo-icms-bar,
      .produtos-container,
      .sidebar-actions,
      button,
      .btn {
        display: none !important;
      }

      .container {
        display: block !important;
        max-width: 100% !important;
        margin: 0 !important;
        gap: 0 !important;
      }

      .main-area {
        width: 100% !important;
        max-width: 100% !important;
      }

      .card {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      header {
        border-bottom: 2px solid #003366 !important;
        margin-bottom: 6px !important;
        padding-bottom: 4px !important;
      }

      h1 {
        font-size: 14pt !important;
        color: #000 !important;
      }

      h2 {
        font-size: 10pt !important;
        color: #000 !important;
        margin: 8px 0 4px 0 !important;
        border-bottom: 1px solid #333 !important;
      }

      /* Dados da NF e configurações legíveis */
      .grid-config {
        background: #fff !important;
        border: 1px solid #ccc !important;
        padding: 4px !important;
        margin-bottom: 6px !important;
        display: grid !important;
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)) !important;
        gap: 4px !important;
      }

      .grid-config input {
        border: none !important;
        background: transparent !important;
        font-weight: 700 !important;
        color: #000 !important;
        height: auto !important;
        padding: 0 !important;
        font-size: 9pt !important;
      }

      .grid-config label {
        font-size: 7pt !important;
        color: #333 !important;
      }

      /* Tabela de resultados */
      .table-container {
        overflow: visible !important;
        margin-top: 6px !important;
      }

      table {
        width: 100% !important;
        font-size: 8pt !important;
        border-collapse: collapse !important;
        table-layout: auto !important;
      }

      th {
        background: #003366 !important;
        color: #fff !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        font-size: 7pt !important;
        padding: 3px 2px !important;
      }

      td {
        font-size: 8pt !important;
        padding: 2px !important;
        color: #000 !important;
        border: 1px solid #999 !important;
      }

      tfoot tr {
        background: #dcfce7 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      tfoot td {
        font-weight: 900 !important;
        font-size: 8pt !important;
      }

      tfoot td:first-child {
        background: #10b981 !important;
        color: #fff !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* Explicação do cálculo */
      .explicacao {
        margin-top: 8px !important;
        padding: 6px !important;
        border: 1px solid #ccc !important;
        page-break-inside: avoid;
      }

      .item-explicacao {
        background: #f5f5f5 !important;
        border: 1px solid #ddd !important;
        padding: 6px !important;
        font-size: 9pt !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .ocst-info {
        font-size: 6.5pt !important;
      }

      /* Evita quebras ruins */
      tr {
        page-break-inside: avoid;
      }
    }

    .explicacao { margin-top: 10px; padding: 10px; background: #fff; border: 1px solid var(--ecac-border); border-radius: 4px; }
    .item-explicacao { margin-bottom: 5px; padding: 8px; background: var(--ecac-gray); border-radius: 4px; border: 1px solid var(--ecac-border); font-size: 0.85rem; }
    .item-explicacao strong { color: var(--ecac-blue); font-size: 0.95rem; }
    .item-explicacao p { margin: 2px 0; }
    .item-explicacao code { background: #fff; padding: 1px 5px; border-radius: 2px; border: 1px solid var(--ecac-border); font-family: monospace; font-weight: 800; color: #000; }

    .ocst-info {
      display: block;
      font-size: 0.58rem;
      color: #333;
      font-weight: 700;
      margin-top: 1px;
      white-space: normal;
      line-height: 1.15;
    }

    .ocst-code {
      background: #e1e1e1;
      color: #000;
      padding: 0px 2px;
      border-radius: 2px;
      font-weight: 800;
      margin-right: 2px;
      border: 1px solid #ccc;
      font-size: 0.55rem;
    }

    .dropdown-estados {
      display: none; position: absolute; top: 100%; left: 0; z-index: 1000; width: 400px;
      background: #fff; border: 1px solid var(--ecac-blue); border-radius: 2px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15); padding: 5px; grid-template-columns: repeat(3, 1fr); gap: 3px;
    }
    .btn-sel-estado { height: 24px; font-size: 0.7rem; background: var(--ecac-gray); border: 1px solid var(--ecac-border); display: flex; align-items: center; padding: 0 5px; cursor: pointer; }
    .btn-sel-estado:hover { background: var(--ecac-blue); color: #fff; }

    .status-msg { padding: 5px; border-radius: 2px; margin-bottom: 5px; font-weight: 800; font-size: 0.8rem; display: none; text-align: center; }
    .status-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block; }
    .status-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block; }
  </style>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>

<body>
<div class="container">
  <!-- Lista de notas à ESQUERDA -->
  <div class="sidebar">
    <h3>📋 Notas Abertas</h3>
    <div id="noteList" class="note-list"></div>
    <div class="sidebar-actions" style="flex-wrap:wrap;">
      <button class="btn btn-success" onclick="exportarTXTTodas()" title="Exportar todas as notas em TXT" style="flex:1 1 45%;font-size:0.6rem;">TXT Todas</button>
      <button class="btn btn-success" onclick="exportarExcelTodas()" title="Excel de todas as notas" style="flex:1 1 45%;font-size:0.6rem;background:#1d6f42;">Excel Todas</button>
      <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()" title="Importar TXT/XML (uma ou várias)" style="flex:1 1 45%;font-size:0.6rem;">Importar</button>
      <button class="btn btn-warning" onclick="fecharTodasNotas()" title="Fechar todas" style="flex:1 1 45%;font-size:0.6rem;">Limpar</button>
    </div>
  </div>

  <div class="main-area">
  <div class="card">
    <header><h1>Calculadora ICMS DIFAL Pro</h1></header>
    <div class="upload-section" id="dropZone" onclick="document.getElementById('fileInput').click()"><p>📂 IMPORTAR XML OU TXT (múltiplos)</p></div>
    <input type="file" id="fileInput" accept=".xml,.txt" multiple onchange="handleFileSelect(event)">
    <div id="statusMsg" class="status-msg"></div>

    <h2>Dados da Nota Fiscal</h2>
    <div class="grid-config" style="background: #fffdf0; border: 1px solid #ffeeba;">
      <div class="campo"><label>Número da NF</label><input type="text" id="numeroNF" placeholder="000.000"></div>
      <div class="campo" style="grid-column: span 2;"><label>Fornecedor (Emitente)</label><input type="text" id="nomeFornecedor" placeholder="Nome Completo do Emitente"></div>
    </div>

    <h2>Produtos / Itens</h2>
    <div id="listaProdutos" class="produtos-container">
      <div class="linha-produto produto">
        <div class="campo"><label>Descrição</label><input type="text" class="descProduto" placeholder="Item"></div>
        <div class="campo"><label>O/CST</label><input type="text" class="ocstProduto formatar-ocst" placeholder="0/00" maxlength="5"></div>
        <div class="campo"><label>NCM</label><input type="text" class="ncmProduto" placeholder="00000000" maxlength="10"></div>
        <div class="campo"><label>Valor (R$)</label><input type="text" class="valorProduto formatar-br" value="0,00"></div>
        <div class="campo"><label>IPI (R$)</label><input type="text" class="ipiProduto formatar-br" value="0,00"></div>
        <div class="campo"><label>Outras (R$)</label><input type="text" class="outrasProduto formatar-br" value="0,00"></div>
        <div class="campo"><label>Desconto (R$)</label><input type="text" class="descontoProduto formatar-br" value="0,00"></div>
        <div class="campo"><label>Redução %</label><input type="text" class="reducaoBase formatar-br" value="0,00"></div>
        <div class="campo"><label>ICMS Origem</label><input type="text" class="icmsDestacado formatar-br" value="0,00"></div>
        <div class="campo"><label>&nbsp;</label><button class="btn btn-success btn-icon" onclick="adicionarProduto()">+</button></div>
        <div class="campo"><label>&nbsp;</label><button class="btn btn-danger btn-icon" onclick="removerProduto(this)">×</button></div>
      </div>
    </div>

    <h2>Configurações</h2>
    <div class="grid-config">
      <div class="campo"><label>Frete (R$)</label><input type="text" id="frete" class="formatar-br" value="0,00"></div>
      <div class="campo" style="position: relative;"><label>Origem</label><input type="text" id="estadoOrigem" readonly placeholder="UF" onclick="toggleDropdown()"><div class="dropdown-estados" id="dropdownEstados"></div></div>
      <div class="campo"><label>Aliq. Interna (%)</label><input type="text" id="aliquotaInterna" class="formatar-br" value="20,00"></div>
      <div class="campo"><label>Aliq. Origem (%)</label><input type="text" id="aliquotaOrigem" class="formatar-br" value="7,00"></div>
      <div class="campo"><label>FCP (%)</label><input type="text" id="aliquotaFCP" class="formatar-br" value="0,00"></div>
    </div>

    <div class="modo-icms-bar">
      <label class="modo-icms-opt">
        <input type="radio" name="modoICMSBaseO" value="dentro" checked onchange="calcularDIFAL()">
        <span>ICMS por dentro</span>
        <small>— ICMS incluso na base</small>
      </label>
      <label class="modo-icms-opt">
        <input type="radio" name="modoICMSBaseO" value="fora" onchange="calcularDIFAL()">
        <span>ICMS por fora</span>
        <small>— ICMS destacado separadamente</small>
      </label>
    </div>

    <div class="action-bar">
      <button class="btn btn-warning" onclick="resetarCalculadora()">RESETAR</button>
      <button class="btn btn-success" onclick="exportarTXT()" title="Exportar apenas esta nota">TXT (esta nota)</button>
      <button class="btn btn-success" onclick="exportarExcel()" style="background:#1d6f42;" title="Excel apenas desta nota">Excel (esta nota)</button>
      <button class="btn btn-primary" onclick="calcularDIFAL()">CALCULAR</button>
    </div>

    <div class="table-container">
      <table>
        <thead><tr><th>Item / O-CST</th><th>NCM</th><th>Valor</th><th>IPI</th><th>Red %</th><th>Base D</th><th>Base O</th><th>Al D</th><th>Al O</th><th>ICMS D</th><th>ICMS O</th><th>DIFAL</th><th>%</th></tr></thead>
        <tbody id="tabelaResultados"></tbody>
        <tfoot><tr><td>TOTAIS</td><td>-</td><td id="totalProdutos"></td><td id="totalIPI"></td><td>-</td><td id="totalBaseDestino"></td><td id="totalBaseOrigem"></td><td>-</td><td>-</td><td id="totalICMSDestino"></td><td id="totalICMSOrigem"></td><td id="totalDifal"></td><td>-</td></tr></tfoot>
      </table>
    </div>
    <div class="explicacao" id="explicacao"></div>
  </div>
  </div><!-- /main-area -->
</div>

<script>
const tabelaOrigem = {
  "0": "Nacional",
  "1": "Estrangeira - Importação direta",
  "2": "Estrangeira - Adquirida no mercado interno",
  "3": "Nacional, Conteúdo Importação > 40% e <= 70%",
  "4": "Nacional, processos produtivos básicos",
  "5": "Nacional, Conteúdo Importação <= 40%",
  "6": "Estrangeira - Importação direta, sem similar nacional",
  "7": "Estrangeira - Adquirida no mercado interno, sem similar nacional",
  "8": "Nacional, Conteúdo Importação > 70%"
};

const tabelaCST = {
  "101": "Tributada Simples c/ crédito",

let aliquotasItens = {};

// ========== MULTI-NOTAS ==========
let notes = [];          // array de objetos de estado de cada nota
let activeNoteId = null; // id da nota atualmente exibida
let noteIdCounter = 0;

function gerarIdNota() { return "n" + (++noteIdCounter); }

function capturarEstadoAtual() {
  const produtos = [];
  document.querySelectorAll(".produto").forEach(p => {
    produtos.push({
      desc: p.querySelector(".descProduto").value,
      ocst: p.querySelector(".ocstProduto").value,
      ncm: p.querySelector(".ncmProduto") ? p.querySelector(".ncmProduto").value : "",
      valor: p.querySelector(".valorProduto").value,
      ipi: p.querySelector(".ipiProduto").value,
      outras: p.querySelector(".outrasProduto").value,
      desconto: p.querySelector(".descontoProduto").value,
      red: p.querySelector(".reducaoBase").value,
      icmsDest: p.querySelector(".icmsDestacado") ? p.querySelector(".icmsDestacado").value : "0,00"
    });
  });
  return {
    numeroNF: document.getElementById("numeroNF").value,
    nomeFornecedor: document.getElementById("nomeFornecedor").value,
    frete: document.getElementById("frete").value,
    estadoOrigem: document.getElementById("estadoOrigem").value,
    aliquotaInterna: document.getElementById("aliquotaInterna").value,
    aliquotaOrigem: document.getElementById("aliquotaOrigem").value,
    aliquotaFCP: document.getElementById("aliquotaFCP").value,
    modoICMSBaseO: document.querySelector('input[name="modoICMSBaseO"]:checked')?.value || "dentro",
    produtos,
    aliquotasItens: JSON.parse(JSON.stringify(aliquotasItens))
  };
}

function salvarNotaAtiva() {
  if (activeNoteId === null) return;
  const idx = notes.findIndex(n => n.id === activeNoteId);
  if (idx === -1) return;
  const estado = capturarEstadoAtual();
  notes[idx] = { ...notes[idx], ...estado };
}

function aplicarEstado(estado) {
  document.getElementById("numeroNF").value = estado.numeroNF || "";
  document.getElementById("nomeFornecedor").value = estado.nomeFornecedor || "";
  document.getElementById("frete").value = estado.frete || "0,00";
  document.getElementById("estadoOrigem").value = estado.estadoOrigem || "";
  document.getElementById("aliquotaInterna").value = estado.aliquotaInterna || "20,00";
  document.getElementById("aliquotaOrigem").value = estado.aliquotaOrigem || "7,00";
  document.getElementById("aliquotaFCP").value = estado.aliquotaFCP || "0,00";
  const modo = estado.modoICMSBaseO || (estado.deduzirICMSBaseO ? "fora" : "dentro");
  const radioModo = document.querySelector(`input[name="modoICMSBaseO"][value="${modo}"]`);
  if (radioModo) radioModo.checked = true;
  aliquotasItens = estado.aliquotasItens ? JSON.parse(JSON.stringify(estado.aliquotasItens)) : {};

  const lista = document.getElementById("listaProdutos");
  lista.innerHTML = "";
  if (estado.produtos && estado.produtos.length > 0) {
    estado.produtos.forEach(pr => {
      adicionarProduto(pr.desc, pr.valor, pr.ipi, pr.outras, pr.desconto, pr.red, pr.ocst, pr.icmsDest || "0,00", pr.ncm || "");
    });
  } else {
    adicionarProduto();
  }
}

function renderNoteList() {
  const list = document.getElementById("noteList");
  list.innerHTML = "";
  if (notes.length === 0) {
    list.innerHTML = '<div style="font-size:0.7rem;color:#888;padding:4px;">Nenhuma nota aberta</div>';
    return;
  }
  notes.forEach(n => {
    const div = document.createElement("div");
    div.className = "note-item" + (n.id === activeNoteId ? " active" : "");
    const label = (n.numeroNF || "S/N") + (n.nomeFornecedor ? " – " + n.nomeFornecedor.split(" ").slice(0,2).join(" ") : "");
    div.innerHTML = `<span class="note-label" title="${label}">${label}</span>
      <button class="btn-del-note" title="Fechar nota" onclick="event.stopPropagation(); fecharNota('${n.id}')">×</button>`;
    div.onclick = () => selecionarNota(n.id);
    list.appendChild(div);
  });
}

function selecionarNota(id) {
  if (id === activeNoteId) return;
  salvarNotaAtiva();
  const nota = notes.find(n => n.id === id);
  if (!nota) return;
  activeNoteId = id;
  aplicarEstado(nota);
  renderNoteList();
  calcularDIFAL();
}

function fecharNota(id) {
  const idx = notes.findIndex(n => n.id === id);
  if (idx === -1) return;
  if (id === activeNoteId) {
    // se é a ativa, salva antes de remover (opcional) e escolhe outra
    salvarNotaAtiva();
  }
  notes.splice(idx, 1);
  if (notes.length === 0) {
    activeNoteId = null;
    resetarFormulario();
  } else if (id === activeNoteId) {
    activeNoteId = notes[Math.min(idx, notes.length - 1)].id;
    aplicarEstado(notes.find(n => n.id === activeNoteId));
    calcularDIFAL();
  }
  renderNoteList();
}

function fecharTodasNotas() {
  if (notes.length === 0) return;
  if (!confirm("Fechar todas as notas? Alterações não salvas em arquivo serão perdidas.")) return;
  notes = [];
  activeNoteId = null;
  resetarFormulario();
  renderNoteList();
}

function novaNotaEmBranco() {
  salvarNotaAtiva();

    numeroNF: "",
    nomeFornecedor: "",
    frete: "0,00",
    estadoOrigem: "",
    aliquotaInterna: "20,00",
    aliquotaOrigem: "7,00",
    aliquotaFCP: "0,00",
    modoICMSBaseO: "dentro",
    produtos: [],
    aliquotasItens: {}
  };
  notes.push(estado);
  activeNoteId = id;
  aplicarEstado(estado);
  renderNoteList();
  calcularDIFAL();
}

function criarNotaAPartirDoFormulario() {
  // usado após importar: captura o que está no form e cria/atualiza a nota ativa
  const estado = capturarEstadoAtual();
  if (activeNoteId === null) {
    const id = gerarIdNota();
    notes.push({ id, ...estado });
    activeNoteId = id;
  } else {
    const idx = notes.findIndex(n => n.id === activeNoteId);
    if (idx !== -1) notes[idx] = { ...notes[idx], ...estado };
  }
  renderNoteList();
}

function resetarFormulario() {

  document.getElementById("estadoOrigem").value = "";

function aplicarMascaraBR(input) {
  let value = input.value.replace(/\D/g, "");
  if (value === "") value = "0";
  let num = (parseInt(value) / 100).toFixed(2);
  input.value = num.replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

function aplicarMascaraOCST(input) {
  let val = input.value.replace(/\D/g, "");
  if (val.length === 3) {
    input.value = val[0] + "/" + val.substring(1);
  } else if (val.length === 4) {
    input.value = val[0] + "/" + val.substring(1);
  }
}

function parseBR(str) {
  if (!str) return 0;
  return parseFloat(str.toString().replace(/\./g, "").replace(",", "."));
}

function formatBR(num) { return num.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

document.addEventListener("input", (e) => {
  if (e.target.classList.contains("formatar-br") || ["frete", "aliquotaInterna", "aliquotaOrigem", "aliquotaFCP"].includes(e.target.id)) {
    aplicarMascaraBR(e.target);
  }
  if (e.target.classList.contains("formatar-ocst")) {
    aplicarMascaraOCST(e.target);
  }
});

const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.background = "#d1e3f0"; });
dropZone.addEventListener('dragleave', () => { dropZone.style.background = "var(--ecac-blue-light)"; });
dropZone.addEventListener('drop', (e) => {
  e.preventDefault(); dropZone.style.background = "var(--ecac-blue-light)";
  const files = e.dataTransfer.files;
  if (files.length > 0) processarMultiplosArquivos(files);
});

function handleFileSelect(event) {
  const files = event.target.files;
  if (files && files.length > 0) processarMultiplosArquivos(files);
  event.target.value = ""; // permite reimportar o mesmo arquivo
}

function processarMultiplosArquivos(fileList) {
  const files = Array.from(fileList);
  let processados = 0;
  const total = files.length;

  files.forEach((file, i) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const content = e.target.result;
      salvarNotaAtiva();

      try {
        const isTxt = file.name.toLowerCase().endsWith('.txt');
        const isMultiNotaTxt = isTxt && (content.split("=== CÁLCULO ICMS DIFAL ===").length > 2 || content.includes("--- FIM NOTA ---"));

        if (isMultiNotaTxt) {
          // Arquivo TXT com várias notas: importarTXT cria todas no sidebar
          importarTXT(content, true);
        } else {
          // Uma nota (XML ou TXT simples): cria slot e preenche
          const id = gerarIdNota();
          notes.push({
            id,
            numeroNF: "",
            nomeFornecedor: "",
            frete: "0,00",
            estadoOrigem: "",
            aliquotaInterna: "20,00",
            aliquotaOrigem: "7,00",
            aliquotaFCP: "0,00",
            modoICMSBaseO: "dentro",
            produtos: [],
            aliquotasItens: {}
          });
          activeNoteId = id;
          resetarFormulario();

          if (file.name.toLowerCase().endsWith('.xml')) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(content, "text/xml");
            importarXML(xmlDoc, true);
          } else if (isTxt) {
            importarTXT(content, true);
          }
          criarNotaAPartirDoFormulario();
        }
      } catch (err) {
        console.error(err);
        showStatus("Erro em " + file.name, "error");
      }

      processados++;
      if (processados === total) {
        if (notes.length > 0) {
          activeNoteId = notes[notes.length - 1].id;
          aplicarEstado(notes.find(n => n.id === activeNoteId));
          renderNoteList();
          calcularDIFAL();
        }
        showStatus(`✓ ${total} arquivo(s) importado(s)!`, "success");
      }
    };
    reader.readAsText(file);
  });
}

function importarXML(xmlDoc, skipCalc = false) {
  document.getElementById("listaProdutos").innerHTML = "";
  aliquotasItens = {};
  const ide = xmlDoc.querySelector("ide");
  const nNF = ide?.querySelector("nNF")?.textContent || "";
  document.getElementById("numeroNF").value = nNF;
  const emit = xmlDoc.querySelector("emit");
  const xNome = emit?.querySelector("xNome")?.textContent || "";
  document.getElementById("nomeFornecedor").value = xNome;
  const ufOrigem = emit?.querySelector("enderEmit > UF")?.textContent;
  if (ufOrigem) {
    const estado = estadosData.find(e => e.sigla === ufOrigem);
    if (estado) {
      document.getElementById("estadoOrigem").value = `${estado.sigla} - ${estado.nome}`;
      document.getElementById("aliquotaOrigem").value = formatBR(estado.aliq);
    }
  }
  const ICMSTot = xmlDoc.querySelector("ICMSTot");
  if (ICMSTot) document.getElementById("frete").value = formatBR(parseFloat(ICMSTot.querySelector("vFrete")?.textContent || 0));
  const itens = xmlDoc.querySelectorAll("det");
  itens.forEach(det => {
    const prod = det.querySelector("prod");
    const imposto = det.querySelector("imposto");
    const icms = imposto.querySelector("ICMS");
    let orig = "", cst = "";
    if (icms) {
      const tagsCST = ["CST", "CSOSN"];
      for (const tag of tagsCST) {
        const elCST = icms.querySelector(tag);
        if (elCST) { cst = elCST.textContent; break; }
        const elInner = icms.querySelector("* > " + tag);
        if (elInner) { cst = elInner.textContent; break; }
      }
      const elOrig = icms.querySelector("orig") || icms.querySelector("* > orig");
      if (elOrig) orig = elOrig.textContent;
    }
    const ipi = imposto.querySelector("IPI IPIv");
    let vICMS = 0;
    if (icms) {
      const elVICMS = icms.querySelector("vICMS") || icms.querySelector("* > vICMS");
      if (elVICMS) vICMS = parseFloat(elVICMS.textContent || 0);
    }
    adicionarProduto(
      prod.querySelector("xProd")?.textContent || "Item",
      formatBR(parseFloat(prod.querySelector("vProd")?.textContent || 0)),
      formatBR(parseFloat(ipi?.textContent || 0)),
      formatBR(parseFloat(prod.querySelector("vOutro")?.textContent || 0)),
      formatBR(parseFloat(prod.querySelector("vDesc")?.textContent || 0)),
      "0,00",
      orig && cst ? `${orig}/${cst}` : "",
      formatBR(vICMS),
      prod.querySelector("NCM")?.textContent || ""
    );
  });
  if (!skipCalc) {
    criarNotaAPartirDoFormulario();
    calcularDIFAL();
  }
}

function serializarNotaTXT(estado) {
  let txt = "=== CÁLCULO ICMS DIFAL ===\n\n";
  const modo = estado.modoICMSBaseO || "dentro";
  txt += `NF: ${estado.numeroNF || ""}\n`;
  txt += `Fornecedor: ${estado.nomeFornecedor || ""}\n`;
  txt += `Frete Total: ${estado.frete || "0,00"}\n`;
  txt += `Estado Origem: ${estado.estadoOrigem || ""}\n`;
  txt += `Aliq. Interna: ${estado.aliquotaInterna || "20,00"}\n`;
  txt += `Aliq. Origem: ${estado.aliquotaOrigem || "7,00"}\n`;
  txt += `FCP: ${estado.aliquotaFCP || "0,00"}\n`;
  txt += `Modo ICMS Base O: ${modo === "fora" ? "POR_FORA" : "POR_DENTRO"}\n\n--- PRODUTOS ---\n`;
  const prods = estado.produtos || [];
  const aliqItens = estado.aliquotasItens || {};
  prods.forEach((pr, i) => {
    const aliqD = aliqItens[i]?.destino !== undefined ? aliqItens[i].destino : "";
    const aliqO = aliqItens[i]?.origem !== undefined ? aliqItens[i].origem : "";
    txt += `P${i+1}|${pr.desc || ""}|${pr.valor || "0,00"}|${pr.ipi || "0,00"}|${pr.outras || "0,00"}|${pr.desconto || "0,00"}|${pr.red || "0,00"}|${aliqD}|${aliqO}|${pr.ocst || ""}|${pr.icmsDest || "0,00"}|${pr.ncm || ""}\n`;
  });
  txt += `\n--- FIM NOTA ---\n`;
  return txt;
}

function obterNotaAtivaParaExport() {
  salvarNotaAtiva();
  if (activeNoteId === null && document.getElementById("numeroNF").value) {
    criarNotaAPartirDoFormulario();
  }
  if (activeNoteId !== null) {
    const n = notes.find(x => x.id === activeNoteId);
    if (n) return n;
  }
  return capturarEstadoAtual();
}

function baixarTXT(conteudo, fileName) {
  const blob = new Blob([conteudo], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = fileName; a.click();
  URL.revokeObjectURL(url);
}

function exportarTXT() {
  // Apenas a nota ativa / selecionada
  const nota = obterNotaAtivaParaExport();
  const txt = serializarNotaTXT(nota);
  const nf = nota.numeroNF || "S_N";
  const forn = (nota.nomeFornecedor || "EMITENTE").trim().split(/\s+/).slice(0, 2).join("_");
  baixarTXT(txt, `NFe_${nf}_${forn}.txt`);
  showStatus("✓ TXT da nota atual exportado", "success");
}

function exportarTXTTodas() {
  // Todas as notas abertas
  salvarNotaAtiva();
  let lista = notes.slice();
  if (lista.length === 0) {
    lista = [{ id: "temp", ...capturarEstadoAtual() }];
  }
  let txt = "";
  lista.forEach((nota, i) => {
    if (i > 0) txt += "\n\n";
    txt += serializarNotaTXT(nota);
  });
  const fileName = `Notas_DIFAL_${lista.length}_${new Date().toISOString().slice(0,10)}.txt`;
  baixarTXT(txt, fileName);
  showStatus(`✓ ${lista.length} nota(s) exportada(s) em TXT`, "success");
}


function parseNotaTXT(block) {
  const lines = block.split("\n");
  const estado = {
    numeroNF: "",
    nomeFornecedor: "",
    frete: "0,00",
    estadoOrigem: "",
    aliquotaInterna: "20,00",
    aliquotaOrigem: "7,00",
    aliquotaFCP: "0,00",
    modoICMSBaseO: "dentro",
    produtos: [],
    aliquotasItens: {}
  };
  lines.forEach((line) => {
    if (line.startsWith("NF: ")) estado.numeroNF = line.split(": ").slice(1).join(": ");
    if (line.startsWith("Fornecedor: ")) estado.nomeFornecedor = line.split(": ").slice(1).join(": ");
    if (line.startsWith("Frete Total: ")) estado.frete = line.split(": ").slice(1).join(": ");
    if (line.startsWith("Estado Origem: ")) estado.estadoOrigem = line.split(": ").slice(1).join(": ");
    if (line.startsWith("Aliq. Interna: ")) estado.aliquotaInterna = line.split(": ").slice(1).join(": ");
    if (line.startsWith("Aliq. Origem: ")) estado.aliquotaOrigem = line.split(": ").slice(1).join(": ");
    if (line.startsWith("FCP: ")) estado.aliquotaFCP = line.split(": ").slice(1).join(": ");
    if (line.startsWith("Modo ICMS Base O: ") || line.startsWith("Deduzir ICMS Base O: ")) {
      const val = line.split(": ").slice(1).join(": ").trim();
      estado.modoICMSBaseO = (val === "POR_FORA" || val === "SIM") ? "fora" : "dentro";
    }
    if (line.startsWith("P") && line.includes("|")) {
      const parts = line.split("|");
      const pIdx = estado.produtos.length;
      estado.produtos.push({
        desc: parts[1] || "",
        valor: parts[2] || "0,00",
        ipi: parts[3] || "0,00",
        outras: parts[4] || "0,00",
        desconto: parts[5] || "0,00",
        red: parts[6] || "0,00",
        ocst: parts[9] || "",
        icmsDest: parts[10] || "0,00",
        ncm: parts[11] || ""
      });
      if (parts[7] !== undefined && parts[7] !== "") {
        if (!estado.aliquotasItens[pIdx]) estado.aliquotasItens[pIdx] = {};
        estado.aliquotasItens[pIdx].destino = parseFloat(parts[7]);
      }
      if (parts[8] !== undefined && parts[8] !== "") {
        if (!estado.aliquotasItens[pIdx]) estado.aliquotasItens[pIdx] = {};
        estado.aliquotasItens[pIdx].origem = parseFloat(parts[8]);
      }
    }
  });
  return estado;
}

function importarTXT(content, skipCalc = false) {
  // Suporta arquivo com várias notas (separadas por === CÁLCULO ICMS DIFAL ===)
  const blocks = content.split(/=== CÁLCULO ICMS DIFAL ===/).map(b => b.trim()).filter(b => b.length > 0);

  if (blocks.length === 0) {
    // formato antigo / conteúdo sem marcador: trata como uma nota
    blocks.push(content);
  }

  if (blocks.length > 1 || content.includes("--- FIM NOTA ---")) {
    // Múltiplas notas: cria cada uma no sidebar
    salvarNotaAtiva();
    blocks.forEach((block) => {
      const estado = parseNotaTXT(block);
      const id = gerarIdNota();
      notes.push({ id, ...estado });
      activeNoteId = id;
    });
    if (notes.length > 0) {
      activeNoteId = notes[notes.length - 1].id;
      aplicarEstado(notes.find(n => n.id === activeNoteId));
      renderNoteList();
      if (!skipCalc) calcularDIFAL();
    }
    return;
  }

  // Uma única nota (compatibilidade)
  const estado = parseNotaTXT(blocks[0] || content);
  document.getElementById("listaProdutos").innerHTML = "";
  aliquotasItens = {};
  document.getElementById("numeroNF").value = estado.numeroNF;
  document.getElementById("nomeFornecedor").value = estado.nomeFornecedor;
  document.getElementById("frete").value = estado.frete;
  document.getElementById("estadoOrigem").value = estado.estadoOrigem;
  document.getElementById("aliquotaInterna").value = estado.aliquotaInterna;
  document.getElementById("aliquotaOrigem").value = estado.aliquotaOrigem;
  document.getElementById("aliquotaFCP").value = estado.aliquotaFCP;
  const radio = document.querySelector(`input[name="modoICMSBaseO"][value="${estado.modoICMSBaseO}"]`);
  if (radio) radio.checked = true;
  aliquotasItens = estado.aliquotasItens || {};
  if (estado.produtos.length === 0) {
    adicionarProduto();
  } else {
    estado.produtos.forEach(pr => {
      adicionarProduto(pr.desc, pr.valor, pr.ipi, pr.outras, pr.desconto, pr.red, pr.ocst, pr.icmsDest, pr.ncm || "");
    });
  }
  if (!skipCalc) {
    criarNotaAPartirDoFormulario();
    calcularDIFAL();
  }
}


function adicionarProduto(desc = "", valor = "0,00", ipi = "0,00", outras = "0,00", desconto = "0,00", red = "0,00", ocst = "", icmsDest = "0,00", ncm = "") {
  const lista = document.getElementById("listaProdutos");
  const div = document.createElement("div");
  div.className = "linha-produto produto";
  div.innerHTML = `<div class="campo"><label>Descrição</label><input type="text" class="descProduto" value="${desc}"></div><div class="campo"><label>O/CST</label><input type="text" class="ocstProduto formatar-ocst" value="${ocst}" placeholder="0/00" maxlength="5"></div><div class="campo"><label>NCM</label><input type="text" class="ncmProduto" value="${ncm}" placeholder="00000000" maxlength="10"></div><div class="campo"><label>Valor</label><input type="text" class="valorProduto formatar-br" value="${valor}"></div><div class="campo"><label>IPI</label><input type="text" class="ipiProduto formatar-br" value="${ipi}"></div><div class="campo"><label>Outras</label><input type="text" class="outrasProduto formatar-br" value="${outras}"></div><div class="campo"><label>Desc.</label><input type="text" class="descontoProduto formatar-br" value="${desconto}"></div><div class="campo"><label>Red %</label><input type="text" class="reducaoBase formatar-br" value="${red}"></div><div class="campo"><label>ICMS Origem</label><input type="text" class="icmsDestacado formatar-br" value="${icmsDest}"></div><div class="campo"><label>&nbsp;</label><button class="btn btn-success btn-icon" onclick="adicionarProduto()">+</button></div><div class="campo"><label>&nbsp;</label><button class="btn btn-danger btn-icon" onclick="removerProduto(this)">×</button></div>`;
  lista.appendChild(div);
}

function removerProduto(btn) { if (document.querySelectorAll(".produto").length > 1) btn.closest(".produto").remove(); }

function editarAliquotaNaTabela(celula, tipo, indexProduto) {
  if (celula.querySelector('input')) return;
  const valorAtual = parseFloat(celula.innerText) || 0;
  const input = document.createElement('input');
  input.type = 'number'; input.step = '0.1'; input.value = valorAtual;
  celula.innerHTML = ''; celula.appendChild(input);
  input.focus(); input.select();
  const salvarEdicao = () => {
    const novoValor = parseFloat(input.value) || 0;
    if (!aliquotasItens[indexProduto]) aliquotasItens[indexProduto] = {};
    if (tipo === 'destino') aliquotasItens[indexProduto].destino = novoValor;
    else if (tipo === 'origem') aliquotasItens[indexProduto].origem = novoValor;
    calcularDIFAL();
  };
  input.onblur = salvarEdicao;
  input.onkeypress = (e) => { if (e.key === 'Enter') salvarEdicao(); };
}

function calcularDIFAL() {
  // Sempre salva o estado atual da nota ativa antes de calcular
  salvarNotaAtiva();
  if (activeNoteId === null && document.getElementById("numeroNF").value) {
    criarNotaAPartirDoFormulario();
  }
  const produtos = document.querySelectorAll(".produto");
  const freteTotal = parseBR(document.getElementById("frete").value);
  const aliqFCP = parseBR(document.getElementById("aliquotaFCP").value) / 100;
  const tabela = document.getElementById("tabelaResultados");
  tabela.innerHTML = "";
  let tProd = 0, tBaseD = 0, tBaseO = 0, tDifal = 0, tICMSD = 0, tICMSO = 0, tIPI = 0;
  let tOperacao = 0, tFCP = 0, tCredCalc = 0;
  const fmt = v => formatBR(v);
  const modoICMS = document.querySelector('input[name="modoICMSBaseO"]:checked')?.value || "dentro";
  const deduzirICMS = modoICMS === "fora"; // true = por fora (deduz ICMS Origem)
  const aliqInternaPct = parseBR(document.getElementById("aliquotaInterna").value);
  const aliqOrigemPct = parseBR(document.getElementById("aliquotaOrigem").value);
  let somaValorProdutos = 0;
  produtos.forEach(p => somaValorProdutos += parseBR(p.querySelector(".valorProduto").value));
  produtos.forEach((p, idx) => {
    const desc = p.querySelector(".descProduto").value || `Item ${idx+1}`;
    const ocstRaw = p.querySelector(".ocstProduto").value || "";
    const ncmVal = p.querySelector(".ncmProduto") ? p.querySelector(".ncmProduto").value : "";
    const vProd = parseBR(p.querySelector(".valorProduto").value);
    const vIPI = parseBR(p.querySelector(".ipiProduto").value);
    const vOutras = parseBR(p.querySelector(".outrasProduto").value);
    const vDesc = parseBR(p.querySelector(".descontoProduto").value);
    const pRed = parseBR(p.querySelector(".reducaoBase").value);
    const aliqD = (aliquotasItens[idx]?.destino !== undefined ? aliquotasItens[idx].destino : aliqInternaPct) / 100;
    const aliqO = (aliquotasItens[idx]?.origem !== undefined ? aliquotasItens[idx].origem : aliqOrigemPct) / 100;
    const freteItem = somaValorProdutos > 0 ? (vProd / somaValorProdutos) * freteTotal : 0;
    const vOperacao = vProd - vDesc + vIPI + vOutras + freteItem;

    // Crédito ICMS Origem
    let baseO = vOperacao * (1 - pRed / 100);
    const credOCalc = baseO * aliqO; // cálculo normal (V.Op × alíq)
    // ICMS destacado na nota (campo); se zerado, usa o calculado
    let icmsDestacado = parseBR(p.querySelector(".icmsDestacado").value);
    if (icmsDestacado === 0) {
      icmsDestacado = credOCalc;
      p.querySelector(".icmsDestacado").value = formatBR(credOCalc);
    }
    // Para DIFAL e Base (por fora): usa o ICMS destacado
    const credO = icmsDestacado;
    // Por fora: deduz ICMS destacado da Base O
    if (deduzirICMS) {
      baseO = Math.max(0, baseO - credO);
    }

    // Base DESTINO depende do modo
    let baseD;
    if (deduzirICMS) {
      // POR FORA: (V. Operação − ICMS destacado) / (1 − Aliq. Interna)
      const vAposDeduz = Math.max(0, vOperacao - credO);
      baseD = (vAposDeduz / (1 - aliqD)) * (1 - pRed / 100);
    } else {
      // POR DENTRO: V. Operação / (1 − Aliq. Interna)
      baseD = (vOperacao / (1 - aliqD)) * (1 - pRed / 100);
    }

    const icmsD = baseD * aliqD;
    const valFCP = baseD * aliqFCP;
    // DIFAL usa o crédito CALCULADO (não o destacado)
    const difal = (icmsD + valFCP) - credOCalc;
    // % = 20 − ((DIFAL / (Valor + IPI)) × 100)
    const basePct = vProd + vIPI;
    const pctCol = basePct > 0 ? (20 - ((difal / basePct) * 100)) : 0;

    tProd += vProd; tIPI += vIPI;
    tOperacao += vOperacao; tBaseD += baseD; tBaseO += baseO;
    tICMSD += icmsD; tICMSO += credO; tCredCalc += credOCalc; tFCP += valFCP; tDifal += difal;

    let infoCombinada = "";
    if (ocstRaw.includes("/")) {
      const parts = ocstRaw.split("/");
      const dOrig = tabelaOrigem[parts[0]] || "Desconhecido";
      const dCst = tabelaCST[parts[1]] || "Desconhecido";
      infoCombinada = `<span class="ocst-info"><span class="ocst-code">${ocstRaw}</span> ${dOrig} - ${dCst}</span>`;
    }

    tabela.innerHTML += `<tr><td title="${desc}">${desc}${infoCombinada}</td><td>${ncmVal || '-'}</td><td>${fmt(vProd)}</td><td>${fmt(vIPI)}</td><td>${pRed > 0 ? pRed.toFixed(2) + '%' : '0,00'}</td><td>${fmt(baseD)}</td><td>${fmt(baseO)}</td><td class="editavel" onclick="editarAliquotaNaTabela(this, 'destino', ${idx})">${(aliqD * 100).toFixed(1)}%</td><td class="editavel" onclick="editarAliquotaNaTabela(this, 'origem', ${idx})">${(aliqO * 100).toFixed(1)}%</td><td>${fmt(icmsD)}</td><td>${fmt(credO)}</td><td>${fmt(difal)}</td><td>${basePct > 0 ? fmt(pctCol) : '-'}</td></tr>`;
  });
  document.getElementById("totalProdutos").innerText = fmt(tProd);
  document.getElementById("totalIPI").innerText = fmt(tIPI);
  document.getElementById("totalBaseDestino").innerText = fmt(tBaseD);
  document.getElementById("totalBaseOrigem").innerText = fmt(tBaseO);
  document.getElementById("totalICMSDestino").innerText = fmt(tICMSD);
  document.getElementById("totalICMSOrigem").innerText = fmt(tICMSO);
  document.getElementById("totalDifal").innerText = fmt(tDifal);

  // ========== EXPLICAÇÃO GERAL (formato solicitado) ==========
  const modoTxt = deduzirICMS ? "ICMS por fora" : "ICMS por dentro";
  const fatorBase = (1 - aliqInternaPct / 100);
  const fatorStr = fatorBase.toFixed(2).replace(".", ",");

  let baseCalcLinha;
  if (deduzirICMS) {
    // Por fora: (V. Operação − ICMS Origem) / (1 − Aliq. Interna)
    const vApos = Math.max(0, tOperacao - tICMSO);
    baseCalcLinha = `Base Cálc: (V. Operação − ICMS destacado) / (1 − Aliq. Interna) &nbsp; (R$&nbsp;${fmt(tOperacao)} − R$&nbsp;${fmt(tICMSO)}) / ${fatorStr} = R$&nbsp;${fmt(tBaseD)}`;
  } else {
    baseCalcLinha = `Base Cálc: V. Operação / (1 − Aliq. Interna) &nbsp; R$&nbsp;${fmt(tOperacao)} / ${fatorStr} = R$&nbsp;${fmt(tBaseD)}`;
  }

  const fcpLinha = tFCP > 0.005
    ? `<p>FCP: Base de cálculo × Alíquota FCP &nbsp; R$&nbsp;${fmt(tBaseD)} × ${fmt(parseBR(document.getElementById("aliquotaFCP").value))}% = R$&nbsp;${fmt(tFCP)}</p>`
    : "";

  const difalPartes = tFCP > 0.005
    ? `R$&nbsp;${fmt(tICMSD)} + R$&nbsp;${fmt(tFCP)} − R$&nbsp;${fmt(tCredCalc)}`
    : `R$&nbsp;${fmt(tICMSD)} − R$&nbsp;${fmt(tCredCalc)}`;

  let html = `<h3>📊 Explicação Geral do Cálculo — <span style="color:var(--ecac-blue)">${modoTxt}</span></h3>
  <div class="item-explicacao" style="line-height:1.55;">
    <p>Operação: (Prod − Desc + IPI + Outras + Frete) = R$&nbsp;${fmt(tOperacao)}</p>
    <p>${baseCalcLinha}</p>
    <p>ICMS Dest: Base de cálculo × Alíquota interna &nbsp; R$&nbsp;${fmt(tBaseD)} × ${fmt(aliqInternaPct)}% = R$&nbsp;${fmt(tICMSD)}</p>
    <p>Crédito: V. Operação × Alíquota interestadual &nbsp; R$&nbsp;${fmt(tOperacao)} × ${fmt(aliqOrigemPct)}% = R$&nbsp;${fmt(tCredCalc)}</p>
    ${fcpLinha}
    <p>Difal: ICMS Destino${tFCP > 0.005 ? " + FCP" : ""} − Crédito &nbsp; ${difalPartes} = <strong style="font-size:1.1rem;color:#065f46;">R$&nbsp;${fmt(tDifal)}</strong></p>
  </div>`;
  document.getElementById("explicacao").innerHTML = html;
}


function calcularNotaParaExport(estado) {
  // Calcula DIFAL de uma nota a partir do estado (sem depender do DOM ativo)
  const freteTotal = parseBR(estado.frete || "0,00");
  const aliqFCP = parseBR(estado.aliquotaFCP || "0,00") / 100;
  const aliqInternaPct = parseBR(estado.aliquotaInterna || "20,00");
  const aliqOrigemPct = parseBR(estado.aliquotaOrigem || "7,00");
  const deduzirICMS = (estado.modoICMSBaseO || "dentro") === "fora";
  const produtos = estado.produtos || [];
  const aliqItens = estado.aliquotasItens || {};

  let somaValor = 0;
  produtos.forEach(pr => somaValor += parseBR(pr.valor || "0,00"));

  const linhas = [];
  let tProd = 0, tIPI = 0, tBaseD = 0, tBaseO = 0, tICMSD = 0, tICMSO = 0, tDifal = 0, tOperacao = 0, tFCP = 0;

  produtos.forEach((pr, idx) => {
    const vProd = parseBR(pr.valor || "0,00");
    const vIPI = parseBR(pr.ipi || "0,00");
    const vOutras = parseBR(pr.outras || "0,00");
    const vDesc = parseBR(pr.desconto || "0,00");
    const pRed = parseBR(pr.red || "0,00");
    const aliqD = (aliqItens[idx]?.destino !== undefined ? aliqItens[idx].destino : aliqInternaPct) / 100;
    const aliqO = (aliqItens[idx]?.origem !== undefined ? aliqItens[idx].origem : aliqOrigemPct) / 100;
    const freteItem = somaValor > 0 ? (vProd / somaValor) * freteTotal : 0;
    const vOperacao = vProd - vDesc + vIPI + vOutras + freteItem;

    let baseO = vOperacao * (1 - pRed / 100);
    const credOCalc = baseO * aliqO;
    let credO = parseBR(pr.icmsDest || "0,00");
    if (credO === 0) credO = credOCalc;

    if (deduzirICMS) {
      baseO = Math.max(0, baseO - credO);
    }

    let baseD;
    if (deduzirICMS) {
      const vAposDeduz = Math.max(0, vOperacao - credO);
      baseD = (vAposDeduz / (1 - aliqD)) * (1 - pRed / 100);
    } else {
      baseD = (vOperacao / (1 - aliqD)) * (1 - pRed / 100);
    }

    const icmsD = baseD * aliqD;
    const valFCP = baseD * aliqFCP;
    // DIFAL usa crédito calculado
    const difal = (icmsD + valFCP) - credOCalc;
    // % = 20 − ((DIFAL / (Valor + IPI)) × 100)
    const basePct = vProd + vIPI;
    const pctCol = basePct > 0 ? (20 - ((difal / basePct) * 100)) : 0;

    tProd += vProd; tIPI += vIPI; tOperacao += vOperacao;
    tBaseD += baseD; tBaseO += baseO;
    tICMSD += icmsD; tICMSO += credO; tFCP += valFCP; tDifal += difal;

    linhas.push({
      desc: pr.desc || `Item ${idx + 1}`,
      ocst: pr.ocst || "",
      ncm: pr.ncm || "",
      valor: vProd,
      ipi: vIPI,
      red: pRed,
      baseD,
      baseO,
      aliqD: aliqD * 100,
      aliqO: aliqO * 100,
      icmsD,
      icmsO: credO,
      difal,
      pct: pctCol
    });
  });

  return {
    numeroNF: estado.numeroNF || "",
    nomeFornecedor: estado.nomeFornecedor || "",
    frete: freteTotal,
    estadoOrigem: estado.estadoOrigem || "",
    modo: deduzirICMS ? "POR FORA" : "POR DENTRO",
    aliqInterna: aliqInternaPct,
    aliqOrigem: aliqOrigemPct,
    linhas,
    totais: { tProd, tIPI, tBaseD, tBaseO, tICMSD, tICMSO, tDifal, tOperacao, tFCP }
  };
}

function montarPlanilhaExcel(lista, fileName) {
  if (typeof XLSX === "undefined") {
    alert("Biblioteca Excel não carregou. Verifique a conexão com a internet e recarregue a página.");
    return;
  }
  const aoa = [];
  // Excel: Item só com descrição (sem O/CST). NCM em coluna própria. Sem coluna O-CST.
  aoa.push([
    "NF", "Fornecedor", "Item", "NCM", "Valor (R$)", "IPI (R$)", "Red %",
    "Base D (R$)", "Base O (R$)", "Al D %", "Al O %",
    "ICMS D (R$)", "ICMS O (R$)", "DIFAL (R$)", "%"
  ]);

  let difalGeral = 0;
  let tProd = 0, tIPI = 0, tBaseD = 0, tBaseO = 0, tICMSD = 0, tICMSO = 0;

  lista.forEach((nota, nIdx) => {
    const r = calcularNotaParaExport(nota);
    difalGeral += r.totais.tDifal;
    tProd += r.totais.tProd;
    tIPI += r.totais.tIPI;
    tBaseD += r.totais.tBaseD;
    tBaseO += r.totais.tBaseO;
    tICMSD += r.totais.tICMSD;
    tICMSO += r.totais.tICMSO;

    r.linhas.forEach(l => {
      aoa.push([
        r.numeroNF || "S/N",
        r.nomeFornecedor || "",
        l.desc,                    // só a descrição, sem O/CST
        l.ncm || "",               // NCM em coluna própria
        Number(l.valor.toFixed(2)),
        Number(l.ipi.toFixed(2)),
        Number(l.red.toFixed(2)),
        Number(l.baseD.toFixed(2)),
        Number(l.baseO.toFixed(2)),
        Number(l.aliqD.toFixed(1)),
        Number(l.aliqO.toFixed(1)),
        Number(l.icmsD.toFixed(2)),
        Number(l.icmsO.toFixed(2)),
        Number(l.difal.toFixed(2)),
        Number((l.pct || 0).toFixed(2))
      ]);
    });
  });

  // Totalização no final (sempre, mesmo com 1 nota)
  // Colunas: NF, Fornecedor, Item, NCM, Valor, IPI, Red, BaseD, BaseO, AlD, AlO, ICMSD, ICMSO, DIFAL, %
  aoa.push([]);
  aoa.push([
    "TOTAIS", "", "", "",
    Number(tProd.toFixed(2)),
    Number(tIPI.toFixed(2)),
    "",
    Number(tBaseD.toFixed(2)),
    Number(tBaseO.toFixed(2)),
    "", "",
    Number(tICMSD.toFixed(2)),
    Number(tICMSO.toFixed(2)),
    Number(difalGeral.toFixed(2)),
    ""
  ]);

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = [
    { wch: 12 }, { wch: 30 }, { wch: 45 }, { wch: 12 }, { wch: 12 }, { wch: 10 }, { wch: 8 },
    { wch: 12 }, { wch: 12 }, { wch: 8 }, { wch: 8 },
    { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 8 }
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Relatório DIFAL");
  XLSX.writeFile(wb, fileName);
  showStatus("✓ Excel exportado: " + fileName, "success");
}

function exportarExcel() {
  // Apenas a nota ativa
  const nota = obterNotaAtivaParaExport();
  const nf = nota.numeroNF || "S_N";
  const forn = (nota.nomeFornecedor || "EMITENTE").trim().split(/\s+/).slice(0, 2).join("_");
  montarPlanilhaExcel([nota], `NF_${nf}_${forn}.xlsx`);
}

function exportarExcelTodas() {
  // Todas as notas + total geral
  salvarNotaAtiva();
  let lista = notes.slice();
  if (lista.length === 0) {
    lista = [{ id: "temp", ...capturarEstadoAtual() }];
  }
  const dataStr = new Date().toISOString().slice(0, 10);
  montarPlanilhaExcel(lista, `Relatorio_ICMS_DIFAL_${lista.length}notas_${dataStr}.xlsx`);
}
