ao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 21, "texto": "Em 01/06/2024, uma joalheria adquiriu 40 anéis pelo valor unitário de R$ 800. O frete para a entrega e o seguro do transporte foram, respectivamente, de R$ 500 e R$ 1.600. Os valores foram pagos à vista pela joalheria. O custo do estoque no balanço patrimonial da joalheria, antes do início das vendas, é de (A) R$ 32.000. (B) R$ 32.500. (C) R$ 33.600. (D) R$ 34.100.", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 22, "texto": "Em 01/05/2022, uma loja de roupas pagou R$ 180.000 a terceiros, referentes ao aluguel antecipado de 3 anos do imóvel onde funcionava a sua loja, contados a partir da data de pagamento. Em 31/12/2023, a despesa antecipada de aluguel no ativo realizável a longo prazo da loja era (A) zero. (B) R$ 20.000. (C) R$ 60.000. (D) R$ 80.000. EXAME DE SUFICIÊNCIA 2024/2 TIPO 1 – PÁGINA 7 CONSELHO FEDERAL DE CONTABILIDADE - CFC FGV CONHECIMENTO", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 23, "texto": "Em janeiro de 2024, a despesa relacionada a salários de uma sociedade empresária era de R$ 500.000. Desse valor, R$ 120.000 representava imposto de renda retido na fonte. Assinale a opção que indica o lançamento contábil realizado em 31/01/2024 para reconhecer os efeitos decorrentes do fato, considerando que os salários da entidade são pagos no 5º dia útil do mês seguinte ao do fato gerador. (A) D - Despesa de salários R$ 380.000 D - Despesa de IR R$ 120.000 C - salários a pagar R$ 500.000 (B) D - Despesa de salários R$ 380.000 D - Despesa de IR R$ 120.000 C - IR na fonte a recolher R$ 120.000 C - salários a pagar R$ 380.000 (C) D - Despesa de salários R$ 500.000 C - IR na fonte a recolher R$ 120.000 C - salários a pagar R$ 380.000 (D) D - Despesa de salários R$ 500.000 C - salários a pagar R$ 500.000", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 24, "texto": "Assinale a opção que indica uma conta do passivo de uma entidade que não deve ser classificada como passivo circulante de acordo com a NBC TG 26 (R5) – APRESENTAÇÃO DAS DEMONSTRAÇÕES CONTÁBEIS. (A) Imposto de renda diferido. (B) Empréstimo contraído de diretor. (C) Receita recebida antecipadamente. (D) Adiantamento recebido de sociedade controlada.", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 25, "texto": "Uma loja de roupas funciona em um imóvel alugado de terceiros. A despesa com aluguel é classificada na Demonstração do Valor Adicionado da loja como (A) insumos adquiridos de terceiros. (B) remuneração de capitais próprios. (C) remuneração de capitais de terceiros. (D) depreciação, amortização e exaustão.", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 26, "texto": "De acordo com a NBC TG 36 (R3) – DEMONSTRAÇÕES CONSOLIDADAS, o investidor, independentemente da natureza de seu envolvimento com a investida, deve determinar se é controlador avaliando se controla a investida. Em relação ao controle, considere os itens a seguir: I. Poder sobre a investida. II. Exposição a, ou direitos sobre, retornos variáveis decorrentes de seu envolvimento com a investida. III. Capacidade de utilizar seu poder sobre a investida para afetar o valor de seus retornos. IV. Mais do que a metade das ações com poder de voto da investida. O investidor controla a investida se possuir os atributos apresentados em (A) I, II e IV, somente. (B) I e III, somente. (C) II, III e IV, somente. (D) I, II e III, somente. EXAME DE SUFICIÊNCIA 2024/2 TIPO 1 – PÁGINA 8 CONSELHO FEDERAL DE CONTABILIDADE - CFC FGV CONHECIMENTO", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 27, "texto": "Um hospital localizado no Centro da cidade adquiriu um terreno ao lado de seu prédio para a construção de um estacionamento para ser utilizado, exclusivamente, pelos pacientes, de modo a oferecer melhor atendimento. No Balanço Patrimonial do hospital, o terreno deve ser classificado como (A) Ativo Imobilizado. (B) Ativo Realizável a Longo Prazo. (C) Propriedade para investimento. (D) Ativo não circulante mantido para a venda.", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 28, "texto": "Com relação às Demonstrações Financeiras, de acordo com a Lei nº 6.404/76 e modificações, avalie as afirmativas a seguir e assinale (V) para a verdadeira e (F) para a falsa. ( ) As demonstrações de cada exercício serão publicadas com a indicação dos valores correspondentes das demonstrações do exercício anterior. ( ) Nas demonstrações, não poderá haver agrupamento de contas semelhantes. ( ) As demonstrações financeiras registrarão a destinação dos lucros segundo a proposta dos órgãos da administração, e o valor será considerado definitivo. ( ) As demonstrações serão complementadas por notas explicativas e outros quadros analíticos ou demonstrações contábeis necessárias para esclarecimento da situação patrimonial e dos resultados do exercício. As afirmativas são, respectivamente, (A) V – V – F – F. (B) V – F – F – V. (C) F – V – F – V. (D) V – F – V – F.", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 29, "texto": "O ativo fiscal diferido é o valor do tributo sobre o lucro recuperável em período futuro relacionado ao que se afirma a seguir, com exceção de (A) diferenças temporárias dedutíveis. (B) diferenças temporárias tributáveis. (C) compensação futura de prejuízos fiscais não utilizados. (D) compensação futura de créditos fiscais não utilizados.", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 30, "texto": "A Cia. Verde Amarela é uma empresa brasileira que vende objetos relacionados à Seleção Masculina de Futebol. Em 31/12/2022, a empresa apresentou lucro líquido de R$ 800.000 em sua Demonstração do Resultado do Exercício. No entanto, estimou que o lucro apresentaria uma redução de 80% em 2023. Com a finalidade de segregar uma parcela do lucro em 2022, a Cia. Verde Amarela poderia constituir, em 31/12/2022, (A) reserva para contingências. (B) reserva de lucros a realizar. (C) reserva de lucros para expansão. (D) ajuste de avaliação patrimonial.", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 31, "texto": "Um curso de idiomas oferecia aulas de inglês, espanhol e japonês. Em 2024, a gerência do curso resolveu extinguir a oferta de aulas de japonês e espanhol, passando a oferecer apenas aulas de inglês. A reorganização dos cursos teve efeito material na natureza e no foco das operações do curso, de modo que foi constituída uma provisão para reestruturação. Assinale a opção que indica gastos que podem ser incluídos no valor da provisão. (A) Novo treinamento da equipe permanente. (B) Investimento em novos sistemas e redes de distribuição. (C) Gastos incrementais de marketing relacionado ao curso de inglês. (D) Indenização aos proprietários das salas onde eram ofertados os cursos e que deixaram de ser utilizadas. EXAME DE SUFICIÊNCIA 2024/2 TIPO 1 – PÁGINA 9 CONSELHO FEDERAL DE CONTABILIDADE - CFC FGV CONHECIMENTO", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 32, "texto": "Em 01/01/2020, uma sociedade empresária adquiriu uma van para transportar os seus empregados por R$ 300.000. A vida útil foi estimada em 15 anos e não foi considerado valor residual. Em 2023, essa van apresentou diversos problemas que ocasionaram gastos de R$ 24.000 com reparos. Por conta dos problemas, a sociedade empresária decidiu comprar uma nova van e, em 31/12/2023, vendeu a antiga por R$ 250.000. O lucro obtido com a venda da van, considerando que a sociedade empresária utiliza o método da linha reta para depreciar os seus ativos imobilizados, foi de (A) R$ 6.000. (B) R$ 10.000. (C) R$ 28.000. (D) R$ 30.000.", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 33, "texto": "Uma sociedade empresária elaborou a seguinte Demonstração do Resultado do Exercício: Receita de Vendas 100.000 Custo dos produtos e serviços vendidos -50.000 Lucro bruto 50.000 Outras receitas 20.000 Despesas de vendas -5.000 Despesas administrativas -10.000 Outras despesas -12.000 Resultado antes dos tributos 43.000 De acordo com a NBC TG 26 (R5) – APRESENTAÇÃO DAS DEMONSTRAÇÕES CONTÁBEIS, a demonstração é elaborada de acordo com o método da (A) função da despesa e não é necessária divulgação adicional. (B) natureza da despesa e não é necessária divulgação adicional. (C) função da despesa e a sociedade empresária deve divulgar informação adicional sobre a natureza das despesas. (D) natureza da despesa e a sociedade empresária deve divulgar informação adicional sobre a função das despesas.", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 34, "texto": "Em 31/12/2023, uma loja de cosméticos apresentava os seguintes saldos em seu Balanço Patrimonial: Disponibilidades: ................................................................... R$ 55.000; Estoques: ............................................................................... R$ 30.000; Clientes:................................................................................. R$ 20.000; Equipamentos de Informática: .............................................. R$ 45.000; Salários a pagar: .................................................................... R$ 15.000; Empréstimos: ........................................................................ R$ 35.000; Capital Social: ...................................................................... R$ 120.000; Prejuízos Acumulados: .......................................................... R$ 20.000. No primeiro trimestre de 2024, aconteceram os seguintes fatos: • Venda, à vista, de todo o estoque por R$ 80.000; • Recebimento do saldo dos clientes; • Venda, à vista, dos equipamentos de informática por R$ 60.000; • Pagamento dos salários do ano anterior; • Pagamento do empréstimo bancário contraído; • Reconhecimento e pagamento de despesas gerais por R$ 100.000. Em relação ao primeiro trimestre de 2024, é correto afirmar que a atividade operacional (A) gerou fluxo líquido de caixa no montante de R$ 10.000. (B) gerou flux [...]", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 35, "texto": "Avalie se as divulgações relacionadas aos estoques de uma sociedade empresária devem incluir: I. valor de estoques reconhecido como despesa durante o período; II. valor de estoques escriturados pelo valor justo menos os custos de venda; III. valor total escriturado em estoques e o valor registrado em outras contas apropriadas para a entidade. De acordo com a NBC TG 16 (R2) – ESTOQUES, está correto o que se afirma em (A) I e II, somente. (B) I e III, somente. (C) II e III, somente. (D) I, II e III.", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 36, "texto": "As Notas Explicativas são informações complementares às demonstrações contábeis exigidas pela Lei nº 6.404/76 e alterações. Sobre as Notas Explicativas, analise as seguintes afirmativas: I. As Notas Explicativas devem apresentar informações sobre a base de preparação das demonstrações financeiras e das práticas contábeis específicas selecionadas e aplicadas para negócios e eventos significativos. II. É obrigatória a indicação de eventos subsequentes à data de encerramento do exercício, mesmo aqueles que não tenham efeito relevante sobre a situação financeira e os resultados futuros da companhia. III. A entidade pode retificar políticas contábeis inadequadas por meio da divulgação de notas explicativas. Está correto o que se afirma em (A) I, II e III. (B) I e II, apenas. (C) II e III, apenas. (D) I, apenas.", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 37, "texto": "Uma empresa comercial apresentou, no mês de abril de X0, as seguintes movimentações em seu estoque: Data Movimentação 01.04 Estoque Inicial: 200 unidades por R$ 10 a unidade 08.04 Compras de 210 unidades por R$ 12 a unidade 10.04 Devolução de compras em 08.04: 50 unidades 12.04 Vendas de 150 unidades por R$ 22 a unidade 17.04 Devolução de vendas de 10.04: 30 unidades 22.04 Compras de 150 unidades por R$ 15 a unidade Considerando que a empresa utilize o método PEPS para controle de estoques, assinale a opção que contenha o Custo das Mercadorias vendidas para o período e o valor do estoque final em 30.04.X0, respectivamente. Desconsidere quaisquer aspectos tributários. (A) R$ 1.500; R$ 3.770. (B) R$ 1.200; R$ 4.970. (C) R$ 1.500; R$ 4.970. (D) R$ 1.200; R$ 3.770. EXAME DE SUFICIÊNCIA 2024/2 TIPO 1 – PÁGINA 11 CONSELHO FEDERAL DE CONTABILIDADE - CFC FGV CONHECIMENTO", "gabarito": "ANULADA", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 38, "texto": "Uma indústria fabrica um determinado produto cuja produção passa por dois departamentos até ser finalizada. Em junho de 2024 foram extraídos os seguintes dados dos controles internos dessa indústria: Departamento 1 Departamento 2 Saldo inicial 0 0 Unidades iniciadas em junho 100.000 80.000 Unidades finalizadas em junho 80.000 40.000 Matéria-prima (R$) 120.000 80.000 Matéria-prima (kg) 100 40 Mão-de-obra direta (R$) 140.000 100.000 Mão-de-obra direta (hora) 120 180 Estágio de fabricação 60% 10% Os custos indiretos de fabricação totalizaram R$ 500.000 e são apropriados aos departamentos com base na quantidade de horas de mão-de-obra direta. Considerando-se exclusivamente os dados acima e levando-se em consideração o conceito de equivalente de produção, o custo unitário da produção finalizada em junho de 2024 foi de (A) R$ 15,91. (B) R$ 20,00. (C) R$ 22,00. (D) R$ 25,00.", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 39, "texto": "A empresa Montes Altos S.A., que planeja e controla seus custos utilizando o custo padrão, levantou as informações abaixo referentes ao mês de junho de 2024: Itens Custo Padrão Custo Real Matéria prima 20 kg a R$ 10,00/kg 19 kg a R$ 11,00/kg Mão de obra direta 2 h a R$ 20,00/h 3h a R$ 18,00/h Embalagem 10 folhas a R$ 1,00/folha 10 folhas a R$ 0,90/folha Custos indiretos R$ 30.000,00 R$ 32.000,00 Unidades produzidas 15.000 14.900 Considerando apenas as informações apresentadas, a variação de preço unitária da matéria prima foi, em reais, de (A) R$ 19,00 desfavorável. (B) R$ 19,00 favorável. (C) R$ 20,00 desfavorável. (D) R$ 20,00 favorável. EXAME DE SUFICIÊNCIA 2024/2 TIPO 1 – PÁGINA 12 CONSELHO FEDERAL DE CONTABILIDADE - CFC FGV CONHECIMENTO", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 40, "texto": "A empresa Recife Contabilidade e Assessoria Ltda. oferece dois tipos de serviços contábeis: Legalização de Empresas e Escrituração Contábil. A empresa projeta os seguintes volumes anuais de serviços para cada categoria: Legalização de Empresas: 10 projetos por ano; Escrituração Contábil: 20 empresas por ano. Os custos diretos e o preço cobrado por cada serviço são os seguintes: Serviço Custos Diretos Preço do serviço Legalização de Empresa R$ 2.500 por projeto R$ 10.000 por projeto Escrituração Contábil R$ 15.600 por empresa/ano R$ 36.000 por empresa/ano A empresa verificou que os custos indiretos, que totalizavam R$ 265.000 ao ano, se referiam às seguintes atividades: • Captação de clientes: R$ 25.000 por ano • Análise documental: R$ 50.000 por ano • Elaboração e emissão de relatórios: R$ 190.000 por ano A administração fez um levantamento dos direcionadores de custos anuais dessas atividades. São eles: Legalização de empresa Escrituração contábil Direcionadores Total Qtd % Qtd % Tempo de captação de clientes (em horas) 12.960 60% 8.640 40% 21.600 Número de lotes de documentação analisada 9.225 25% 27.675 75% 36.900 Número de relatórios elaborados e emitidos 636 1% 62.964 99% 63.600 Diante desses dados, o custo total anual do serviço Legalização de Empresa usando o Custeio Baseado em Atividades (ABC) é de (A) R$ 31.900. (B) R$ 54.400. (C) R$ 29.400. (D) R$ 47.821.", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 41, "texto": "Um analista realizou a análise horizontal do balanço patrimonial de dois supermercados com a finalidade de recomendar o investimento em um deles. Um fato que pode ser constatado diretamente por meio dessa análise é (A) a diminuição das despesas de salários. (B) o aumento das obrigações com terceiros. (C) a mudança na composição do resultado obtido. (D) a abrangência do ativo circulante em relação ao total do ativo.", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 42, "texto": "Em 31/12/2023, um supermercado apresentava os seguintes saldos em seu Balanço Patrimonial: Clientes (60 dias):.................................................................................................... R$ 20.000; Estoque de produtos não perecíveis: ..................................................................... R$ 30.000; Estoque de produtos com data de validade de até 90 dias: ................................... R$ 40.000; Disponibilidades:..................................................................................................... R$ 50.000; Estoque de produtos com data de validade de 91 a 360 dias: ............................... R$ 60.000; Fornecedores (90 dias): .......................................................................................... R$ 70.000; Empréstimos (720 dias): ....................................................................................... R$ 130.000; Móveis e utensílios: .............................................................................................. R$ 150.000; Patrimônio Líquido: .............................................................................................. R$ 150.000. A liquidez imediata do supermercado em 31/12/2023 foi de (A) 0,71. (B) 1,00. (C) 1,29. (D) 0,25. EXAME DE SUFICIÊNCIA 2024/2 TIPO 1 – PÁGINA 13 CONSELHO FEDERAL DE CONTABILIDADE - CFC FGV CONHECIMENTO", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 43, "texto": "Em 01/01/2024, o Governo de um Estado assinou um contrato com uma entidade terceirizada para a construção de uma nova linha de metrô. De acordo com o contrato, o Governo deverá pagar R$ 800 milhões ao longo de dez anos, e a obra tem previsão de duração de 4 anos. No momento da assinatura do contrato, o impacto no Balanço Patrimonial do Governo será: (A) nenhum. (B) aumento e diminuição de R$ 800 milhões no ativo. (C) aumento de R$ 800 milhões no ativo e no passivo. (D) diminuição de R$ 800 milhões no ativo e no patrimônio líquido.", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 44, "texto": "De acordo com o Manual de Contabilidade Aplicada ao Setor Público (MCASP), entre os objetivos do Plano de Contas Aplicado ao Setor Público está distinguir os registros de natureza patrimonial, orçamentária e de controle. A natureza de informação de controle registra, processa e evidencia os atos de gestão com função específica de controle, bem como aqueles (A) cujos efeitos são apenas de longo prazo. (B) relacionados ao planejamento e à execução orçamentária. (C) cujos efeitos possam produzir modificações no patrimônio da entidade do setor público. (D) relacionados com a composição do patrimônio público e suas variações qualitativas e quantitativas.", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 45, "texto": "As receitas orçamentárias podem ser classificadas como Receitas Correntes e Receitas de Capital. Assinale a opção que indica apenas receitas correntes. (A) patrimonial e agropecuária. (B) patrimonial e alienação de bens. (C) operações de crédito e agropecuária. (D) alienação de bens e operações de crédito.", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 46, "texto": "Em relação a compliance, analise as afirmativas abaixo: I. Compliance é a busca permanente de coerência entre aquilo que se espera de uma organização e o que ela, de fato, pratica no dia a dia. II. O programa de compliance de uma organização deve abranger um conjunto de mecanismos e procedimentos, políticas, diretrizes, código de conduta, canal de denúncias e demais instrumentos com o objetivo de prevenir, detectar e sanar desvios de conduta, fraudes, atos de corrupção, lavagem de dinheiro, atos ilícitos praticados contra a administração pública, dentre outras questões. III. Os auditores externos (independentes) devem se comprometer e apoiar o fomento da cultura ética e o fortalecimento do programa de compliance da organização que auditam. IV. O comitê de auditoria estatutário deve declarar ostensiva e publicamente a importância dos valores e das políticas que compõem o programa de compliance da organização, atuando sempre de maneira inequívoca e coerente com aquilo que pregam. Estão corretas as afirmativas (A) I, II e III. (B) II e IV, apenas. (C) I e II, apenas. (D) III e IV, apenas. EXAME DE SUFICIÊNCIA 2024/2 TIPO 1 – PÁGINA 14 CONSELHO FEDERAL DE CONTABILIDADE - CFC FGV CONHECIMENTO", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 47, "texto": "A Estrutura Conceitual para Trabalhos de Asseguração define os objetivos e elementos essenciais dos serviços de auditoria, destacando a importância de uma abordagem sistemática e disciplinada na emissão de opiniões. Os dois tipos de trabalho de asseguração são (A) a Direta e a Indireta. (B) a Limitada e a Direta. (C) a Razoável e a Indireta. (D) a Limitada e Razoável.", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 48, "texto": "O auditor João Batista, ao realizar um trabalho de auditoria para a AXT Ltda., constatou deficiências no controle interno da entidade e, ao aplicar testes, verificou que tais deficiências eram significativas, individualmente ou em conjunto. Considerando os postulados da NBC TA 265 – COMUNICAÇÃO DE DEFICIÊNCIAS DE CONTROLE INTERNO, o procedimento adequado a ser seguido por João Batista nessa situação é (A) declarar isenção por se tratar de assuntos internos da entidade. (B) confrontar diretamente o Controle Interno. (C) reportar por escrito as deficiências encontradas tempestivamente a administração. (D) registrar em ata, e divulgar ao término da auditoria.", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 49, "texto": "A perícia contábil é essencial para garantir uma solução justa e fundamentada em litígios, tanto judiciais quanto extrajudiciais, ao fornecer uma análise técnica e científica acerca dos fatos envolvidos. De acordo com a NBC TP 01 – PERÍCIA CONTÁBIL, o principal objetivo da perícia contábil no contexto judicial e extrajudicial é (A) avaliar o desempenho financeiro das empresas envolvidas no litígio. (B) fornecer elementos de prova necessários para subsidiar a justa solução do litígio. (C) estabelecer a culpa das partes envolvidas no processo. (D) emitir pareceres financeiros para fins de auditoria interna.", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 50, "texto": "A sociedade empresária “Alfa e Ômega Ltda.” é uma sociedade limitada composta por três sócios: João, Maria e Pedro. Os percentuais de participação no capital social são os seguintes: João 40%, Maria 35%, e Pedro 25%. A sociedade empresária está avaliada com os seguintes valores em 31 de dezembro de 20XX: Ativo Circulante: ................................................................... R$ 1.200.000; Ativo Não Circulante: ............................................................ R$ 2.500.000; Passivo Circulante: ................................................................... R$ 800.000; Passivo Não Circulante: ......................................................... R$ 1.000.000; Patrimônio Líquido (excluindo o goodwill): .......................... R$ 1.900.000. Recentemente, foi acordado que Pedro deixará a sociedade. De acordo com o contrato social, a apuração de haveres deve considerar o valor de mercado dos ativos, incluindo o valor do goodwill da empresa, que foi avaliado em R$ 500.000. Além disso, o contrato prevê um deságio de 10% sobre o valor de mercado total apurado, considerando riscos associados ao futuro da empresa. Nesse caso, (i) o valor total de mercado da empresa antes de aplicar o deságio, (ii) o valor líquido de mercado da empresa após aplicar o deságio, (iii) o valor dos haveres de Pedro, considerando sua participação na sociedade e o valor líquido [...]", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2025.2", "numero": 1, "texto": "Os dicionários registram os diversos significados de um vocábulo; os dois textos abaixo definem o termo “contabilidade”, segundo, respectivamente, os dicionários de Antônio Houaiss (AH) e de Aurélio Buarque de Hollanda (ABH). (AH) Contabilidade: ciência teórica e prática que estuda os métodos de cálculo e registro da movimentação financeira de uma firma ou empresa. (ABH) Contabilidade: ciência que estuda e interpreta os registros dos fenômenos que afetam o patrimônio de uma entidade (empresa, instituição pública, pessoa física, instituição não lucrativa etc.). Sobre esses textos, assinale a afirmativa correta. (A) As definições começam sempre por uma palavra de conteúdo geral que, nesses casos, é representada pela palavra “ciência”. (B) Os termos “teórica e prática” e “cálculo e registro” são construídos com palavras antônimas, ou seja, de significados opostos. (C) Os termos entre parênteses da segunda definição mostram todos os tipos de entidades referidas na definição. (D) As duas definições mostram o mesmo objetivo da ciência “contabilidade”.", "gabarito": "A", "explicacao": "As definições começam pela palavra de conteúdo geral 'ciência'. As demais alternativas contêm imprecisões sobre antônimos, completude dos exemplos ou identidade de objetivos."}, {"edicao": "2025.2", "numero": 2, "texto": "As frases listadas nas opções a seguir foram reescritas de forma a eliminar-se o “que”, com substituição do verbo por um substantivo semanticamente correlato. Assinale a frase em que a substituição foi feita de forma adequada. (A) Cabral, que descobriu o Brasil, merece homenagens. / Cabral, o criador do Brasil, merece homenagens. (B) Caminha, que escreveu a carta, registrou o fato. / Caminha, o redator da carta, registrou o fato. (C) As caravelas, que atravessaram o oceano, resistiram a tempestades. / As caravelas, navegadoras do oceano, resistiram a tempestades. (D) A descoberta do Brasil, que ocorreu em 1500, ficou na história. / A descoberta do Brasil, ocorrente em 1500, ficou na história.", "gabarito": "B", "explicacao": "A substituição adequada é 'Caminha, o redator da carta...' (substantivo correlato a 'escreveu')."}, {"edicao": "2025.2", "numero": 3, "texto": "A empresa Gama S.A. avalia um projeto com investimento inicial de R$ 300.000,00, a ser realizado na data zero. Estimam-se entradas de caixa ao final de cada ano, conforme segue: • 1º ano: R$ 121.000,00; • 2º ano: R$ 121.000,00; • 3º ano em diante: R$ 146.410,00 por ano. Chama-se payback descontado ao tempo necessário para que a soma dos fluxos de caixa descontados iguale o investimento inicial. Considerando-se uma taxa de desconto de 10% ao ano, o payback do projeto está entre (A) 1 ano e 2 anos. (B) 2 anos e 3 anos. (C) 3 anos e 4 anos. (D) 4 anos e 5 anos.", "gabarito": "B", "explicacao": "Payback descontado a 10%: soma dos VPs dos fluxos iguala o investimento entre 2 e 3 anos (alternativa B)."}, {"edicao": "2025.2", "numero": 4, "texto": "A empresa VGF S.A. tomou um empréstimo bancário de R$ 14.560,00 para financiar a compra de equipamentos. O contrato de empréstimo estabelece que o valor tomado deve ser liquidado por meio de uma série postecipada de 3 pagamentos mensais, iguais e sucessivos. O regime de capitalização adotado é o de juros compostos, à taxa de 20% ao mês. Considerando essas informações, é correto afirmar que o valor das prestações mensais será de (A) R$ 4.853,33. (B) R$ 6.400,00. (C) R$ 6.912,00. (D) R$ 7.280,00.", "gabarito": "C", "explicacao": "Prestação de série postecipada (juros compostos 20% a.m., 3 parcelas): PMT = 14.560 / fator de anuidade = 6.400 (B)."}, {"edicao": "2025.2", "numero": 5, "texto": "Para o contador que atua no setor público ou na fiscalização de contratos administrativos, o conhecimento da Lei nº 14.133, de 1º de abril de 2021 (Lei de Licitações e Contratos), é fundamental para a avaliação da legalidade e conformidade dos gastos públicos. O Art. 5º dessa Lei elenca diversos princípios que devem guiar a atuação das Administrações Públicas diretas, autárquicas e fundacionais da União, dos Estados, do Distrito Federal e dos Municípios. Com base no texto legal, avalie os seguintes princípios: I. Impessoalidade; II. Transparência; III. Racionalidade econômica; IV. Probidade administrativa. Estão expressamente listados no Art. 5º da Lei os princípios (A) I e IV, apenas. (B) II e III, apenas. (C) I, II e IV, apenas. (D) I, II, III e IV.", "gabarito": "C", "explicacao": "Art. 5º da Lei 14.133/2021 lista explicitamente impessoalidade e probidade administrativa (entre outros). Racionalidade econômica e transparência não estão literalmente no artigo da forma apresentada."}, {"edicao": "2025.2", "numero": 6, "texto": "Um estudante de contabilidade, ao iniciar seus estudos em Direito Tributário, depara-se com o conceito fundamental de tributo. Para uma compreensão precisa, ele busca a definição legal contida no Código Tributário Nacional (Lei nº 5.172/1966). De acordo com esse diploma legal, assinale a opção que define corretamente o tributo. (A) Tributo é toda prestação pecuniária voluntária, em moeda ou cujo valor nela se possa exprimir, que não constitua sanção de ato ilícito, instituída por meio de medida provisória e cobrada mediante atividade administrativa com alguma discricionariedade. (B) Tributo é toda sanção de ato ilícito, cobrada compulsoriamente em bens ou serviços, instituída em lei e aplicada com base em decisões discricionárias da administração pública. (C) Tributo é toda prestação pecuniária compulsória, em bens ou cujo valor nela se possa exprimir, que não constitua sanção de ato ilícito, instituída por qualquer ato normativo e cobrada mediante atividade administrativa parcialmente vinculada. (D) Tributo é toda prestação pecuniária compulsória, em moeda ou cujo valor nela se possa exprimir, que não constitua sanção de ato ilícito, instituída em lei e cobrada mediante atividade administrativa plenamente vinculada.", "gabarito": "D", "explicacao": "Definição legal de tributo no CTN (art. 3º): prestação pecuniária compulsória, em moeda, que não constitua sanção de ato ilícito, instituída em lei e cobrada mediante atividade administrativa plenamente vinculada."}, {"edicao": "2025.2", "numero": 7, "texto": "De acordo com a Lei Complementar nº 123, de 14 de dezembro de 2006, que institui o Estatuto Nacional da Microempresa e da Empresa de Pequeno Porte, os limites de receita bruta anual para fins de enquadramento são informações essenciais para a atuação do contador. Considerando o que a lei estabelece sobre a definição de Microempresa (ME) e Empresa de Pequeno Porte (EPP), assinale a afirmativa correta. (A) Uma Microempresa (ME) aufere, em cada ano-calendário, receita bruta igual ou inferior a R$ 120.000,00, e uma Empresa de Pequeno Porte (EPP) aufere receita bruta superior a R$ 120.000,00 e igual ou inferior a R$ 1.200.000,00. (B) Uma Microempresa (ME) aufere, em cada ano-calendário, receita bruta igual ou inferior a R$ 360.000,00, e uma Empresa de Pequeno Porte (EPP) aufere receita bruta superior a R$ 360.000,00 e igual ou inferior a R$ 4.800.000,00. (C) Uma Microempresa (ME) aufere, em cada ano-calendário, receita bruta igual ou inferior a R$ 81.000,00, e uma Empresa de Pequeno Porte (EPP) aufere receita bruta superior a R$ 81.000,00 e igual ou inferior a R$ 4.800.000,00. (D) Os limites de receita bruta para ME e EPP são fixados anualmente por decreto do Comitê Gestor do Simples Nacional.", "gabarito": "B", "explicacao": "LC 123/2006: ME ≤ R$ 360.000; EPP > 360.000 e ≤ R$ 4.800.000."}, {"edicao": "2025.2", "numero": 8, "texto": "Um escritório contábil quer expandir sua clientela com campanha de marketing, mas tem dúvidas sobre publicidade e preços conforme o Código de Ética. Com base na NBC PG 01 – CÓDIGO DE ÉTICA PROFISSIONAL DO", "gabarito": "D", "explicacao": "Prática ética: divulgar conhecimento técnico por meio de artigos e estudos de caso. As demais violações (promessa de redução garantida, comparação depreciativa, divulgação de clientes sem autorização) são vedadas."}, {"edicao": "2025.2", "numero": 9, "texto": "Durante uma reunião com a diretoria de uma empresa cliente, o contador responsável apresentou os impactos financeiros de um novo contrato. Embora os dados estivessem tecnicamente corretos, os gestores demonstraram dúvidas e certa dificuldade em compreender a apresentação. Nesse cenário, a habilidade profissional que contribuiria para que o contador fosse mais eficaz, de acordo com a NBC PG 100 (R1) - CUMPRIMENTO DO CÓDIGO, DOS PRINCÍPIOS FUNDAMENTAIS E DA ESTRUTURA CONCEITUAL, seria (A) realizar escuta ativa. (B) demonstrar clareza na exposição de dados. (C) revisar a legislação aplicável. (D) ignorar as dúvidas do cliente.", "gabarito": "B", "explicacao": "Clareza na exposição de dados é a habilidade que contribui para a compreensão dos gestores (NBC PG 100)."}, {"edicao": "2025.2", "numero": 10, "texto": "De acordo com a NBC TG ESTRUTURA CONCEITUAL - ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, as características qualitativas fundamentais são relevância e representação fidedigna, sendo que, para ser representação fidedigna, a representação deve ser completa, neutra e isenta de erros. Uma informação neutra pode (A) ser parcial. (B) ser prudente. (C) possuir inclinações. (D) ser tendenciosa na seleção de informações financeiras.", "gabarito": "B", "explicacao": "Informação neutra pode ser prudente (a prudência é compatível com a neutralidade na Estrutura Conceitual)."}, {"edicao": "2025.2", "numero": 11, "texto": "De acordo com a NBC TG ESTRUTURA CONCEITUAL - ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, para ajudar os usuários das demonstrações contábeis a identificar e avaliar mudanças e tendências, as demonstrações contábeis (A) são elaboradas com base na forma jurídica, em detrimento da essência das transações. (B) restringem a utilização de estimativas a casos em que poderá haver perdas financeiras do usuário. (C) incluem, apenas, informações que podem ser compreendidas, também, por usuários com pouco conhecimento das atividades comerciais e econômicas, sem auxílio de consultores. (D) fornecem informações comparativas de, pelo menos, um período de relatório anterior.", "gabarito": "D", "explicacao": "As demonstrações devem fornecer informações comparativas de pelo menos um período anterior."}, {"edicao": "2025.2", "numero": 12, "texto": "Uma sociedade empresária presta serviços de perícia a terceiros. Em junho de 2024, aconteceram os seguintes fatos: • Compra de material de escritório para pagamento em 60 dias: R$ 5.000,00; • Recebimento antecipado pelos serviços que serão prestados no segundo semestre: R$ 10.000,00; • Reconhecimento do salário de seus empregados, para pagamento em 5 de julho: R$ 12.000,00. Em junho de 2024, o passivo da sociedade empresária aumentou em (A) R$ 15.000,00. (B) R$ 17.000,00. (C) R$ 22.000,00. (D) R$ 27.000,00.", "gabarito": "D", "explicacao": "Aumento do passivo = 5.000 (fornecedores) + 10.000 (adiantamento de clientes) + 12.000 (salários a pagar) = 27.000."}, {"edicao": "2025.2", "numero": 13, "texto": "De acordo com a NBC TG ESTRUTURA CONCEITUAL - ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, com relação às implicações das características qualitativas para a escolha da base de mensuração, avalie as afirmativas a seguir e assinale (V) para a verdadeira e (F) para a falsa. ( ) Utilizar consistentemente as mesmas bases de mensuração para os mesmos itens, seja de período a período, na entidade que reporta ou em um único período para diferentes entidades, prejudica a comparabilidade das demonstrações. ( ) A mudança na base de mensuração pode tornar as demonstrações contábeis menos compreensíveis. Contudo, a mudança pode ser justificada se outros fatores compensarem a redução na compreensibilidade, por exemplo, se a mudança resulta em informações mais relevantes. ( ) A verificação é melhorada utilizando-se bases de mensuração que resultam em avaliações que podem ser independentemente corroboradas diretamente, por exemplo, observando os preços, ou indiretamente, por exemplo, verificando dados de entrada de modelo. As afirmativas são, respectivamente, (A) V – V – V. (B) V – V – F. (C) V – F – V. (D) F – V – V.", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito (extraoficial/publicado) e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2025.2", "numero": 14, "texto": "A NBC TG 28 (R4) - PROPRIEDADES PARA INVESTIMENTO trata de definição, classificação e mensuração de propriedades para investimento. Sobre esse item, analise as seguintes afirmativas: I. Propriedade para Investimento é classificada dentro do subgrupo investimento no ativo circulante. II. Propriedade para investimento é um terreno, edifício ou veículo mantido pela entidade para auferir aluguel ou valorização do capital. III. Propriedade para investimento no momento da aquisição deve ser mensurada pelo seu custo. Está correto o que se afirma em (A) II e III, apenas. (B) III, apenas. (C) I, II e III. (D) II, apenas.", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito (extraoficial/publicado) e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2025.2", "numero": 15, "texto": "Um ativo individual ou um grupo de ativos mantido para venda são ativos a ser alienados, por venda ou de outra forma, em conjunto como um grupo de ativos em uma só transação, e passivos diretamente associados a esses ativos que serão transferidos na transação. De acordo com a NBC TG 31 (R4) - ATIVO NÃO CIRCULANTE MANTIDO PARA VENDA E OPERAÇÃO DESCONTINUADA, a depreciação do ativo ou grupo de ativos mantidos para venda deve (A) ser parcial, pois o ativo ou grupo de ativos ainda está operando. (B) ser mantida até a venda ser concretizada. (C) ser interrompida quando o ativo ou grupo de ativos for reclassificado como mantido para venda. (D) continuar como estava antes da reclassificação.", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito (extraoficial/publicado) e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2025.2", "numero": 16, "texto": "De acordo com a NBC TG 01 (R4) - REDUÇÃO AO VALOR RECUPERÁVEL DE ATIVOS, o valor em uso é o valor presente de fluxos de caixa futuros esperados que devem advir de um ativo ou de unidade geradora de caixa. Avalie se os seguintes elementos devem ser refletidos no cálculo do valor em uso do ativo: I. O valor pago na aquisição do ativo. II. As expectativas acerca de possíveis variações no montante ou no período de ocorrência desses fluxos de caixa futuros. III. As estimativas dos fluxos de caixa futuros que a entidade espera obter com esse ativo. IV. O valor do dinheiro no tempo, representado pela atual taxa de juros livre de risco. Estão corretos os elementos (A) I, II e III, apenas. (B) I e II, apenas. (C) III e IV, apenas. (D) II, III e IV, apenas.", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito (extraoficial/publicado) e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2025.2", "numero": 17, "texto": "O ágio por expectativa de rentabilidade futura (goodwill) reconhecido em uma combinação de negócios é um ativo que representa benefícios econômicos futuros advindos de outros ativos adquiridos na combinação de negócios que não são identificados individualmente e não são reconhecidos separadamente. De acordo com a NBC TG 04 (R4) - ATIVO INTANGÍVEL e com a NBC TG 15 (R4) - COMBINAÇÃO DE NEGÓCIOS, a empresa adquirente deve reconhecer, na data da aquisição, separadamente do ágio derivado da expectativa de rentabilidade futura (goodwill) apurado em uma combinação de negócios, um ativo intangível da adquirida, independentemente de o ativo ter sido reconhecido pela adquirida antes da aquisição da empresa. A perda por desvalorização reconhecida para o ágio por expectativa de rentabilidade futura (goodwill) não deve ser revertida em período subsequente, pois (A) não pode ser amortizada. (B) no plano de contas não há rubrica apropriada. (C) gera fluxos de caixa, independentemente de outros ativos ou grupos de ativos. (D) é equivalente ao goodwill gerado internamente.", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito (extraoficial/publicado) e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2025.2", "numero": 18, "texto": "A Demonstração do Valor Adicionado (DVA) busca evidenciar o valor e a distribuição da riqueza econômica gerada pelas atividades da sociedade empresária, incluindo também o valor adicionado recebido em transferência. A riqueza gerada é evidenciada na distribuição entre o capital (Remuneração de capital próprio e de terceiros), trabalho (Pessoal) e governo (Impostos, taxas e contribuições). Relacione cada item a seguir ao respectivo componente da distribuição da riqueza, conforme disposto na NBC TG 09 (R1) - DEMONSTRAÇÃO DO VALOR ADICIONADO. ( ) Fundo de Garantia por Tempo de Serviços (FGTS) ( ) Aluguéis pagos ( ) Dividendos distribuídos ( ) Contribuição Social sobre o Lucro Líquido (CSLL) 1. Pessoal 2. Impostos, taxas e contribuições 3. Remuneração de capital de terceiros 4. Remuneração de capital próprio A relação correta, na ordem apresentada, é (A) 1 – 2 – 3 – 4. (B) 2 – 3 – 4 – 1. (C) 2 – 4 – 3 – 1. (D) 1 – 3 – 4 – 2.", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito (extraoficial/publicado) e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2025.2", "numero": 19, "texto": "A empresa Delta S.A. adquiriu uma máquina por R$ 350.000,00 em 01/01/2020. No momento da aquisição, a administração de Delta S.A. estimou a vida útil desse ativo em 10 anos e um valor residual de R$ 50.000,00. A máquina estava disponível para uso em 01/01/2020 e a empresa adotou o método de depreciação linear. Em 31/12/2023, a empresa procedeu a uma revisão das suas estimativas, conforme previsto no NBC TG 27 (R4) - ATIVO IMOBILIZADO, e constatou as seguintes informações: • Vida útil remanescente: 9 anos; • Valor Residual: R$ 50.000,00. Com base exclusivamente nas informações apresentadas, o valor da depreciação anual dessa máquina a partir de 01/01/2024 será de (A) R$ 35.000,00. (B) R$ 30.000,00. (C) R$ 20.000,00. (D) R$ 15.000,00.", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito (extraoficial/publicado) e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2025.2", "numero": 20, "texto": "A NBC TG ESTRUTURA CONCEITUAL estabelece os conceitos dos elementos das demonstrações contábeis. Com base nessa norma, avalie as afirmativas a seguir e assinale (V) para a verdadeira e (F) para a falsa. ( ) Ativo é um recurso econômico presente de propriedade da entidade como resultado de eventos passados. ( ) Passivo é uma obrigação futura da entidade de transferir um recurso econômico como resultado de eventos passados. ( ) Receitas são aumentos nos ativos, ou reduções nos passivos, que resultam em aumento no patrimônio líquido, exceto aqueles referentes a contribuições de detentores de direitos sobre o patrimônio. ( ) Despesas são reduções nos ativos, ou aumentos nos passivos, que resultam em reduções no patrimônio líquido, exceto aqueles referentes a distribuições aos detentores de direitos sobre o patrimônio. As afirmativas são, respectivamente, (A) F – F – V – V. (B) F – V – F – V. (C) V – F – V – F. (D) V – V – F – F.", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito (extraoficial/publicado) e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2025.2", "numero": 21, "texto": "A empresa Alfa S.A. adquiriu, por R$ 1.300.000,00, no dia 01/01/2025, 80% do capital da empresa Beta S.A., adquirindo nessa data o seu controle. Na data da aquisição: 1. o valor contábil do patrimônio líquido da empresa Beta S.A. era de R$ 1.000.000,00; 2. o valor líquido dos ativos identificáveis e dos passivos da empresa Beta S.A. correspondentes a 100% de seu capital social, mensurados a valor justo, era de R$ 1.500.000,00. Com base exclusivamente nos dados apresentados e na NBC TG 15 (R4) – COMBINAÇÃO DE NEGÓCIOS, avalie as afirmativas abaixo, com relação à contabilização ocorrida na empresa Alfa S.A.: I. Foi registrado um goodwill no valor de R$ 100.000,00. II. Foi registrada uma compra vantajosa no valor de R$ 200.000,00. III. Foi registrado um ágio ou mais-valia dos ativos no valor de R$ 400.000,00. IV. Foi registrado um ágio ou mais-valia dos ativos no valor de R$ 500.000,00. Estão corretas as afirmativas (A) I e III, apenas. (B) I e IV, apenas. (C) II e III, apenas. (D) II e IV, apenas.", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito (extraoficial/publicado) e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2025.2", "numero": 22, "texto": "Influência significativa é o poder de participar das decisões sobre políticas financeiras e operacionais de uma investida, mas sem que haja o controle individual ou o conjunto dessas políticas. A NBC TG 18 (R4) - INVESTIMENTO EM COLIGADA determina que a existência de influência significativa por investidor geralmente é evidenciada por uma ou mais das seguintes formas, à exceção de uma. Assinale-a. (A) Indicação de funcionários para a investida. (B) Operações materiais entre o investidor e a investida. (C) Intercâmbio de diretores ou gerentes. (D) Fornecimento de informação técnica essencial.", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito (extraoficial/publicado) e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2025.2", "numero": 23, "texto": "A empresa ABCDE possui os seguintes registros referentes às movimentações em determinado período: • Compras: ................................................................................................................................................................. R$ 5.000,00. • Estoque inicial: ........................................................................................................................................................ R$ 3.000,00. • Estoque final: .......................................................................................................................................................... R$ 2.000,00. • Vendas: ................................................................................................................................................................. R$ 30.000,00. • Despesas gerais: ..................................................................................................................................................... R$ 1.000,00. • Devolução de compras: ............................................................................................................................................. R$ 500,00. Com base nesses registros, é possível afirmar que a empresa obteve o Custo das Mercadorias Vendidas (CMV) de (A) R$ 6.000,00. (B) R$ 7.500,00. (C) R$ 8.000,00. (D) R$ 5.500,00.", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito (extraoficial/publicado) e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2025.2", "numero": 24, "texto": "A empresa S.A. possuía, em 31/12/2024, obrigações presentes como resultados de eventos passados cuja saída de recursos envolvendo benefícios futuros na liquidação esteve sujeita à análise, com a classificação disposta na tabela a seguir: Probabilidade de ocorrência de Tipo de Obrigação Valor da mensuração por estimativa confiável saída de recurso Garantia de venda R$ 5.000,00 Provável Terreno contaminado e obrigação não formalizada R$ 15.000,00 Provável Processo Trabalhista I R$ 10.000,00 Remota Processo Trabalhista II R$ 20.000,00 Possível Há impossibilidade de estimar confiavelmente no Processo Fiscal Possível momento. Com base nos dados, seguindo a NBC TG 25 (R2) - PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES, o montante a ser reconhecido como provisões no Balanço Patrimonial da empresa deve ser de (A) R$ 20.000,00. (B) R$ 40.000,00. (C) R$ 30.000,00. (D) R$ 50.000,00.", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito (extraoficial/publicado) e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2025.2", "numero": 25, "texto": "A empresa Serviços S.A. encerrou seu exercício em 31/12/2024, deixando de efetuar o lançamento referente à receita de serviços prestados a um cliente em dezembro e ainda não recebidos, deixando de obedecer, assim, ao regime de competência. Como consequência do erro cometido pela ausência desse registro, (A) o saldo da conta clientes ficou superavaliado. (B) o saldo do disponível ficou subavaliado. (C) a receita do exercício ficou superavaliada. (D) o lucro do exercício ficou subavaliado.", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito (extraoficial/publicado) e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2025.2", "numero": 26, "texto": "A Cia. Gold vende pulseiras. Em 31/12/2024, não havia estoque inicial de pulseiras. No primeiro trimestre de 2025 aconteceram os seguintes fatos: • 05/01: compra de 20 pulseiras por R$ 10.000,00; • 25/01: venda de 10 pulseiras por R$ 1.200,00 cada; • 05/02: compra de 12 pulseiras por R$ 7.200,00; • 20/02: venda de 11 pulseiras por R$ 1.200,00 cada; • 10/03: compra de 8 pulseiras por R$ 5.200,00; • 27/03: venda de 5 pulseiras por R$ 1.400,00 cada. Assinale a opção que indica o valor aproximado do estoque final de pulseiras da Cia. Gold em 31/03/2025, considerando que a empresa utiliza o método do Custo Médio Ponderado Móvel em base diária. (A) R$ 7.840,00. (B) R$ 8.326,00. (C) R$ 9.100,00. (D) R$ 10.905,00.", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito (extraoficial/publicado) e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2025.2", "numero": 27, "texto": "Uma loja de cosméticos começou a funcionar em 01/07/2024. No segundo semestre de 2024, aconteceram os seguintes fatos: • Integralização de capital social em dinheiro: R$ 300.000,00. • Compra à vista de móveis e utensílios para a loja: R$ 40.000,00. • Compra à vista de estoque para revenda: R$ 80.000,00. • Pagamento do aluguel do semestre: R$ 30.000,00. • Pagamento antecipado do aluguel do primeiro trimestre de 2025: R$ 18.000,00. • Venda de todo o estoque por R$ 400.000,00, sendo que metade do valor já foi recebido e o restante deverá ser recebido no primeiro semestre de 2025. A loja estima inadimplência de 5%. • Reconhecimento e pagamento de despesas diversas: R$ 12.000,00. • Reconhecimento da despesa de depreciação: R$ 4.000,00. O fluxo de caixa gerado pela atividade operacional em 2024, de acordo com as diretrizes da NBC TG 03 (R3) – DEMONSTRAÇÃO DOS FLUXOS DE CAIXA foi de (A) R$ 20.000,00. (B) R$ 50.000,00. (C) R$ 60.000,00. (D) R$ 360.000,00.", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito (extraoficial/publicado) e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2025.2", "numero": 28, "texto": "Em 01/12/2024, uma sociedade empresária apresentava, em seu Balanço Patrimonial, como ativo imobilizado, um terreno, cujo valor contábil era de R$ 80.000,00. Em 31/12/2024, a sociedade empresária realizou um teste de recuperabilidade em seus ativos imobilizados. Foi constatado que o valor em uso do terreno era de R$ 75.000,00. Para que não haja reconhecimento de perda de recuperabilidade do terreno, o valor justo líquido de despesa de venda deve ser (A) menor do que R$ 75.000,00. (B) maior do que R$ 79.999,99. (C) entre R$ 72.000,00 e R$ 74.999,99. (D) entre R$ 75.000,00 e R$ 79.999,99.", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito (extraoficial/publicado) e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2025.2", "numero": 29, "texto": "Em junho de 2025, uma companhia aérea reconheceu as seguintes receitas: • com a marcação de assentos: R$ 150.000,00; • com equivalência patrimonial: R$ 200.000,00; • com a venda de passagens: R$ 900.000,00. Nesse mês, a companhia aérea reconheceu como Receita, na primeira linha da Demonstração do Resultado do Exercício, o seguinte montante: (A) R$ 900.000,00. (B) R$ 1.050.000,00. (C) R$ 1.100.000,00. (D) R$ 1.250.000,00.", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito (extraoficial/publicado) e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2025.2", "numero": 30, "texto": "Em 01/01/2025, uma livraria tinha em estoque 20 livros “Estatística Simples”. Cada livro tinha sido adquirido por R$ 80,00 e era vendido por R$ 140,00. No primeiro trimestre desse ano, a movimentação do livro foi a seguinte: • 28/01: venda de 10 livros por R$ 140,00. • 05/02: compra de 15 livros por R$ 90,00. • 25/02: venda de 18 livros por R$ 150,00. • 05/03: compra de 20 livros por R$ 95,00. • 28/03: venda de 25 livros por R$ 150,00. O custo das mercadorias vendidas no primeiro trimestre de 2025, considerando que a livraria utiliza o método PEPS para avaliação de estoque, foi de (A) R$ 3.860,00. (B) R$ 4.220,00. (C) R$ 4.660,00. (D) R$ 5.035,00.", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito (extraoficial/publicado) e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2025.2", "numero": 31, "texto": "A compreensão dos conceitos e métodos relacionados à Demonstração do Resultado do Exercício (DRE) e à Demonstração do Resultado Abrangente (DRA) é fundamental para a adequada análise das variações do patrimônio líquido e para a tomada de decisões baseadas nos resultados operacionais. A respeito do tema, analise as seguintes afirmativas: I. A recompra de ações de emissão da própria entidade para manutenção em tesouraria afeta o resultado abrangente por representar uma redução no patrimônio líquido. II. O resultado abrangente compreende todos os componentes da demonstração do resultado e dos outros resultados abrangentes. III. Pelo método da natureza da despesa, as despesas são classificadas conforme sua função, como administrativas, comerciais e de produção, facilitando a análise do custo dos produtos vendidos. IV. A informação sobre a natureza das despesas é útil para prever os fluxos de caixa futuros e requer divulgação adicional quando a classificação adotada na DRE for baseada no método da função das despesas. V. A entidade deve apresentar rubricas ou itens de receitas ou despesas como itens extraordinários, quer na demonstração do resultado abrangente, quer na demonstração do resultado do período, quer nas notas explicativas. De acordo com a NBC TG 26 (R5) - APRESENTAÇÃO DAS DEMONSTRAÇÕES CONTÁBEIS, estão corretas as afirmativas (A) II e IV, apenas. (B) I, III e V, apenas.  [...]", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito (extraoficial/publicado) e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2025.2", "numero": 32, "texto": "A empresa S.A. é especializada na construção de galpões industriais sob encomenda de acordo com especificações exclusivas de cada cliente. Os contratos firmados pela empresa preveem que a construção ocorra no terreno do cliente, com pagamentos mensais vinculados ao andamento da obra, que pode durar de 6 a 10 meses. Considerando as informações apresentadas e os preceitos da NBC TG 47 – RECEITA DE CONTRATO COM CLIENTE, o reconhecimento da receita deve ocorrer (A) somente após a emissão do certificado de aceitação técnica da obra pelo cliente. (B) no momento da conclusão da obra, quando todos os riscos e benefícios são transferidos. (C) no início do contrato, pois o pagamento mensal caracteriza o reconhecimento da receita. (D) ao longo do tempo, pois o desempenho da entidade cria ou melhora ativo que o cliente controla à medida que é construído.", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito (extraoficial/publicado) e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2025.2", "numero": 33, "texto": "Uma empresa S.A. celebrou um contrato no valor de R$ 30.000,00 para utilizar um equipamento por um período de 10 meses, cujo ativo subjacente do contrato foi considerado de baixo valor pela empresa. A administração da empresa S.A. decidiu aplicar a isenção de reconhecimento autorizada pelo item 5 da NBC TG 06 (R3). Considerando-se as informações apresentadas e os preceitos da NBC TG 06 (R3) – ARRENDAMENTOS, o tratamento contábil para esse contrato é (A) registrar o valor total do contrato antecipadamente como despesa no início do contrato. (B) capitalizar o valor do contrato como ativo imobilizado, amortizando ao longo do contrato. (C) reconhecer os pagamentos do arrendamento como despesa no resultado, de forma linear ou sistemática, ao longo do prazo do contrato. (D) reconhecer um ativo de direito de uso e um passivo de arrendamento, ambos, ao valor presente estipulado no contrato.", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito (extraoficial/publicado) e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2025.2", "numero": 34, "texto": "Uma empresa que atua na produção de medicamentos há 10 anos decidiu trocar dois de seus equipamentos (classificados como ativo imobilizado) mais relevantes por outros com tecnologia mais atualizada com o objetivo de redução nos seus custos de produção. As informações sobre os  {"edicao": "2025.2", "numero": 49, "texto": "Considerando as disposições da NBC TP 01 (R1) - PERÍCIA CONTÁBIL, avalie as assertivas a seguir. I. A perícia contábil é o conjunto de procedimentos técnico-científicos destinados a levar à instância decisória elementos de prova necessários a subsidiar a justa solução do litígio ou constatação de fato, mediante laudo pericial contábil e/ou parecer pericial contábil, em conformidade com as normas jurídicas e profissionais e com a legislação específica no que for pertinente. II. O laudo pericial contábil e o parecer pericial contábil não têm por limite o objeto da perícia deferida ou contratada. III. A perícia contábil é de competência do contador em situação regular em Conselho Regional de Contabilidade ou de profissional equivalente, desde que seja detentor de notório conhecimento sobre a matéria. IV. O planejamento da perícia é a etapa do trabalho pericial na qual o perito estabelece as diretrizes e a metodologia a serem aplicadas. Estão corretas apenas as assertivas (A) I e II. (B) I e III. (C) II e III. (D) I e IV.", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito (extraoficial/publicado) e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2025.2", "numero": 50, "texto": "O Parecer Pericial Contábil é um documento elaborado pelo perito-contador assistente, destinado a analisar, comentar ou contestar o Laudo Pericial Contábil elaborado pelo perito-contador nomeado pelo juízo. O parecer deve ser redigido de forma clara, objetiva e técnica, seguindo rigorosamente as normas contábeis. Segundo a NBC TP 01 - PERÍCIA CONTÁBIL, uma condição para a emissão do Parecer Pericial Contábil é que o Parecer Pericial Contábil deve (A) ser emitido, independentemente de concordância ou discordância com o Laudo Pericial Contábil. (B) ser emitido apenas quando houver concordância total com o Laudo Pericial Contábil. (C) ser emitido somente se houver divergência parcial ou to let quiz = [], idx = 0, answers = {}, revealed = {}, startTime = null, timerInterval = null;

function startQuiz() {
  const qtd = Math.min(250, Math.max(1, parseInt(document.getElementById('qtd').value) || 50));
  const eds = [...document.querySelectorAll('#edicoes input:checked')].map(c => c.value);
  if (!eds.length) { alert('Selecione pelo menos uma edição!'); return; }
  let pool = TODAS.filter(q => eds.includes(q.edicao));
  if (!pool.length) { alert('Nenhuma questão encontrada.'); return; }
  if (document.getElementById('shuffle').checked) pool = shuffle([...pool]);
  quiz = pool.slice(0, Math.min(qtd, pool.length));
  idx = 0; answers = {}; revealed = {};
  startTime = Date.now();
  document.getElementById('setup').style.display = 'none';
  document.getElementById('result').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  document.getElementById('navBar').style.display = 'flex';
  startTimer();
  render();
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function render() {
  const q = quiz[idx];
  document.getElementById('counter').textContent = (idx + 1) + ' / ' + quiz.length;
  document.getElementById('edicaoBadge').textContent = q.edicao;
  document.getElementById('qHeader').textContent = q.edicao + ' – Questão ' + q.numero;
  document.getElementById('prog').style.width = ((idx + 1) / quiz.length * 100) + '%';

  const { stem, options } = parseQuestion(q.texto);
  document.getElementById('qText').textContent = stem;

  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  ['A','B','C','D'].forEach(letter => {
    const optText = options[letter];
    if (!optText && letter !== 'A') return;
    const div = document.createElement('div');
    div.className = 'option';
    if (answers[idx] === letter) div.classList.add('selected');
    if (revealed[idx]) {
      const gab = normalizeGab(q.gabarito);
      if (letter === gab) div.classList.add('correct');
      else if (answers[idx] === letter) div.classList.add('wrong');
    }
    div.innerHTML = '<input type="radio" name="opt" value="' + letter + '"' +
      (answers[idx]===letter?' checked':'') + (revealed[idx]?' disabled':'') + '>' +
      '<span><strong>' + letter + ')</strong> ' + (optText || '') + '</span>';
    div.onclick = () => { if (!revealed[idx]) { answers[idx] = letter; render(); } };
    optsDiv.appendChild(div);
  });

  const fb = document.getElementById('feedback');
  if (revealed[idx]) {
    fb.classList.add('show');
    document.getElementById('gabText').textContent = 'Gabarito: ' + (q.gabarito || '—');
    document.getElementById('expText').textContent = q.explicacao || 'Sem explicação disponível.';
  } else {
    fb.classList.remove('show');
  }

  document.getElementById('btnPrev').disabled = idx === 0;
  document.getElementById('btnNext').style.display = idx < quiz.length - 1 ? 'inline-flex' : 'none';
  document.getElementById('btnFinish').style.display = idx === quiz.length - 1 ? 'inline-flex' : 'none';
  document.getElementById('btnGab').textContent = revealed[idx] ? 'Ocultar' : 'Gabarito';
}

function parseQuestion(texto) {
  const regex = /\(([A-D])\)\s*/g;
  const matches = [];
  let match;
  while ((match = regex.exec(texto)) !== null) {
    matches.push({ letter: match[1], index: match.index, full: match[0] });
  }
  if (matches.length < 2) return { stem: texto, options: {} };
  const stem = texto.substring(0, matches[0].index).trim();
  const options = {};
  for (let i = 0; i < matches.length; i++) {
    const start = matches[i].index + matches[i].full.length;
    const end = i + 1 < matches.length ? matches[i + 1].index : texto.length;
    options[matches[i].letter] = texto.substring(start, end).trim();
  }
  return { stem, options };
}

function normalizeGab(g) {
  if (!g) return '';
  g = g.toUpperCase().trim();
  if (g.includes('ANUL')) return 'ANULADA';
  const m = g.match(/[A-D]/);
  return m ? m[0] : g;
}

function nextQ() { if (idx < quiz.length - 1) { idx++; render(); } }
function prevQ() { if (idx > 0) { idx--; render(); } }
function toggleGab() { revealed[idx] = !revealed[idx]; render(); }

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const sec = Math.floor((Date.now() - startTime) / 1000);
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    document.getElementById('timer').textContent = m + ':' + s;
  }, 1000);
}

function finishQuiz() {
  clearInterval(timerInterval);
  let acertos = 0, anuladas = 0;
  quiz.forEach((q, i) => {
    const gab = normalizeGab(q.gabarito);
    if (gab === 'ANULADA') { anuladas++; return; }
    if (answers[i] === gab) acertos++;
  });
  const totalValid = quiz.length - anuladas;
  const pct = totalValid > 0 ? Math.round(acertos / totalValid * 100) : 0;
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('navBar').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('scoreNum').textContent = acertos;
  document.getElementById('scoreLabel').textContent = 'acertos de ' + totalValid + ' questões válidas' + (anuladas ? ' (' + anuladas + ' anulada(s))' : '');
  document.getElementById('scorePct').textContent = pct + '%';
  const aprov = pct >= 50;
  const el = document.getElementById('aprovacao');
  el.textContent = aprov ? '✓ Aprovado (mínimo 50%)' : '✗ Reprovado (mínimo 50%)';
  el.style.color = aprov ? 'var(--success)' : 'var(--danger)';
}

function reviewWrong() {
  const wrongs = [];
  quiz.forEach((q, i) => {
    const gab = normalizeGab(q.gabarito);
    if (gab !== 'ANULADA' && answers[i] !== gab) wrongs.push(q);
  });
  if (!wrongs.length) { alert('Parabéns! Você não errou nenhuma.'); return; }
  quiz = wrongs; idx = 0; answers = {}; revealed = {};
  document.getElementById('result').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  document.getElementById('navBar').style.display = 'flex';
  render();
}

document.addEventListener('keydown', e => {
  if (document.getElementById('quiz').style.display === 'none') return;
  if (e.key === 'ArrowRight' || e.key === 'n') nextQ();
  if (e.key === 'ArrowLeft' || e.key === 'p') prevQ();
  if (e.key === 'g') toggleGab();
  if (['a','b','c','d'].includes(e.key.toLowerCase()) && !revealed[idx]) {
    answers[idx] = e.key.toUpperCase();
    render();
  }
});
</script>
