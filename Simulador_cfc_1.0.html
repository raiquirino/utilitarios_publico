ia localizada em Belo Horizonte adquiriu aparelhos de informática de Manaus por R$ 40.000,00. O frete para a entrega por caminhão era de R$ 2.000,00. No entanto, para receber os aparelhos mais rápido, a sociedade empresária solicitou a entrega por avião e pagou o valor de R$ 5.500,00 pelo frete. A instalação dos aparelhos no escritório custou R$ 1.000,00. Ainda, foram gastos R$ 2.000,00 com testes para verificar se os aparelhos estavam funcionando corretamente. O valor dos aparelhos de informática a serem registrados no ativo imobilizado da sociedade empresária é de (A) R$ 43.000,00. (B) R$ 45.000,00. (C) R$ 46.500,00. (D) R$ 48.500,00.", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 25, "texto": "Em janeiro de 2025, um artista, que possui uma empresa, estava em um evento estratégico em um resort na Bahia. Ao voltar da viagem, descobriu que um influenciador digital, que também estava no evento, divulgou fotos e vídeos do artista em redes sociais. A empresa do artista entrou na justiça por quebra de privacidade contra o resort e contra o influenciador, pedindo, respectivamente, R$ 10.000,00 e R$ 15.000,00. Os advogados da empresa do artista julgaram que as chances de ganho das causas eram, respectivamente, remota e possível. Com base no julgamento dos advogados, a empresa deve apresentar, em suas demonstrações contábeis, um ativo contingente (A) igual a zero. (B) de R$ 10.000,00. (C) de R$ 15.000,00. (D) de R$ 25.000,00.", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 26, "texto": "A Cia Lua atua no setor de comércio de relógios e tem 20 empregados. Todos os anos, na primeira semana de janeiro, a empresa contrata uma equipe de médicos para ir ao escritório realizar exames de rotina em seus empregados. Em janeiro de 2025, os gastos com os médicos foram de R$ 6.000,00. Do valor, 20% são pagos pelos empregados, enquanto o restante é pago pela empresa. O impacto do atendimento médico na Demonstração do Resultado da Cia Lua em janeiro de 2025, de acordo com o Regime de Competência, foi de (A) -R$ 400,00. (B) -R$ 500,00. (C) -R$ 4.800,00. (D) -R$ 6.000,00.", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 27, "texto": "Em fevereiro de 2025, um hotel adquiriu um televisor de 98 polegadas para que os seus hospedes assistissem a cerimônia do Oscar, em março. O preço do televisor era de R$ 40.000,00. Na data da compra foi acordado com o fornecedor que o pagamento seria realizado por Pix e, em decorrência, o hotel obteve uma redução de 5% sobre o preço original. Assinale a opção que indica a contrapartida da diminuição de R$ 38.000,00 na conta “Disponibilidades”, nas demonstrações contábeis do hotel. (A) Ativo imobilizado de R$ 38.000,00. (B) Ativo imobilizado de R$ 40.000,00 e receita financeira de R$ 2.000,00. (C) Ativo imobilizado de R$ 40.000,00 e outras receitas de R$ 2.000,00. (D) Ativo imobilizado de R$ 40.000,00 e retificação do ativo imobilizado de R$ 2.000,00.", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 28, "texto": "Uma empresa de doces e bolos possui em 31/12/X0 os seguintes saldos em seu Balanço Patrimonial: • Caixa e equivalentes de caixa: R$ 100.000,00; • Empréstimos a pagar de curto prazo: R$ 250.000,00; • Financiamentos a pagar de longo prazo: R$ 330.000,00; • Imobilizado: R$ 450.000,00; • Intangível: R$ 320.000,00; • Estoques: R$ 250.000,00; • Capital Social: R$ 540.000,00. Com base nesses saldos, o valor do ativo não circulante da empresa é (A) R$ 770.000,00. (B) R$ 350.000,00. (C) R$ 1.020.000,00. (D) R$ 450.000,00.", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 29, "texto": "A empresa ABC S.A. comprou materiais, em agosto de X1, com a finalidade de utilizá-los em suas atividades. O pagamento foi realizado em novembro de X1, e os materiais foram utilizados na prestação de serviços em setembro de X1. Esses materiais devem ser reconhecidos como despesa no mês de (A) novembro de X1. (B) setembro de X1. (C) agosto de X1. (D) dezembro de X1.", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 30, "texto": "Relacione as contas contábeis do balanço patrimonial apresentadas a seguir com seus respectivas grupos contábeis. 1. Empréstimos a pagar após 12 meses. 2. Contas a receber em 5 meses. 3. Contas a pagar em 3 meses. 4. Imóveis para uso por 10 anos. ( ) Ativo Circulante. ( ) Ativo Não Circulante. ( ) Passivo Circulante. ( ) Passivo Não Circulante. A relação correta, na ordem apresentada, é (A) 4 – 2 – 1 – 3. (B) 2 – 4 – 3 – 1. (C) 3 – 1 – 2 – 4. (D) 1 – 3 – 4 – 2.", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 31, "texto": "Assinale a opção que contempla apenas componentes do Patrimônio Líquido, descritos na Lei nº 6.404/76 e alterações posteriores. (A) Capital Social – Investimentos – Ações em Tesouraria. (B) Capital Social – Dividendos Obrigatórios a Pagar – Ajustes de Avaliação Patrimonial. (C) Reservas de Capital – Reservas de Lucros – Ações em Tesouraria. (D) Ajustes de Avaliação Patrimonial – Capital Social – Debêntures.", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 32, "texto": "A companhia investidora Alfa S.A., obrigada legalmente a elaborar demonstrações financeiras consolidadas, possui a seguinte participação societária nas empresas: Investida % de participação de Alfa S.A. PL da investida em 31/12/2023 Kappa (controlada) 90 R$ 1.000.000,00 Sigma (controlada) 70 R$ 700.000,00 Zeta (coligada) 25 R$ 600.000,00 Delta (sem influência significativa) 15 R$ 900.000,00 Com base exclusivamente nas informações acima, o montante registrado na conta de participação de acionistas não controladores no balanço consolidado da investidora Alfa S.A. em 31/12/2023 deverá ser de (A) R$ 100.000,00. (B) R$ 310.000,00. (C) R$ 760.000,00. (D) R$ 1.525.000,00.", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 33, "texto": "Uma empresa adquiriu uma máquina e registrou na contabilidade os seguintes dispêndios: • Preço de aquisição: R$ 500.000,00; • Imposto de importação: R$ 50.000,00 (não recuperável); • Preparação do local: R$ 100.000,00; • Custo com materiais consumido na realização de testes de funcionamento: R$ 50.000,00; • Honorários dos técnicos que realizaram os testes: R$ 60.000,00; • Vida útil estimada: 10 anos; • Valor residual: R$ 100.000,00. De acordo com a NBC TG 27 (R4) - ATIVO IMOBILIZADO, o custo da máquina, ou seja, o valor contábil de registro inicial desse imobilizado, será de (A) R$ 500.000,00. (B) R$ 550.000,00. (C) R$ 650.000,00. (D) R$ 760.000,00.", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 34, "texto": "Uma empresa adquiriu uma máquina em 01/01/2020 pelo custo total de R$ 240.000,00. No registro inicial da máquina no imobilizado, a empresa estimou a vida útil da máquina em 8 anos, sem valor residual. Na data da aquisição, a empresa iniciou a depreciação pelo método linear. Em 31/12/2024, a empresa reavaliou a vida útil para 10 anos, aumentando em 2 anos a vida útil inicialmente estimada. Além disso, verificou que o valor residual da máquina passou a ser de R$ 40.000,00. Com base exclusivamente nos dados acima apresentados, o valor anual da despesa de depreciação a ser contabilizada a partir das alterações ocorridas em 31/12/2024 deve ser de (A) R$ 40.000,00. (B) R$ 30.000,00. (C) R$ 18.000,00. (D) R$ 10.000,00. CONTABILIDADE DE CUSTOS", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 35, "texto": "A Indústria Cadeiras Maceió Ltda. produz e comercializa cadeiras de escritório. No mês de setembro de X4, a empresa produziu 30.000 cadeiras e não possuía estoque inicial. No mês, vendeu 24.000 unidades a um preço unitário de R$ 100,00. Os custos variáveis totais, incluindo matéria-prima, mão de obra direta e outros custos variáveis, somaram R$ 1.800.000,00. Os custos fixos, compostos principalmente por aluguel da fábrica, depreciação do maquinário e salários fixos dos supervisores da produção, totalizaram R$ 200.000,00. As despesas fixas, como gastos com administração e vendas, somaram R$ 100.000,00. Com base nessas informações, o lucro obtido com as vendas, aplicando o método de custeio variável, foi de (A) R$ 660.000,00. (B) R$ 960.000,00. (C) R$ 700.000,00. (D) R$ 300.000,00.", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 36, "texto": "Em janeiro de 2024, uma fábrica que produz bolas de futebol incorreu nos seguintes gastos: aluguel do imóvel e das máquinas: R$ 30.000,00; embalagens indispensáveis ao produto final: R$ 2.000,00; matéria-prima: R$ 10.000,00; seguro do imóvel: R$ 5.000,00. Assinale a opção que indica os custos fixos da fábrica no mês. (A) R$ 5.000,00. (B) R$ 30.000,00. (C) R$ 35.000,00. (D) R$ 45.000,00.", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 37, "texto": "Leia o fragmento a seguir: “Departamento é a unidade _____ administrativa para a Contabilidade de Custos, representada, na maioria dos casos, por pessoas e máquinas, em que se desenvolvem atividades _____.” Assinale a opção cujos itens completam corretamente as lacunas do fragmento. (A) padrão – heterogêneas (B) mínima – homogêneas (C) máxima – complementares (D) padrão – complementares", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 38, "texto": "Gasto pode ser definido como o sacrifício financeiro necessário para obter um produto ou serviço, representado pela entrega ou promessa de entrega de ativos. Assim, custos, despesas, investimentos e desembolsos são tipos de gastos. Em relação ao tema, analise as afirmativas a seguir. I. Custo é um gasto diretamente relacionado a um bem ou serviço utilizado na produção de outros bens e serviços. II. Despesa é um gasto com bens ou serviços consumidos direta ou indiretamente para obtenção de receitas. III. Investimento é um gasto que se tornou um item do patrimônio líquido em função da expectativa de geração futura de caixa para a entidade ou em função de sua vida útil. IV. Desembolso é um gasto que ocorre quando bens ou serviços são consumidos de forma anormal e/ou involuntária que afetam diretamente o resultado da entidade. Estão corretas as afirmativas (A) III e IV, apenas. (B) I, II e III, apenas. (C) I e II, apenas. (D) II, III e IV, apenas. CONTABILIDADE GERENCIAL", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 39, "texto": "Em 01/01/2024, uma loja de teclados apresentava os seguintes saldos em seu balanço patrimonial: • Disponibilidades: R$ 60.000,00; • Estoque: R$ 240.000,00; • Patrimônio Líquido: R$ 300.000,00. O estoque era composto por 400 unidades de teclado, sendo que cada uma era vendida por R$ 1.000,00. No primeiro semestre de 2024, os gastos fixos, considerando a loja e o escritório, foram os seguintes: • Aluguel: R$ 36.000,00; • Depreciação: R$ 30.000,00; • Salários: R$ 60.000,00. Além disso, foi paga, antecipadamente, uma despesa de R$ 4.000,00 relacionada ao segundo semestre do ano. O ponto de equilíbrio contábil da loja, em unidades, no primeiro semestre de 2024, foi de (A) 240. (B) 300. (C) 315. (D) 375.", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 40, "texto": "Acerca do Modelo de Determinação do Preço de Transferência, avalie as afirmativas a seguir. I. No Modelo de Preço de Transferência Baseado em Custo Total Realizado (Full Cost), o bem/serviço é transferido pelo valor resultante do somatório dos custos totais incorridos (fixos e variáveis) dividido pelo volume de produção de um determinado período (custeio por absorção). II. No Modelo de Preço de Transferência Baseado em Negociação entre os Gestores, o bem/serviço é transferido pelo preço vigente no mercado, que pode ser um preço médio. III. No Modelo de Preço de Transferência Baseado em Custo de Oportunidade, o preço do bem/serviço transferido estrutura- se a partir da premissa de que deveria refletir o valor do benefício possível de ser auferido na melhor alternativa econômica de obtenção dos insumos demandados. Está correto o que se afirma em (A) I, apenas. (B) I e II, apenas. (C) I e III, apenas. (D) I, II e III.", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 41, "texto": "Analise as contas do Balanço Patrimonial a seguir: ATIVO 2023 PASSIVO 2023 Caixa R$ 5.000,00 Fornecedores R$ 15.000,00 Aplicações financeiras R$ 10.000,00 Impostos a pagar R$ 5.000,00 Contas a receber R$ 15.000,00 Empréstimos de curto prazo R$ 10.000,00 Estoques R$ 30.000,00 Empréstimos de longo prazo R$ 20.000,00 Imobilizado R$ 10.000,00 Patrimônio líquido R$ 80.000,00 Intangível R$ 50.000,00 Investimentos R$ 10.000,00 TOTAL R$ 130.000,00 TOTAL R$ 130.000,00 O Índice de Liquidez Seca e o Índice de Liquidez Corrente são, respectivamente, iguais a (A) 2,00 e 1,00. (B) 1,00 e 2,00. (C) 1,00 e 2,60. (D) 2,00 e 0,75. CONTABILIDADE APLICADA AO SETOR PÚBLICO", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 42, "texto": "A Lei Orçamentária Anual de cada ente federado deverá conter todas as receitas e despesas de todos os Poderes, órgãos, entidades, fundos e fundações instituídas e mantidas pelo Poder Público. Esse princípio orçamentário é denominado (A) Unidade. (B) Universalidade. (C) Exclusividade. (D) Orçamento Bruto.", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 43, "texto": "De acordo com a NBC TSP ESTRUTURA CONCEITUAL - ESTRUTURA CONCEITUAL PARA ELABORAÇÃO E DIVULGAÇÃO DE INFORMAÇÃO CONTÁBIL DE PROPÓSITO GERAL PELAS ENTIDADES DO SETOR PÚBLICO, as informações financeiras e não financeiras são relevantes quando (A) permitem que os usuários compreendam o seu significado. (B) retratam a substância da transação, a qual pode não corresponder, necessariamente, à sua forma jurídica. (C) são capazes de influenciar significativamente o cumprimento dos objetivos da elaboração e da divulgação da informação contábil. (D) estão disponíveis aos usuários a tempo de serem úteis para fins de prestação de contas, responsabilização e tomada de decisão.", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 44, "texto": "Com relação aos usuários dos Relatórios Contábeis de Propósito Geral das Entidades do Setor Público (RCPGs), avalie as afirmativas a seguir e assinale (V) para a verdadeira e (F) para a falsa. ( ) Os RCPGs devem ser elaborados e divulgados, principalmente, para atender às necessidades de informações dos usuários dos serviços e dos provedores de recursos, quando estes detêm a prerrogativa de exigir que a entidade do setor público divulgue as informações que atendam às suas necessidades específicas. ( ) Os membros do Poder Legislativo são também usuários primários dos RCPGs e utilizam extensiva e continuamente os relatórios enquanto atuam como representantes dos interesses dos usuários de serviços e dos provedores de recursos. ( ) Alguns usuários dos serviços e alguns provedores de recursos que dependem dos RCPGs para obter informações que eles necessitam para os propósitos de prestação de contas e responsabilização e tomada de decisão podem não ser cidadãos, como, agências bilaterais ou multilaterais. De acordo com a NBC TSP ESTRUTURA CONCEITUAL- ESTRUTURA CONCEITUAL PARA ELABORAÇÃO E DIVULGAÇÃO DE INFORMAÇÃO CONTÁBIL DE PROPÓSITO GERAL PELAS ENTIDADES DO SETOR PÚBLICO as afirmativas são, respectivamente, (A) V – F – F. (B) V – F – V. (C) F – V – V. (D) V – V – F. CONTROLADORIA", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 45, "texto": "Em 2022, uma entidade tinha o seu desempenho financeiro analisado com base no Retorno sobre o Investimento. Em 2023, a administração da entidade determinou que o seu desempenho passasse a ser avaliado com base no EVA (Valor Econômico Agregado). Uma vantagem dessa substituição é a incorporação, na avaliação, (A) do custo de oportunidade. (B) das receitas operacionais. (C) das despesas operacionais. (D) das receitas financeiras.", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 46, "texto": "A Administração de uma empresa, na elaboração de seu plano estratégico, deve, na medida do possível, observar alguns aspectos de formalidade necessários dado a sua relevância e seu impacto nas operações da empresa. A respeito desse tema, avalie as afirmativas a seguir e assinale (V) para a verdadeira e (F) para a falsa. ( ) O Plano Estratégico deve ser executado pela Controladoria sob o comando da alta administração da empresa. ( ) Uma vez elaborado e aprovado, o Plano Estratégico não deve ser alterado ou ajustado. ( ) Planejamento Estratégico é a atividade que se ocupa da implementação do Plano Estratégico e assegura que os recursos necessários foram obtidos e também que estão sendo usados de maneira eficiente. ( ) A elaboração de um Planejamento Estratégico deve levar em consideração que todas as decisões são interdependentes, sejam elas simples ou complexas. Assim, um dos principais desafios dessa atividade é um ajustamento dessa cadeia sistêmica de decisões e a avaliação de suas consequências. As afirmativas são, respectivamente, (A) F – V – V – F. (B) F – V – F – V. (C) V – F – F – V. (D) V – F – V – F. AUDITORIA CONTÁBIL", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 47, "texto": "Uma empresa de auditoria independente precisou contratar o trabalho de um especialista na área de Tecnologia da Informação. Após receber as conclusões do especialista, foi constatado que esse trabalho era adequado para fins da auditoria. Com base na NBC TA 620 – UTILIZAÇÃO DO TRABALHO DE ESPECIALISTAS, assinale a afirmativa correta acerca da responsabilidade do auditor ao emitir a sua opinião. (A) O auditor tem sua responsabilidade dividida com o especialista em todo o trabalho. (B) O auditor é o único responsável por expressar opinião de auditoria, e essa responsabilidade não é reduzida pelo trabalho de especialista contratado pelo auditor. (C) O auditor é responsável pela parte contábil, e o especialista, pelo trabalho que fez. (D) O auditor, modificando sua opinião em virtude do trabalho do especialista, não terá nenhuma responsabilidade, sendo a responsabilidade transferida ao especialista.", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 48, "texto": "No exercício de 2024, uma sociedade empresária foi incluída em um Plano de Refinanciamento de Impostos. O fato foi apropriadamente divulgado nas demonstrações contábeis. Mesmo sendo divulgado o Plano de Refinanciamento de Impostos, o auditor julgou que o assunto é de importância fundamental para o entendimento pelos usuários das demonstrações contábeis. Assim, o auditor independente incluirá, em seu relatório, (A) uma ressalva. (B) um fato relevante. (C) um parágrafo de ênfase. (D) um parágrafo de outros assuntos. PERÍCIA CONTÁBIL", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 49, "texto": "Julgue as afirmativas a seguir, com base na NBC TP 01 (R1) - PERÍCIA CONTÁBIL. I. Concluídos os trabalhos periciais, o perito nomeado deve apresentar laudo pericial contábil, e o assistente técnico deve oferecer seu parecer pericial contábil, obedecendo aos respectivos prazos legais e/ou contratuais. II. O assistente técnico não pode validar o laudo pericial quando o documento tiver sido elaborado por leigo ou profissional de outra área, devendo, nesse caso, oferecer o parecer pericial contábil sobre a matéria periciada. III. Mesmo quando assinado em conjunto por peritos, a responsabilidade acerca do laudo pericial contábil é exclusiva do perito nomeado, não sendo passível a assunção de responsabilidade solidária pelos demais peritos assinantes no documento. IV. As respostas aos quesitos devem ser objetivas, completas e não lacônicas. Estão corretas as afirmativas (A) III e IV, apenas. (B) I e II, apenas. (C) I e III, apenas. (D) II e IV, apenas.", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 50, "texto": "A Norma Brasileira de Contabilidade Profissional – Perito (NBC PP 01) estabelece as diretrizes e os requisitos para a atuação dos contadores como peritos, incluindo qualificações, deveres, responsabilidades, normas de conduta e as situações que podem acarretar impedimento ou suspeição. Analise as afirmativas a seguir, com base na NBC PP 01, e assinale (V) para a afirmativa verdadeira e (F) para a falsa. ( ) Em casos de impedimento ou suspeição, o perito contábil tem a opção de continuar no caso desde que obtenha o consentimento expresso de todas as partes envolvidas e da autoridade competente. ( ) A NBC PP 01 permite que o perito utilize documentos externos aos autos processuais como elementos de prova, desde que previamente acordado com as partes e autorizado pelo juiz ou autoridade competente. ( ) O perito contábil deve elaborar a proposta de honorários periciais considerando não apenas os custos e o tempo necessário para a execução dos trabalhos, mas também levando em conta a relevância e o risco envolvidos no objeto da perícia. As afirmativas são, respectivamente, (A) F – F – V. (B) V – F – F. (C) F – V – F. (D) V – V – V. Realização", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2024.1", "numero": 1, "texto": "Quando escrevemos, devemos procurar ser claros e uma das maneiras de conseguir clareza é produzir frases na ordem direta, ou seja, sujeito + verbo + complementos + adjuntos. Assinale a frase em que isso foi feito. (A) Reservaremos nossas passagens para depois de amanhã. (B) As passeatas, quando repletas, indicam algum anseio popular. (C) No final do mês compraremos novos móveis para a sala. (D) Os turistas, apesar da insegurança, gostam da cidade.", "gabarito": "B", "explicacao": "Ordem direta: sujeito + verbo + complementos. A frase C está na ordem direta ('No final do mês compraremos novos móveis...')."}, {"edicao": "2024.1", "numero": 2, "texto": "Assinale o pensamento que mostra oposição de termos. (A) As pessoas a quem servimos de apoio é que nos dão firmeza na vida. (B) Podemos pretender ser o que queiramos; mas não é lícito fingir que somos o que não somos. (C) Somos criaturas tão instáveis que acabamos vivendo os sentimentos que fingimos. (D) A flor não nasceu para decorar uma casa, embora o morador pense o contrário.", "gabarito": "C", "explicacao": "Oposição de termos aparece claramente na alternativa B ('pretender ser o que queiramos; mas não é lícito fingir...')."}, {"edicao": "2024.1", "numero": 3, "texto": "Em relação a fundamentos de matemática financeira, avalie as afirmativas a seguir. I. O conceito de taxas proporcionais está interligado ao regime de juros compostos, ao passo que o conceito de taxas equivalentes está interligado ao regime de juros simples. II. Se a inflação do período analisado foi menor que zero, então a taxa real será maior que a taxa nominal. III. Em uma mesma aplicação, se o período de capitalização for menor que uma unidade, o montante no regime de juros simples será maior que o montante no regime de juros compostos. Está correto o que se afirma em (A) I, apenas. (B) II e III, apenas. (C) I e II, apenas. (D) I, II e III.", "gabarito": "C", "explicacao": "I está invertida (proporcionais ↔ simples; equivalentes ↔ compostos). II está correta (inflação negativa → taxa real > nominal). III está correta para capitalização inferior a 1 período. Correto: II e III (B)."}, {"edicao": "2024.1", "numero": 4, "texto": "Em relação a conceitos básicos de estatística, avalie se as afirmativas a seguir são falsas (F) ou verdadeiras (V). I. A moda é uma medida de tendência central que apresenta a possibilidade de ser aplicada às variáveis qualitativas. II. São exemplos de medida de dispersão a variância e o desvio-padrão, sendo a variância obtida pela raiz quadrada do desvio- padrão. III. A média apresenta, em relação à mediana, a vantagem de não sofrer influência de valores extremos (outliers). IV. Se uma variável é representada por números, ela será, necessariamente, uma variável quantitativa. As afirmativas são, respectivamente, (A) F – F – V – V. (B) F – V – F – V. (C) V – F – V – F. (D) V – F – F – F.", "gabarito": "B", "explicacao": "I verdadeira (moda aplica-se a qualitativas). II falsa (variância é o quadrado do desvio-padrão). III falsa (média sofre influência de outliers). IV falsa (números podem representar categorias). Resposta V-F-F-F (D)."}, {"edicao": "2024.1", "numero": 5, "texto": "João recebeu comunicação da associação de moradores do Bairro Alfa informando que ele se encontrava em débito com as respectivas mensalidades desde a criação da associação, o que ocorrera dois anos antes. Ao comparecer perante a associação, João informou que jamais se associara, logo, não poderia ter débitos pendentes. Foi-lhe informado, no entanto, que isto era irrelevante, já que todas as conquistas da associação geravam benefícios para João, que era morador do Bairro Alfa. À luz dessa narrativa, é correto afirmar que (A) como é obrigatória a associação de João, o débito é devido, embora ele possa se desassociar a qualquer momento. (B) ainda que seja beneficiado pelos atos da associação, cabe a João decidir se irá se associar, ou não, logo, o débito é indevido. (C) caso a associação tenha sido criada com a autorização do Município, a associação de João é tida como obrigatória e o débito é devido. (D) como as associações não têm fins lucrativos, é vedada a cobrança de mensalidades, logo, o débito é indevido. CONTADOR – MANHÃ TIPO BRANCA – PÁGINA 2 CONSELHO FEDERAL DE CONTABILIDADE - CFC FGV CONHECIMENTO", "gabarito": "C", "explicacao": "Liberdade de associação é constitucional. Ninguém é obrigado a se associar; o débito é indevido (B)."}, {"edicao": "2024.1", "numero": 6, "texto": "A sociedade empresária Alfa almejava celebrar um contrato com o Estado Beta, de modo que pudesse fornecer alguns móveis de sua fabricação. O objetivo decorria do fato de o Estado Beta estar finalizando a construção de dezenas de escolas públicas, tendo a necessidade de mobiliá-las no momento oportuno. Ao consultar um especialista na matéria, foi corretamente informado ao sócio-gerente de Alfa que (A) os contratos celebrados pelo Estado sempre seguem os mesmos parâmetros dos contratos de direito privado, logo, Maria celebraria um contrato de compra e venda de bens móveis. (B) todo contrato celebrado pelo Estado Beta deve ser antecedido de licitação, logo, a sociedade empresária Alfa somente poderia fornecer móveis a esse ente federativo caso se saísse vencedora em licitação. (C) ressalvadas as exceções legais, eventual celebração de contrato administrativo com o Estado Beta exigiria que sociedade empresária Alfa fosse vencedora em licitação. (D) em razão do princípio da eficiência, que exige celeridade nas ações estatais, a realização de licitação é reservada às situações em que a autoridade administrativa identifique a possibilidade de competição.", "gabarito": "D", "explicacao": "Contratos administrativos exigem, em regra, licitação prévia, ressalvadas as hipóteses legais de dispensa/inexigibilidade (C)."}, {"edicao": "2024.1", "numero": 7, "texto": "Ana trabalhava em um grande escritório de contabilidade, tendo sido questionada por Maria, sua colega, em relação aos pontos de aproximação e distanciamento entre os referenciais de previdência e assistência social, em especial na perspectiva do caráter contributivo, ou não. À luz desse questionamento, Ana respondeu corretamente que (A) ambas oferecem direitos prestacionais e têm caráter necessariamente contributivo. (B) a assistência social assegura benefícios independente de qualquer contribuição. (C) a assistência social se aproxima das características da previdência pública, mas se diferencia da previdência privada. (D) a assistência social é uma das formas de expressão da previdência social, seguindo as regras gerais desta última.", "gabarito": "C", "explicacao": "Assistência social é não contributiva (CF/88, art. 203). Previdência é contributiva."}, {"edicao": "2024.1", "numero": 8, "texto": "De acordo com o CÓDIGO DE ÉTICA PROFISSIONAL DO CONTADOR em seu item 6 (letra b), o contador pode transferir o contrato de serviços a seu cargo a outro profissional, com a anuência, sempre por escrito, do (A) cliente. (B) seu superior. (C) executivo central da entidade em que trabalha. (D) acionista majoritário.", "gabarito": "C", "explicacao": "Código de Ética: transferência do contrato exige anuência escrita do cliente."}, {"edicao": "2024.1", "numero": 9, "texto": "O Código de Ética Profissional do Contador prevê que, na aplicação das sanções éticas, pode ser considerada atenuante a (A) ausência de punição ética anterior. (B) prestação de serviços irrelevantes à contabilidade. (C) aplicação de desarrimo. (D) ação desenvolvida contra prerrogativas profissionais.", "gabarito": "D", "explicacao": "Atenuante prevista: ausência de punição ética anterior."}, {"edicao": "2024.1", "numero": 10, "texto": "De acordo com o Código de Ética Profissional, o contador pode praticar os seguintes atos, à exceção de um. Assinale-o. (A) Publicar trabalho, científico ou técnico, assinado e sob sua responsabilidade. (B) Transferir o contrato de serviços a seu cargo a outro profissional, com a anuência do cliente, sempre por escrito. (C) Transferir integralmente a execução dos serviços a seu cargo a outro profissional, mantendo como sua a responsabilidade técnica. (D) Indicar, em qualquer modalidade ou veículo de comunicação, títulos, especializações, serviços oferecidos, trabalhos realizados e a relação de clientes, esta quando autorizada por estes. CONTADOR – MANHÃ TIPO BRANCA – PÁGINA 3 CONSELHO FEDERAL DE CONTABILIDADE - CFC FGV CONHECIMENTO", "gabarito": "A", "explicacao": "É vedado transferir integralmente a execução mantendo a responsabilidade técnica. As demais condutas são permitidas."}, {"edicao": "2024.1", "numero": 11, "texto": "Para ser reconhecido, um ativo imobilizado precisa atender à definição de ativo imobilizado, ter relevância e representação fidedigna, apresentar um potencial de entrada de recursos econômicos com o uso ou a venda do ativo, e que possa ser mensurado com base em estimativas confiáveis. São considerados custos diretamente atribuíveis ao Ativo Imobilizado para sua mensuração no reconhecimento inicial pelo custo histórico, os listados a seguir, à exceção de um. Assinale-o. (A) Custos de abertura de nova instalação. (B) Honorários profissionais. (C) Custos de frete e manuseio. (D) Custos de preparação do local.", "gabarito": "A", "explicacao": "Custos de abertura de nova instalação não são diretamente atribuíveis ao ativo imobilizado (são despesas)."}, {"edicao": "2024.1", "numero": 12, "texto": "Uma entidade deseja reconhecer um ativo em seu balanço patrimonial. A sua mensuração envolve estimativas que estão sujeitas a incertezas. Nesse caso, a entidade (A) não deve reconhecer nem divulgar o ativo, uma vez que não há objetividade em sua mensuração. (B) deve reconhecer o ativo sem mencionar a existência de estimativas, uma vez que estas foram elaboradas com zelo e são, portanto, confiáveis. (C) não deve reconhecer o ativo, mas evidenciá-lo em notas explicativas, uma vez que não há espaço para incertezas nas demonstrações contábeis elaboradas. (D) deve reconhecer o ativo e descrever e explicar as estimativas de forma clara e precisa, uma vez que o uso de estimativas razoáveis é parte essencial da elaboração de informações financeiras.", "gabarito": "D", "explicacao": "O uso de estimativas razoáveis é essencial; deve-se reconhecer o ativo e divulgar as estimativas de forma clara."}, {"edicao": "2024.1", "numero": 13, "texto": "Em 2023, uma entidade desreconheceu um ativo de seu balanço patrimonial. Assinale a opção que indica uma possível causa para o desreconhecimento. (A) A entidade decidiu utilizar um terreno para finalidade diferente. (B) A entidade perdeu o controle de um imóvel, por meio de decisão judicial. (C) A entidade renegociou o prazo de recebimento de seus clientes, que estavam em situação financeira difícil. (D) A entidade constatou que as suas máquinas poderiam ser utilizadas por tempo maior do que a vida útil prevista.", "gabarito": "B", "explicacao": "Perda do controle (decisão judicial) é causa de desreconhecimento do ativo."}, {"edicao": "2024.1", "numero": 14, "texto": "De acordo com o conceito de manutenção de capital financeiro, o lucro é auferido somente se o montante financeiro (ou dinheiro) dos ativos líquidos no final do período exceder o montante financeiro (ou dinheiro) dos ativos líquidos no início do período, após excluir (A) compra e venda de ativos fixos durante o período. (B) distribuições para, e contribuições de, sócios durante o período. (C) reconhecimento contábil de receitas e de despesas durante o período. (D) recebimento de receitas e pagamentos de despesas durante o período.", "gabarito": "C", "explicacao": "Manutenção de capital financeiro exclui distribuições e contribuições de sócios."}, {"edicao": "2024.1", "numero": 15, "texto": "Uma empresa apresentava, em seu Balanço Patrimonial de 2023, um valor líquido contábil de R$400.000, correspondente a uma máquina em seu ativo imobilizado (Custo de Aquisição de R$500.000 e Depreciação Acumulada de R$100.000). A empresa realizou o teste de recuperabilidade (impairment) desse bem do ativo em 31/12/2023 e obteve os seguintes valores: (c) Valor em uso: R$380.000; (d) Valor justo líquido da despesa de venda: R$390.000. Com base nas informações apresentadas, o valor recuperável dessa máquina é (A) R$400.000 (B) R$390.000 (C) R$380.000 (D) R$500.000 CONTADOR – MANHÃ TIPO BRANCA – PÁGINA 4 CONSELHO FEDERAL DE CONTABILIDADE - CFC FGV CONHECIMENTO", "gabarito": "D", "explicacao": "Valor recuperável = maior entre valor em uso (380k) e valor justo líquido (390k) = 390.000."}, {"edicao": "2024.1", "numero": 16, "texto": "A entidade tem um imóvel para renda avaliada no seu balanço patrimonial pelo valor justo. O valor contábil no início do exercício do ativo é R$1.000. No final do exercício social, considerando o preço por metro quadrado de imóveis semelhantes naquela região, o valor de mercado do imóvel seria R$1.120. Acontece que, caso a entidade vendesse o imóvel, teria que pagar R$50 para um corretor de imóvel. O valor justo desse imóvel na data de encerramento do exercício social deveria ser de (A) R$1.070 (B) R$1.000 (C) R$1.170 (D) R$1.120", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 17, "texto": "De acordo com o CPC22 - Informações por Segmento, dois ou mais segmentos operacionais podem ser agregados em um único segmento operacional se a agregação for compatível com o princípio básico desta norma, se os segmentos tiverem características econômicas semelhantes e se forem semelhantes em relação a cada um dos seguintes aspectos, à exceção de um. Assinale-o. (A) Natureza dos processos de produção ou de distribuição. (B) Tipo ou a categoria de clientes dos seus produtos e serviços. (C) Resultados em termos absolutos iguais. (D) Se aplicável, a natureza do ambiente regulatório.", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 18, "texto": "Em relação à estruturação das Normas Brasileiras de Contabilidade Técnicas, analise as afirmações a seguir: I. São convergentes com as normas internacionais emitidas pelo International Accounting Standards Board (IASB). II. São convergentes com as normas norte-americanas emitidas pelo Financial Accounting Standards Board (FASB). III. São editadas por necessidades locais, sem equivalentes internacionais. De acordo com a Resolução CFC 1.328/11, que dispõe sobre a Estrutura das Normas Brasileiras de Contabilidade Técnicas, as NBC TG, as normas brasileiras de contabilidade são relacionadas ao que se afirma em (A) I, somente. (B) I e II, somente. (C) I e III, somente. (D) II e III, somente.", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 19, "texto": "De acordo com a NBC TG Estrutura Conceitual - Estrutura Conceitual para Relatório Financeiro, os principais usuários aos quais se destinam os relatórios financeiros para fins gerais são representados por (A) empregados, clientes e fornecedores. (B) detentores de participação societária e interessados em adquiri-la. (C) população em geral, impactada direta e indiretamente pelos relatórios. (D) investidores, credores por empréstimos e outros credores, existentes e potenciais.", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 20, "texto": "Em 01/01/2024, o estoque de uma loja de brinquedos, formado por 10 bonecas, era de R$500. No referido mês, foram observados os seguintes fatos em relação às bonecas: • 05/01: compra de 20 unidades, por R$62 cada. • 12/01: venda de 12 unidades, por R$90 cada. • 17/01: compra de 15 unidades, por R$69 cada. • 25/01: venda de 18 unidades, por R$100 cada. Assinale a opção que indica o valor do estoque final de bonecas em 31/01/2024, considerando que a loja utiliza o método do Custo Médio Ponderado Móvel. (A) R$376,30. (B) R$758,33. (C) R$925,00. (D) R$945,00. CONTADOR – MANHÃ TIPO BRANCA – ", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 21, "texto": "Uma joalheria apresenta, em seu Balanço Patrimonial, três imóveis. O primeiro, onde são realizadas as vendas da loja, é avaliado por R$900.000. O segundo, avaliado por R$700.000, é alugado a terceiros. Já o terceiro, que funciona como escritório e onde acontecem as atividades administrativas, é avaliado por R$500.000. Considerando apenas esses fatos, assinale a opção que indica o saldo do ativo imobilizado da joalheria. (A) R$500.000. (B) R$900.000. (C) R$1.400.000. (D) R$2.100.000.", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 22, "texto": "Em 31/12/2023, a Cia Lua apresentava os seguintes saldos em seu ativo: Aplicações financeiras com vencimento em 720 dias: ........................ R$70.000; Clientes com previsão de recebimento em 380 dias: .......................... R$60.000; Disponibilidades: ................................................................................. R$50.000; Estoques com previsão de venda em até 180 dias: ............................. R$40.000; Perdas estimadas com crédito de liquidação duvidosa:........................ R$6.000; Perdas estimadas com desvalorização de estoque: ...............................R$8.000. Assinale a opção que indica o saldo do ativo circulante em 31/12/2023. (A) R$76.000. (B) R$82.000. (C) R$90.000. (D) R$136.000.", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 23, "texto": "De acordo com a NBC TG 26 (R5) – Apresentação das Demonstrações Contábeis, além dos itens requeridos em outras normas, a demonstração do resultado do período deve incluir as rubricas a seguir, com exceção de uma. Assinale-a. (A) Custos de financiamento. (B) Distribuição do resultado do período. (C) Parcela dos resultados de empresas investidas reconhecida por meio do método da equivalência patrimonial. (D) Ganhos e perdas decorrentes do desreconhecimento de ativos financeiros mensurados pelo custo amortizado.", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 24, "texto": "Leia o fragmento a seguir: Resultado abrangente é a mutação que ocorre no _____ durante um período que resulta de transações e outros eventos que não sejam derivados de transações com os sócios na sua qualidade de proprietários. Assinale a opção que completa corretamente a lacuna do fragmento. (A) ativo (B) passivo (C) resultado (D) patrimônio líquido", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 25, "texto": "Uma empresa que exerce a atividade de auditoria independente elabora a sua Demonstração dos Fluxos de Caixa de acordo com o método indireto. Para o cálculo do lucro ajustado, a empresa deve adicionar ao lucro líquido, como ajuste, a despesa de (A) aluguel de imóveis. (B) salários de empregados. (C) salários de mão de obra terceirizada. (D) depreciação dos ativos imobilizados. CONTADOR –", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 26, "texto": "Uma empresa que atua na atividade de perícia contábil apresentou as seguintes receitas em 2023: Prestação de serviços: ....................................................................... R$200.000; Venda de ativo imobilizado: .............................................................. R$120.000; Equivalência Patrimonial: .................................................................... R$50.000; Financeiras:...........................................................................................R$30.000. Assinale a opção que indica o valor adicionado recebido em transferência da empresa de acordo com a Demonstração do Valor Adicionado da empresa. (A) R$50.000. (B) R$80.000. (C) R$200.000. (D) R$320.000.", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 27, "texto": "A Cia A é controladora da Cia B mediante participação societária equivalente a 90% do capital social da Cia B. No balanço patrimonial, a participação dos não controladores deve ser apresentada (A) no passivo, no balanço patrimonial consolidado. (B) no passivo, no balanço patrimonial individual da Cia A. (C) no patrimônio líquido, no balanço patrimonial individual da Cia A. (D) no patrimônio líquido, no balanço patrimonial consolidado.", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 28, "texto": "As Cias Alfa e Beta apresentavam os seguintes balanços patrimoniais em 31/12/2023: Cia Alfa Cia Beta Caixa 650.000 400.000 Terrenos 250.000 Investimentos (Cia Beta) 400.000 Total 1.300.000 400.000 Capital Social 1.300.000 400.000 Total 1.300.000 400.000 Em 10/01/2024, a Cia Beta adquiriu terreno que pertencia à Cia Alfa, por R$280.000, à vista. Assinale a opção que indica os valores de mensuração do terreno, em 31/01/2024, no balanço patrimonial individual da Cia Beta e no balanço patrimonial consolidado, respectivamente. (A) R$250.000 e R$250.000. (B) R$250.000 e R$280.000. (C) R$280.000 e R$250.000. (D) R$280.000 e R$280.000.", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 29, "texto": "Uma sociedade empresária apresenta em seu balanço patrimonial itens monetários em moeda estrangeira. De acordo com a NBC TG 02 (R3) - Efeitos das Mudanças nas Taxas de Câmbio e Conversão de Demonstrações Contábeis, esses itens devem ser convertidos utilizando-se a taxa de câmbio (A) média anual. (B) de fechamento. (C) vigente na data da transação. (D) estimada para a data de vencimento de tais itens monetários. CONTADOR – MANHÃ TIPO BRANCA – PÁGINA 7 CONSELHO FEDERAL DE CONTABILIDADE - CFC FGV CONHECIMENTO", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 30, "texto": "Em janeiro de 2024, Joana adquiriu ingresso para um show musical que aconteceria em 11/02/2024. O show estava agendado para começar às 18 horas, mas só teve início às 22 horas. Joana precisou sair às 21 horas, de modo que não assistiu ao show. Por conta do atraso, Joana entrou na justiça contra os organizadores do show, pedindo a devolução do preço do ingresso, que havia custado R$400, e uma indenização por danos morais, de R$1.000. Os advogados dos organizadores do show julgaram que a necessidade de pagamento decorrente da perda da causa por danos morais era possível, enquanto a perda da causa pela devolução do preço do ingresso, era provável. Assinale a opção que indica o valor da provisão reconhecida pelos organizadores do show, devido à causa de Joana. (A) Zero. (B) R$400. (C) R$1.000. (D) R$1.400.", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 31, "texto": "Em relação aos ativos, no Balanço Patrimonial de uma entidade, assinale a afirmativa correta, de acordo com a Lei nº 6.404/76 e alterações. (A) No intangível estão as participações permanentes em outras sociedades e os direitos de qualquer natureza, não classificáveis no ativo circulante. (B) No imobilizado estão os direitos que tenham por objeto bens incorpóreos destinados à manutenção da companhia ou exercidos com essa finalidade. (C) Em investimentos estão os direitos que tenham por objeto bens corpóreos destinados à manutenção das atividades da entidade ou exercidos com essa finalidade. (D) No circulante estão as disponibilidades, os direitos realizáveis no curso do exercício social subsequente e as aplicações de recursos em despesas do exercício seguinte.", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 32, "texto": "Uma sociedade empresária apresentava os seguintes saldos relacionados ao capital social em 31/12/2023: Capital autorizado: ............................................................................ R$500.000; Capital a integralizar: ........................................................................... R$40.000; Capital a subscrever: ............................................................................R$80.000. Assinale a opção que indica o capital social realizado da sociedade empresária em 31/12/2023. (A) R$380.000. (B) R$420.000. (C) R$460.000. (D) R$540.000.", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 33, "texto": "Em relação às contas apresentadas no balanço patrimonial de uma entidade, avalie se as seguintes contas são de natureza devedora: I. Adiantamento a sócio. II. Receitas antecipadas. III. Ações em tesouraria. São, de fato, contas de natureza devedora (A) I, II e III. (B) I e II, somente. (C) I e III, somente. (D) II e III, somente. CONTADOR –TIPO BRAN MANHÃ CA – PÁGINA 8 CONSELHO FEDERAL DE CONTABILIDADE - CFC FGV CONHECIMENTO", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 34, "texto": "Em 01/01/2024, Clara matriculou seus filhos em aulas de natação, por meio de pacote semestral de R$4.200, pagos à vista. Clara acordou com a escola de natação que seus filhos não frequentariam as aulas no mês de abril, de modo que o pacote teria validade até 31/07/2024. As crianças iniciaram as aulas em 01/01. Assinale a opção que indica a receita contabilizada pela escola de natação em janeiro de 2024, de acordo com o Regime de Competência. (A) Zero. (B) R$600. (C) R$700. (D) R$4.200.", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 35, "texto": "De acordo com a NBC TG 46 (R2) – Mensuração do Valor Justo, a mensuração do valor justo presume que o ativo ou o passivo é trocado em uma transação não forçada entre participantes do mercado para a venda do ativo ou a transferência do passivo na data de mensuração nas condições atuais de mercado. Na ausência de mercado principal, a mensuração do valor justo presume que a transação para a venda do ativo ocorre no mercado (A) mais vantajoso. (B) mais próximo geograficamente. (C) onde estão situados os principais competidores. (D) onde está localizada a mão de obra relacionada à produção.", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 36, "texto": "Em 01/01/2022, a Editora XYZ adquiriu, por R$540.000, os direitos autorais de um livro por seis anos, a partir dessa data. Em 31/12/2022, a Editora estimou que o valor recuperável dos direitos, a partir dessa data, era de R$470.000. Assinale a opção que indica a amortização acumulada dos direitos autorais em 31/12/2023, antes da realização do teste de recuperabilidade, considerando que a editora segue as normas contábeis de contabilidade brasileiras. (A) R$94.000. (B) R$180.000. (C) R$184.000. (D) R$188.000.", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 37, "texto": "Relacione os tipos de gastos a seguir elencados com seus respectivos conceitos. 1. Custo 2. Despesa 3. Investimento ( ) Gasto ativado em função de sua vida útil ou de benefícios atribuíveis a períodos futuros. ( ) Gasto relativo ao consumo de recursos utilizados na produção de outros bens ou serviços. ( ) Gasto relativo a bem ou serviço consumido direta ou indiretamente para obtenção de receitas, manutenção da entidade e remuneração do capital de terceiros. Assinale a opção que mostra a relação correta, na ordem apresentada. (A) 1 – 3 – 2. (B) 2 – 1 – 3. (C) 3 – 1 – 2. (D) 3 – 2 – 1. CONTADOR – MANHÃ TIPO BRANCA – PÁGINA 9 CONSELHO FEDERAL DE CONTABILIDADE - CFC FGV CONHECIMENTO", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 38, "texto": "Um estúdio de pilates oferece apenas aulas individuais. Todas as suas operações são realizadas à vista. O preço da hora-aula é de R$200. Já o custo variável por aula referente ao pagamento dos instrutores é de R$120. Além disso, o estúdio paga, mensalmente, o salário da secretária e o do contador que são, respectivamente, de R$3.000 e R$6.000. Já a depreciação mensal dos aparelhos utilizados é de R$400. O estúdio ainda incorre e paga a despesa mensal de aluguel, que é de R$5.000. O ponto de equilíbrio financeiro do estúdio, em número de aulas, é: (A) 113. (B) 118. (C) 175. (D) 180.", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 39, "texto": "Uma relojoaria vende um determinado tipo de relógio por R$800 cada. Além disso, o seu ponto de equilíbrio é de 400 unidades de relógio. Em maio de 2024, a receita apurada pela loja foi de R$500.000. A margem de segurança da relojoaria em maio de 2024 foi de (A) 36,00%. (B) 43,75%. (C) 56,25%. (D) 64,00%.", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 40, "texto": "Em 31/12/2023, o passivo de uma sociedade empresária era de R$400.000, já o seu patrimônio líquido era de R$600.000. O indicador de endividamento geral da sociedade empresária na data era: (A) 0,33. (B) 0,40. (C) 0,60. (D) 0,67.", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 41, "texto": "Em janeiro de 2024, Camila estava planejando viajar a Paris, em junho. Em janeiro, Camila pagou antecipadamente os passeios e a hospedagem, que custaram R$2.000 e R$4.000, respectivamente. Os valores não eram reembolsáveis. Em maio de 2024, Camila tentou comprar a sua passagem, que estava custando R$20.000. O valor era muito mais caro do que o esperado por ela. Deste modo, Camila desistiu de viajar. Assinale a opção que indica o valor classificado como “custo perdido”, na situação. (A) Zero. (B) R$6.000. (C) R$20.000. (D) R$26.000.", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 42, "texto": "Um supermercado apresenta os seguintes prazos médios: • de estocagem: 4 dias. • de recebimento de clientes: 20 dias. • de pagamento a fornecedores: 30 dias. O ciclo financeiro do supermercado é favorável em (A) 6 dias. (B) 10 dias. (C) 14 dias. (D) 24 dias. CONTADOR – MANHÃ TIPO BRANCA – PÁGINA 10 CONSELHO FEDERAL DE CONTABILIDADE - CFC FGV CONHECIMENTO", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 43, "texto": "Um ente público realizou o reconhecimento, a título de doação, de três imóveis para funcionamento de cinco unidades de saúde pública. Após enquadrar o reconhecimento da transação como uma “Receita sem Contraprestação”, a contabilidade procedeu: (1) a verificação dos benefícios econômicos futuros e potencial de serviços associados ao ativo; e (2) a mensuração do valor justo dos imóveis em conformidade com as características qualitativas e observância das restrições da informação contábil. De acordo com a NBC TSP 01 – Receita sem Contraprestação e com o Manual de Contabilidade Aplicado ao Setor Público (MCASP), a contrapartida, no patrimônio público, do reconhecimento dos imóveis no ativo deverá ser classificada como (A) variação patrimonial aumentativa (VPA). (B) variação patrimonial diminutiva (VPD). (C) receita de doação. (D) receita de capital.", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 44, "texto": "Após um incêndio que comprometeu permanentemente três andares do imóvel em que funciona a sede administrativa, um ente público observou que a perda dos benefícios econômicos futuros ou potencial de serviços do ativo superava o reconhecimento sistemático da depreciação lançada mensalmente. Em cumprimento ao Manual de Contabilidade Aplicado ao Setor Público (MCASP) e às Norma Brasileira de Contabilidade Aplicada ao Setor Público (NBC TSP), o procedimento contábil para representação do fenômeno nas atuais condições ocorrerá por meio de (A) depreciação. (B) amortização. (C) exaustão. (D) redução ao valor recuperável.", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 45, "texto": "No mês de março de 2024, um grupo de mães acionou uma creche do setor público na Justiça, por não oferecer as refeições apropriadas. As mães pediam o recebimento de R$100.000 a título de indenização. Os advogados contratados pela creche estimaram que a saída de recursos era provável, uma vez que uma causa semelhante foi perdida pela creche no ano anterior. Em 2023, a creche precisou pagar R$80.000 às mães. No entanto, por ser uma causa recorrente, os advogados estimaram que desta vez o desembolso necessário seria de R$90.000. Assinale a opção que indica a provisão para contingências da creche, relacionada à causa. (A) Zero. (B) R$80.000. (C) R$90.000. (D) R$100.000.", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 46, "texto": "Em relação à estrutura de compliance de uma empresa, avalie se as seguintes afirmativas estão corretas. I. Visa à redução de riscos. II. Sua adoção melhora a transparência do negócio. III. Preserva os controles éticos e de sustentabilidade corporativa. Está correto o que se afirma em (A) I e II, somente. (B) I e III, somente. (C) II e III, somente. (D) I, II e III. CONTADOR – MANHÃ TIPO BRANCA – PÁGINA 11 CONSELHO FEDERAL DE CONTABILIDADE - CFC FGV CONHECIMENTO", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 47, "texto": "Com relação à auditoria de demonstrações contábeis, avalie se afirmativas a seguir são verdadeiras (V) ou falsas (F). ( ) O objetivo da auditoria é aumentar o grau de confiança nas demonstrações contábeis por parte dos usuários. ( ) O objetivo da auditoria é alcançado mediante a expressão de uma opinião pelo auditor sobre se as demonstrações contábeis foram elaboradas, em todos os aspectos relevantes, em conformidade com uma estrutura de relatório financeiro aplicável. ( ) As demonstrações contábeis sujeitas à auditoria são as da entidade, elaboradas pela sua administração, com supervisão geral dos responsáveis pela governança. As afirmativas são, respectivamente, (A) V – V – V. (B) V – F – V. (C) F – V – V. (D) V – V – F.", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 48, "texto": "Ao realizar a auditoria independente de uma sociedade empresária, o auditor verificou que não seria possível a obtenção de evidência apropriada e suficiente de auditoria para fundamentar a sua opinião. No entanto, concluiu que os possíveis efeitos de distorções não detectadas sobre as demonstrações contábeis poderiam ser relevantes, mas não generalizados. Nesse caso, o auditor deve expressar uma opinião (A) adversa. (B) sem ressalva. (C) com ressalva. (D) com abstenção.", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 49, "texto": "De acordo com a NBC TP 01 (R1) e NBC PP 01 (R1), avalie as afirmativas a seguir. I. Quando se tratar de laudo pericial contábil assinado por peritos em conjunto, há responsabilidade solidária sobre o referido documento. II. A legislação penal determina responsabilidades e penalidades para o profissional que exerce a função de perito, as quais consistem em multa, indenização e inabilitação. III. A perícia judicial é exercida sob a tutela do Poder Judiciário, ao passo que a perícia extrajudicial é exercida sob a tutela do Poder Executivo ou do Poder Legislativo. IV. O planejamento deve ser revisado e atualizado sempre que fatos novos surjam no decorrer da perícia. Estão corretas apenas as afirmativas (A) II e III. (B) I e IV. (C) I, III e IV. (D) II, III e IV.", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.1", "numero": 50, "texto": "Em relação à perícia contábil, avalie as afirmativas a seguir. I. O laudo pericial contábil e o parecer pericial contábil devem ser elaborados somente por contador ou pessoa jurídica, se a lei assim permitir, que estejam devidamente registrados e habilitados. II. O perito deve comprovar sua habilitação por intermédio de Certidão de Regularidade Profissional emitida pelos Conselhos Regionais de Contabilidade ou do Cadastro Nacional de Peritos Contábeis do CFC. III. A aprovação no Exame de Qualificação Técnica (EQT) para perito contábil assegura ao contador o registro no Cadastro Nacional de Peritos Contábeis (CNPC) do Conselho Federal de Contabilidade (CFC). Este exame tem por objetivo aferir o nível de conhecimento e a competência técnico-profissional necessários ao contador que pretende atuar na atividade de perícia contábil. Está correto o que se afirma em (A) I e II, apenas. (B) I e III, apenas. (C) II e III, apenas. (D) I, II e III. CONTADOR – MANHÃ TIPO BRANCA – PÁGINA 12 Realização", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 1, "texto": "Um famoso escritor falou sobre a leitura: A leitura é para a mente o que a ginástica é para o corpo. Com essa frase, o autor quer dizer que (A) exercícios físicos devem ser feitos todos os dias. (B) a leitura, como a ginástica, deve ser feita diariamente. (C) a leitura enriquece o nosso conhecimento. (D) exercícios físicos e leitura fortalecem o corpo.", "gabarito": "C", "explicacao": "A analogia indica que a leitura enriquece/fortalece a mente, assim como a ginástica fortalece o corpo → benefício intelectual (C)."}, {"edicao": "2024.2", "numero": 2, "texto": "Assinale a frase que mostra uma expressão de causa devidamente explicada. (A) “De tanto que comeu, acabou passando mal”. / A expressão “De tanto que” apresenta a causa de algo como resultado da insistência de uma ação. (B) “Graças à chuva, as ruas ficaram alagadas”. / A expressão “Graças a” apresenta a causa como algo positivo. (C) “Ficou rico à custa de muito sacrifício”. / A expressão “à custa de” indica a causa de algo conhecido pelo interlocutor. (D) “Como haviam viajado bastante, eram bastante informados”. / O termo “Como” indica a causa como algo posterior ao acontecimento.", "gabarito": "A", "explicacao": "A expressão 'De tanto que' indica causa resultante de insistência/ação repetida. A explicação da alternativa A é a correta."}, {"edicao": "2024.2", "numero": 3, "texto": "Um povoado tem 50 habitantes, dos quais 30 são do sexo feminino. Se duas pessoas diferentes desse povoado forem aleatoriamente escolhidas, a probabilidade de que ambas sejam do sexo feminino é aproximadamente igual a (A) 25% (B) 35% (C) 43% (D) 60%", "gabarito": "B", "explicacao": "P(ambas femininas) = C(30,2)/C(50,2) ≈ 0,353 → aproximadamente 35% (B)."}, {"edicao": "2024.2", "numero": 4, "texto": "Um capital inicial foi investido por um período. Ao fim da aplicação, o rendimento nominal foi de 80%, do qual deduziu-se imposto sobre o ganho de capital. A inflação acumulada nesse período foi de 5%. Se o ganho real dessa operação foi de 60%, é correto afirmar que a alíquota do imposto foi de (A) 15% (B) 17,5% (C) 20% (D) 22,5%", "gabarito": "A", "explicacao": "Ganho real 60% = (1 + nominal líquido) / (1 + inflação) – 1. Com nominal 80% e inflação 5%, a alíquota do imposto que resulta em ganho real de 60% é 17,5% (B)."}, {"edicao": "2024.2", "numero": 5, "texto": "João vendera determinada mercadoria para Pedro, mas não recebeu o respectivo pagamento. Em razão da amizade que os unia, João estava relutante em ingressar com uma ação judicial para a cobrança do respectivo valor, mas, com a proximidade do prazo prescricional, ficou preocupado. Ao conversar com Pedro, foi dito a João que ele não deveria se preocupar, pois ele, Pedro, renunciaria à prescrição. Ao analisar a disciplina estabelecida no Código Civil brasileiro, João concluiu corretamente que a renúncia que Pedro se propôs a realizar: (A) não é admitida pela sistemática legal. (B) deve ser expressa, sendo vedada a renúncia tácita. (C) só pode ser realizada depois que a prescrição se consumar. (D) pode ser realizada antes ou após a consumação da prescrição, sendo expressa ou tácita. EXAME DE SUFICIÊNCIA 2024/2 TIPO 1 – PÁGINA 3 CONSELHO FEDERAL DE CONTABILIDADE - CFC FGV CONHECIMENTO", "gabarito": "C", "explicacao": "Código Civil: a renúncia à prescrição só pode ser feita depois de consumada e pode ser expressa ou tácita (C)."}, {"edicao": "2024.2", "numero": 6, "texto": "João e Maria, únicos sócios da sociedade empresária Alfa, da qual Pedro era o contador responsável, faleceram em um acidente automobilístico quando se dirigiam para Alfa, não se podendo averiguar qual deles faleceu primeiro. Como João e Maria mantinham uma relação de parentesco, o momento da morte influenciaria na vocação hereditária de um e outro, o que, por via reflexa, também teria reflexos na transmissão das cotas do capital social. Nesse caso, ao analisar a sistemática estabelecida no Código Civil, Pedro concluiu corretamente que, na definição da ordem de falecimento de João e Maria, deve-se presumir que (A) o mais velho faleceu primeiro. (B) o mais jovem faleceu primeiro. (C) faleceram ao mesmo tempo. (D) o que teve o inventário aberto antes faleceu primeiro.", "gabarito": "C", "explicacao": "Comoriência: na dúvida sobre a ordem dos falecimentos, presume-se que faleceram ao mesmo tempo (C)."}, {"edicao": "2024.2", "numero": 7, "texto": "Joana, contabilista, tomou ciência de que certo órgão colegiado de jurisdição administrativa, com competência para processar e julgar recursos interpostos contra decisões administrativas que tenham por objeto o imposto X, proferiu determinada decisão à qual a lei atribui eficácia normativa. Após analisar o Código Tributário Nacional em relação à entrada em vigor dos efeitos normativos da referida decisão, Joana concluiu corretamente que tais efeitos devem ocorrer, salvo disposição em contrário, (A) na data da sua publicação. (B) trinta dias após a data da sua publicação. (C) noventa dias após a data da sua publicação. (D) no exercício financeiro seguinte à data da sua publicação.", "gabarito": "B", "explicacao": "Efeitos normativos de decisão de órgão colegiado de jurisdição administrativa: 30 dias após a publicação, salvo disposição em contrário (CTN)."}, {"edicao": "2024.2", "numero": 8, "texto": "Considerando o CÓDIGO DE ÉTICA PROFISSIONAL DO CONTADOR, em seu item 7, o contador deve estabelecer, por escrito, o valor dos serviços em suas propostas de prestação de serviços profissionais, considerando os elementos abaixo, à exceção de um. Assinale-o. (A) O tempo que será consumido para a realização do trabalho. (B) A possibilidade de ficar impedido da realização de outros serviços. (C) O resultado lícito favorável que, para o contratante, advirá com o serviço prestado. (D) A peculiaridade de tratar-se de cliente imprevisto.", "gabarito": "D", "explicacao": "Código de Ética: o valor dos serviços deve considerar tempo, complexidade, possibilidade de impedimento de outros serviços e resultado lícito favorável. Cliente imprevisto não é critério."}, {"edicao": "2024.2", "numero": 9, "texto": "Considerando o CÓDIGO DE ÉTICA PROFISSIONAL DO CONTADOR, em seu item 8, avalie se nas propostas para a prestação de serviços profissionais devem constar explicitamente: I. todos os serviços cobrados individualmente. II. o valor de cada serviço. III. a periodicidade. IV. a forma de reajuste. Estão corretos os itens: (A) I e II, apenas. (B) III e IV, apenas. (C) I, II e III, apenas. (D) I, II, III e IV. EXAME DE SUFICIÊNCIA 2024/2 TIPO 1 – PÁGINA 4 CONSELHO FEDERAL DE CONTABILIDADE - CFC FGV CONHECIMENTO", "gabarito": "D", "explicacao": "Nas propostas devem constar explicitamente todos os serviços, valores, periodicidade e forma de reajuste (I a IV)."}, {"edicao": "2024.2", "numero": 10, "texto": "Avalie se o CÓDIGO DE ÉTICA PROFISSIONAL DO CONTADOR, em seu item 20, prevê as seguintes penalidades: I. Advertência reservada; II. Advertência pública; III. Censura reservada; IV. Censura pública. Estão corretos os itens (A) I e II, apenas. (B) I, III e IV. (C) I, II e III. (D) II, III e IV.", "gabarito": "B", "explicacao": "Penalidades previstas: advertência reservada, censura reservada e censura pública (não há advertência pública no item 20)."}, {"edicao": "2024.2", "numero": 11, "texto": "A ética é fundamental no exercício da contabilidade, pois garante a integridade, a transparência e a confiança nas informações financeiras divulgadas, aspectos essenciais para o bom funcionamento das empresas e a estabilidade econômica. O papel da contabilidade na sociedade vai além do simples registro de transações, pois ela atua como um mecanismo de (A) controle. (B) auditoria. (C) manutenção. (D) aproximação.", "gabarito": "A", "explicacao": "A contabilidade atua como mecanismo de controle na sociedade."}, {"edicao": "2024.2", "numero": 12, "texto": "Considerado um fato relevante divulgado por uma empresa de capital aberto, a perspectiva de alto potencial de entrada de benefícios econômicos futuros na aquisição de um novo ativo operacional resultou em um aumento (de R$ 4,50 para R$ 60,50 no valor nominal) de suas ações negociadas em Bolsa de Valores no país e no exterior. Dois meses depois, verificou-se que tal fato relevante era falso e que o acionista majoritário tinha conhecimento disso, o que resultou em prejuízo de bilhões de reais para entidade e foi tratado como crime contra o mercado financeiro. Na divulgação inicial do fato relevante, a característica qualitativa fundamental que deixou de ser observada pela entidade foi a (A) comparabilidade. (B) prudência. (C) verificabilidade. (D) representação fidedigna.", "gabarito": "D", "explicacao": "A divulgação de fato relevante falso viola a representação fidedigna."}, {"edicao": "2024.2", "numero": 13, "texto": "Um investidor está analisando as demonstrações contábeis de uma sociedade empresária. O investidor tem disponível, para a sua análise, as demonstrações referentes a 31/12/2023, mas não as dos exercícios anteriores. Nesse caso, o investidor não poderá verificar a seguinte característica qualitativa: (A) relevância. (B) tempestividade. (C) comparabilidade. (D) compreensibilidade.", "gabarito": "C", "explicacao": "Sem demonstrações de períodos anteriores não é possível verificar a comparabilidade."}, {"edicao": "2024.2", "numero": 14, "texto": "Leia o fragmento a seguir: Passivo é a obrigação _____ da entidade de transferir um recurso econômico como resultado de eventos _____. Assinale a opção cujos itens completam corretamente as lacunas do fragmento acima. (A) futura / presente (B) futura / passados (C) presente / futuros (D) presente / passados EXAME DE SUFICIÊNCIA 2024/2 TIPO 1 – PÁGINA 5 CONSELHO FEDERAL DE CONTABILIDADE - CFC FGV CONHECIMENTO", "gabarito": "D", "explicacao": "Passivo é obrigação presente resultante de eventos passados (Estrutura Conceitual)."}, {"edicao": "2024.2", "numero": 15, "texto": "A NBC TG Estrutura Conceitual – ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO indica o conceito financeiro e o conceito físico de capital. De acordo com a norma, a seleção do conceito apropriado de capital pela entidade deve ser baseada (A) na forma jurídica dos atos e fatos contábeis. (B) na essência econômica dos atos e fatos contábeis. (C) nas determinações das entidades reguladoras. (D) nas necessidades dos usuários de suas demonstrações contábeis.", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 16, "texto": "Com relação à Resolução CFC nº 1.328/11, que dispõe sobre a Estrutura das Normas Brasileiras de Contabilidade, avalie as afirmativas a seguir e assinale (V) para a verdadeira e (F) para a falsa. ( ) As Normas Brasileiras de Contabilidade classificam-se em Profissionais, Técnicas e Educacionais. ( ) As Normas Brasileiras de Contabilidade estabelecem preceitos de conduta profissional, procedimentos técnicos necessários para o adequado exercício profissional e metodologia para o ensino adequado das normas. ( ) As Normas Brasileiras de Contabilidade editadas pelo Conselho Federal de Contabilidade (CFC) devem seguir os mesmos padrões de elaboração e estilo utilizados nas normas internacionais e compreendem as Normas propriamente ditas, as Interpretações Técnicas e os Comunicados Técnicos. As afirmativas são, respectivamente, (A) F – V – V. (B) V – F – V. (C) V – V – F. (D) F – F – V.", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 17, "texto": "De acordo com a NBC TG 27 (R4) – ATIVO IMOBILIZADO, o custo de um item do ativo imobilizado compreende, entre outros, quaisquer custos diretamente atribuíveis para colocar o ativo no local e as condições necessárias para ele ser capaz de funcionar da forma pretendida pela administração. Entre os custos diretamente atribuíveis estão os custos (A) de abertura de nova instalação. (B) incorridos na introdução de novo produto ou serviço. (C) com testes para verificar se o ativo está funcionando corretamente. (D) da transferência das atividades para novo local ou para nova categoria de clientes.", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 18, "texto": "De acordo com a NBC TG 26 (R5) – APRESENTAÇÃO DAS DEMONSTRAÇÕES CONTÁBEIS, a informação é material se sua omissão, distorção ou obscuridade pode influenciar, de modo razoável, decisões que os usuários primários das demonstrações contábeis de propósito geral tomam como base nessas demonstrações contábeis que fornecem informações financeiras sobre relatório específico da entidade. Com base nesse enunciado, leia o fragmento a seguir. A materialidade depende da _____ ou _____ da informação, ou de ambas. A entidade avalia se a informação, individualmente ou em combinação com outra informação, é material no contexto das suas demonstrações contábeis tomadas como um todo. Assinale a alternativa cujos itens completam corretamente as lacunas do fragmento acima. (A) rapidez - fonte. (B) natureza - fonte. (C) rapidez - magnitude. (D) natureza - magnitude. EXAME DE SUFICIÊNCIA 2024/2 TIPO 1 – PÁGINA 6 CONSELHO FEDERAL DE CONTABILIDADE - CFC FGV CONHECIMENTO", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 19, "texto": "A NBC TG 25 – PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES ilustra o tratamento contábil quando uma obrigação presente ou possível da entidade envolve prazos ou valores incertos. Com base na referida norma, relacione o tratamento dado a cada situação a seguir com seu reconhecimento e divulgação. I. Há obrigação presente que provavelmente requer uma saída de recursos. II. Há obrigação possível ou obrigação presente que pode requerer, mas provavelmente não irá requerer, uma saída de recursos. III. Há obrigação possível ou obrigação presente cuja probabilidade de uma saída de recursos é remota. ( ) Não é reconhecida nenhuma provisão e não há obrigatoriedade de divulgação. ( ) Deve-se reconhecer a provisão e divulgar em nota explicativa. ( ) Não é reconhecida a provisão, mas é divulgado o fato em nota explicativa como passivo contingente. A relação correta, na ordem apresentada, é (A) III – I – II. (B) III – II – I. (C) II – I – III. (D) I – III – II.", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, leis citadas)."}, {"edicao": "2024.2", "numero": 20, "texto": "Uma sociedade empresária pode elaborar sua Demonstração dos Fluxos de Caixa de acordo com o método direto ou com o método indireto. De acordo com a NBC TG 03 (R3) – DEMONSTRAÇÃO DOS FLUXOS DE CAIXA, a diferença entre as duas demonstrações elaboradas consiste somente na apresentação (A) da atividade operacional. (B) da atividade de investimento. (C) da atividade de financiamento. (D) do caixa e equivalentes de caixa.", "gabarito": "A", "explicac
