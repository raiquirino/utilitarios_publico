<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Simulado CFC – Exame de Suficiência</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --border: #d8dee6;
    --text: #2c3e50;
    --muted: #6b7c8f;
    --accent: #2a6f97;
    --accent-soft: #e8f1f7;
    --success: #2d6a4f;
    --success-bg: #e8f5e9;
    --danger: #9b2226;
    --danger-bg: #fce8e8;
    --header: #1b4f72;
    --shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.45;
    font-size: 15px;
  }
  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 12px 12px 90px;
  }

  /* Header compacto */
  header {
    background: var(--header);
    color: #fff;
    padding: 14px 16px;
    border-radius: 10px;
    margin-bottom: 14px;
    text-align: center;
  }
  header h1 { font-size: 1.2rem; font-weight: 700; margin-bottom: 2px; }
  header p { font-size: 0.78rem; opacity: 0.85; }

  /* Setup */
  #setup {
    background: var(--card);
    border-radius: 10px;
    padding: 18px 16px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  #setup h2 { font-size: 1.05rem; margin-bottom: 12px; color: var(--header); }
  .form-row { margin-bottom: 12px; }
  label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 0.82rem; font-weight: 500; }
  select, input[type="number"] {
    width: 100%;
    padding: 9px 12px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    font-size: 0.95rem;
  }
  .checks { display: flex; flex-wrap: wrap; gap: 6px; }
  .checks label {
    display: flex; align-items: center; gap: 5px;
    background: var(--bg); padding: 6px 10px; border-radius: 6px;
    border: 1px solid var(--border); cursor: pointer; font-size: 0.82rem;
    color: var(--text); margin-bottom: 0;
  }
  .checks input { width: auto; accent-color: var(--accent); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    padding: 9px 16px; border-radius: 7px; border: none;
    font-size: 0.9rem; font-weight: 600; cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #1e5a7a; }
  .btn-secondary { background: #e9eef3; color: var(--text); }
  .btn-secondary:hover { background: #dce3ea; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

  /* Quiz */
  #quiz { display: none; }
  .progress-bar {
    height: 5px; background: #dde3ea; border-radius: 3px;
    margin-bottom: 8px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: var(--accent);
    transition: width 0.25s;
  }
  .meta {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; font-size: 0.78rem; color: var(--muted);
  }
  .badge {
    background: var(--accent-soft); color: var(--accent);
    padding: 2px 9px; border-radius: 12px; font-size: 0.75rem; font-weight: 600;
  }

  .card {
    background: var(--card);
    border-radius: 10px;
    padding: 16px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .q-header {
    font-size: 0.78rem; color: var(--accent);
    margin-bottom: 6px; font-weight: 600;
  }
  .q-text {
    font-size: 0.95rem; margin-bottom: 12px;
    white-space: pre-wrap; line-height: 1.5;
  }

  .options { display: flex; flex-direction: column; gap: 6px; }
  .option {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px; border-radius: 8px;
    border: 1.5px solid var(--border); cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
    background: #fafbfc;
  }
  .option:hover { border-color: var(--accent); background: var(--accent-soft); }
  .option.selected { border-color: var(--accent); background: var(--accent-soft); }
  .option.correct { border-color: var(--success); background: var(--success-bg); }
  .option.wrong { border-color: var(--danger); background: var(--danger-bg); }
  .option input { margin-top: 2px; accent-color: var(--accent); flex-shrink: 0; }
  .option span { flex: 1; font-size: 0.9rem; }

  .feedback {
    display: none; margin-top: 12px; padding: 12px;
    border-radius: 8px; background: #f0f4f8; border: 1px solid var(--border);
  }
  .feedback.show { display: block; }
  .feedback .gab {
    font-weight: 700; color: var(--success); margin-bottom: 4px; font-size: 0.9rem;
  }
  .feedback .exp { color: var(--muted); font-size: 0.85rem; line-height: 1.45; }

  /* Nav bar */
  .nav-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #fff;
    border-top: 1px solid var(--border);
    padding: 8px 10px;
    display: flex; justify-content: center; gap: 6px;
    z-index: 50;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.05);
  }
  .nav-bar .btn { flex: 1; max-width: 160px; padding: 10px 8px; font-size: 0.85rem; }

  /* Result */
  #result { display: none; text-align: center; }
  #result .score {
    font-size: 2.8rem; font-weight: 800; color: var(--accent);
    margin: 12px 0 2px;
  }
  #result .score-label { color: var(--muted); margin-bottom: 12px; font-size: 0.9rem; }

  /* Desktop */
  @media (min-width: 700px) {
    .container { padding: 18px 16px 90px; }
    header { padding: 16px 20px; }
    header h1 { font-size: 1.35rem; }
    .card { padding: 20px 22px; }
    .q-text { font-size: 1rem; }
    .option { padding: 11px 14px; }
    .option span { font-size: 0.93rem; }
    .nav-bar .btn { max-width: 180px; font-size: 0.9rem; }
  }

  /* Mobile small */
  @media (max-width: 400px) {
    body { font-size: 14px; }
    .container { padding: 8px 8px 85px; }
    header h1 { font-size: 1.05rem; }
    .card { padding: 12px; }
    .option { padding: 8px 10px; gap: 8px; }
    .nav-bar .btn { font-size: 0.78rem; padding: 9px 4px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Simulado CFC – Exame de Suficiência</h1>
    <p>250 questões • Edições 2024.1 a 2026.1 • Tipo 1</p>
  </header>

  <!-- SETUP -->
  <div id="setup">
    <h2>Configurar Simulado</h2>
    <div class="form-row">
      <label>Quantidade de questões</label>
      <input type="number" id="qtd" value="50" min="1" max="250">
    </div>
    <div class="form-row">
      <label>Edições</label>
      <div class="checks" id="edicoes">
        <label><input type="checkbox" value="2026.1" checked> 2026.1</label>
        <label><input type="checkbox" value="2025.2" checked> 2025.2</label>
        <label><input type="checkbox" value="2025.1" checked> 2025.1</label>
        <label><input type="checkbox" value="2024.2" checked> 2024.2</label>
        <label><input type="checkbox" value="2024.1" checked> 2024.1</label>
      </div>
    </div>
    <div class="form-row">
      <label style="display:flex;align-items:center;gap:6px;color:var(--text);font-size:0.9rem">
        <input type="checkbox" id="shuffle" checked style="width:auto;accent-color:var(--accent)">
        Embaralhar questões
      </label>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="startQuiz()">Iniciar Simulado</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quiz">
    <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>
    <div class="meta">
      <span id="counter">1 / 50</span>
      <span class="badge" id="edicaoBadge">2026.1</span>
      <span id="timer">00:00</span>
    </div>
    <div class="card">
      <div class="q-header" id="qHeader">2026.1 – Questão 1</div>
      <div class="q-text" id="qText"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback">
        <div class="gab" id="gabText"></div>
        <div class="exp" id="expText"></div>
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result">
    <div class="card">
      <h2 style="color:var(--header);font-size:1.15rem">Resultado do Simulado</h2>
      <div class="score" id="scoreNum">0</div>
      <div class="score-label" id="scoreLabel">acertos de 50</div>
      <p id="scorePct" style="font-size:1.2rem;margin-bottom:12px;color:var(--accent);font-weight:700"></p>
      <p id="aprovacao" style="margin-bottom:16px;font-weight:600;font-size:0.95rem"></p>
      <div class="btn-row" style="justify-content:center">
        <button class="btn btn-primary" onclick="location.reload()">Novo Simulado</button>
        <button class="btn btn-secondary" onclick="reviewWrong()">Revisar erros</button>
      </div>
    </div>
  </div>
</div>

<div class="nav-bar" id="navBar" style="display:none">
  <button class="btn btn-secondary" id="btnPrev" onclick="prevQ()">← Anterior</button>
  <button class="btn btn-success" id="btnGab" onclick="toggleGab()">Gabarito</button>
  <button class="btn btn-primary" id="btnNext" onclick="nextQ()">Próximo →</button>
  <button class="btn btn-danger" id="btnFinish" onclick="finishQuiz()" style="display:none">Finalizar</button>
</div>

<script>
const TODAS = [{"edicao": "2026.1", "numero": 1, "texto": "Observe o seguinte texto de Bertrand Russell: A matemática, vista corretamente, possui não apenas verdade, mas também suprema beleza – uma beleza fria e austera, como a da escultura. Assinale a opção que mostra uma afirmação correta sobre o texto. (A) A frase mostra simultaneamente aspectos positivos e negativos da matemática. (B) O emprego da expressão “não apenas verdade” abre a possibilidade de dizer-se “mas suprema beleza”. (C) A expressão “uma beleza fria e austera” nega a afirmação anterior de que a matemática possui suprema beleza. (D) Ao afirmar que a beleza da matemática é como a da escultura, a frase desvaloriza a escultura.", "gabarito": "B", "explicacao": "A construção 'não apenas... mas também' abre a possibilidade de acrescentar a ideia de 'suprema beleza'. A alternativa B descreve corretamente o emprego linguístico da expressão."}, {"edicao": "2026.1", "numero": 2, "texto": "Nem sempre os números indicam uma quantidade precisa. Assinale a frase em que há precisão. (A) Os especialistas em contagem de público dizem que havia mais de um milhão de pessoas na passeata. (B) O mesmo motorista envolvido no acidente de ontem já havia passado por três outras ocorrências semelhantes. (C) Perto de mil veículos passaram pelo pedágio, no mesmo dia, em função do feriado. (D) O vídeo mostrava cerca de 50 automóveis que estavam parados por causa do desmoronamento.", "gabarito": "B", "explicacao": "Somente a opção B traz quantidade precisa ('três outras ocorrências'). As demais usam termos aproximativos ('mais de', 'perto de', 'cerca de')."}, {"edicao": "2026.1", "numero": 3, "texto": "Uma empresa decidiu renovar parte de sua frota adquirindo novos veículos. Para não descapitalizar o caixa da empresa, a diretoria decidiu financiar R$ 240.000,00 junto a um banco. O contrato de financiamento prevê que a dívida seja quitada por meio de 30 pagamentos mensais, postecipados e consecutivos, de acordo com a tabela SAC (Sistema de Amortização Constante). Fica firmado que a taxa efetiva de juros permanecerá fixa em 4% ao mês, ao longo de toda a vigência do contrato. Considerando estritamente as condições descritas acima, é correto afirmar que o valor do quinto pagamento será de (A) R$ 8.320,00. (B) R$ 16.000,00. (C) R$ 16.320,00. (D) R$ 17.600,00.", "gabarito": "C", "explicacao": "SAC: amortização constante = 240.000 / 30 = 8.000. Após 4 prestações o saldo é 208.000. Juros do 5º mês = 208.000 × 4% = 8.320. Prestação = 8.000 + 8.320 = 16.320 (alternativa C)."}, {"edicao": "2026.1", "numero": 4, "texto": "Um contador trabalha em uma firma de auditoria e foi alocado na equipe de Data Analytics. Sua tarefa é analisar o comportamento das vendas de uma rede varejista, para definir parâmetros de risco e identificar dias com faturamentos atípicos. Após extrair os dados, o contador constata que o faturamento diário da rede segue perfeitamente uma distribuição normal, com média igual a R$ 40.000,00. O contador também verifica que a probabilidade de que, em um dia aleatório, o faturamento esteja entre R$ 38.000,00 e R$ 42.000,00 é de 52%. Com base nessas informações, o contador conclui corretamente que a probabilidade de a rede varejista registrar faturamento diário inferior a R$ 38.000,00 é de (A) 24%. (B) 26%. (C) 48%. (D) 76%.", "gabarito": "A", "explicacao": "Distribuição normal simétrica. O intervalo central de 52% deixa 48% nas duas caudas → cada cauda inferior/superior = 24%. Logo a probabilidade de faturamento < 38.000 é 24% (A)."}, {"edicao": "2026.1", "numero": 5, "texto": "Após a observância das formalidades constitucionais e legais, o Estado Alfa celebrou contrato administrativo com a sociedade empresária Beta, visando à construção de um prédio público moderno que atenderá, com eficiência e celeridade, aos anseios da coletividade. Registre-se, contudo, que a Administração Pública anteviu a necessidade de proceder à modificação do contrato administrativo em fase de execução, para melhor adequação às finalidades de interesse público. Nesse cenário, considerando as disposições da Lei nº 14.133/2021, é correto afirmar que o Estado Alfa (A) não poderá modificar o contrato administrativo, o qual, estando em fase de execução, é considerado lei entre as partes contratantes. (B) poderá modificar o contrato administrativo, desde que haja concordância expressa ou tácita da sociedade empresária Beta. (C) poderá modificar unilateralmente o contrato administrativo, respeitados os direitos do contratado. (D) não poderá modificar o contrato administrativo, salvo em caso de autorização judicial.", "gabarito": "C", "explicacao": "Lei 14.133/2021 permite a Administração modificar unilateralmente o contrato para melhor adequação ao interesse público, respeitados os direitos do contratado (art. 124 e seguintes)."}, {"edicao": "2026.1", "numero": 6, "texto": "O Município Alfa e o Estado Beta, em observância às formalidades legais, pretendem utilizar o sistema de registro de preços, procedimento auxiliar das licitações e contratações públicas. Busca-se, assim, a formalização, no âmbito das respectivas competências, de atas de registro de preços. Trata-se de documento vinculativo e obrigacional, com característica de compromisso para futura contratação, no qual são registrados o objeto, os preços, os fornecedores, os órgãos participantes e as condições a serem praticadas, conforme as disposições contidas no edital da licitação, no aviso ou instrumento de contratação direta e nas propostas apresentadas. Ao tomar conhecimento das pretensões dos referidos entes da Federação, o órgão público Charlie, integrante da Administração Pública Federal, demonstrou interesse em aderir, futuramente, às referidas atas de registro de preços, a serem gerenciadas pelo Município Alfa e pelo Estado Beta. Nesse cenário, considerando as disposições da Lei n o 14.133/2021, é correto afirmar que o órgão público Charlie, integrante da Administração Pública Federal, (A) não poderá aderir às atas de registro de preços a serem gerenciadas pelo Município Alfa e pelo Estado Beta, salvo se houver a concordância expressa dos referidos entes federativos. (B) poderá aderir à ata de registro de preços a ser gerenciada pelo Estado Beta, mas não à ata de registro de preços que será gerenciada pelo Município Alfa. (C) poderá aderir à ata de registro de preços a ser gerenciada pelo Município Alfa, mas não à ata de registro de preços que será gerenciada pelo Estado Beta. [...]", "gabarito": "D", "explicacao": "Conforme a Lei 14.133/2021, órgãos da Administração Pública Federal não podem aderir a atas de registro de preços gerenciadas por Municípios ou Estados."}, {"edicao": "2026.1", "numero": 7, "texto": "A sociedade empresária Alfa, concessionária de serviços públicos no Município Beta, deparou-se com a necessidade, em um sábado, de proceder à interrupção do serviço prestado à coletividade residente e domiciliada no bairro Gama, sem aviso prévio, em razão de situação de emergência constatada na localidade. Nesse cenário, considerando as disposições da Lei nº 8.987/1995, é correto afirmar que (A) não se está diante de hipótese de descontinuidade do serviço, pois a interrupção, em caso de emergência ou motivada por razões de ordem técnica, independe de aviso prévio. (B) não se está diante de hipótese de descontinuidade do serviço, pois a interrupção ocorreu em situação de emergência, dispensando aviso prévio. (C) se está diante de hipótese de descontinuidade do serviço, pois a interrupção, ainda que em situação de emergência, não pode se iniciar no final de semana. (D) se está diante de hipótese de descontinuidade do serviço, pois a interrupção, ainda que em situação de emergência, pressupõe aviso prévio.", "gabarito": "B", "explicacao": "Lei 8.987/1995: a interrupção do serviço em situação de emergência ou por razões de ordem técnica não caracteriza descontinuidade e dispensa aviso prévio."}, {"edicao": "2026.1", "numero": 8, "texto": "Durante o encerramento do exercício, o contador da empresa “Q” Ltda. foi pressionado pela administração para postergar o reconhecimento de uma despesa relevante, com o objetivo de melhorar artificialmente o resultado do período. Considerando as disposições da NBC PG 01 – CÓDIGO DE ÉTICA PROFISSIONAL DO CONTADOR, a conduta profissional adequada é (A) atender à solicitação da administração, desde que o ajuste não gere impacto tributário relevante. (B) ajustar temporariamente o resultado, caso a administração formalize por escrito a responsabilidade pela decisão. (C) negociar a postergação da despesa para o exercício seguinte, buscando conciliar interesses empresariais e profissionais. (D) manter a escrituração conforme as normas contábeis vigentes, preservando a integridade e a objetividade profissional, mesmo diante de pressões internas.", "gabarito": "D", "explicacao": "NBC PG 01 (Código de Ética): o contador deve manter a escrituração de acordo com as normas contábeis, preservando integridade e objetividade, mesmo diante de pressões internas."}, {"edicao": "2026.1", "numero": 9, "texto": "Uma firma de auditoria fora contratada para emitir relatório de asseguração sobre informações financeiras de determinada entidade e, posteriormente, ainda no mesmo exercício social, aceitou assumir decisões administrativas relacionadas à elaboração dessas mesmas informações. Considerando o papel da Contabilidade na sociedade e as disposições da NBC PG 100 (R1) – CUMPRIMENTO DO CÓDIGO, DOS PRINCÍPIOS FUNDAMENTAIS E DA ESTRUTURA CONCEITUAL e da NBC PG 01 – CÓDIGO DE ÉTICA PROFISSIONAL DO CONTADOR, a atuação adequada da firma de auditoria deve refletir a ideia de que (A) a independência pode ser relativizada se houver confiança mútua entre auditor e administração. (B) a assunção de responsabilidade gerencial é aceitável quando não houver impacto financeiro relevante. (C) a firma pode assumir funções administrativas desde que posteriormente reveja tecnicamente seu próprio trabalho. (D) a firma não deve assumir responsabilidade de gestão, pois isso gera ameaças à independência e compromete o interesse público que fundamenta a atuação do contador.", "gabarito": "D", "explicacao": "NBC PG 100 e Código de Ética: a firma de auditoria não deve assumir responsabilidade de gestão das informações sobre as quais emitirá asseguração, sob pena de ameaça à independência e ao interesse público."}, {"edicao": "2026.1", "numero": 10, "texto": "De acordo com a NBC TG ESTRUTURA CONCEITUAL (R2) – ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, ativo é um recurso econômico presente, controlado pela entidade como resultado de eventos passados. Um recurso econômico representa (A) um bem ou um direito que pertence à entidade. (B) uma obrigação de transferir benefícios econômicos. (C) um direito que tem o potencial de produzir benefícios econômicos. (D) uma obrigação que resulta em aumento no patrimônio líquido, exceto quando referente a contribuições de detentores de direitos sobre o patrimônio.", "gabarito": "C", "explicacao": "NBC TG Estrutura Conceitual: recurso econômico é um direito que tem o potencial de produzir benefícios econômicos."}, {"edicao": "2026.1", "numero": 11, "texto": "Em 2024, uma empresa de varejo estimava inadimplência de 2% sobre o saldo de Clientes. Em 2025, buscando aumentar as vendas, a empresa reduziu as suas exigências para concessão de crédito aos clientes. Assim, uma análise criteriosa indicava que a inadimplência seria muito próxima de 5% nesse ano. No entanto, uma vez que os administradores da empresa são avaliados de acordo com o resultado operacional, eles escolheram continuar utilizando a estimativa anterior, de 2%. Ao avaliar se a informação contábil pode ser considerada representação fidedigna, é correto concluir que (A) pode ser, uma vez que é comparável. (B) pode ser, uma vez que é tempestiva. (C) não pode ser, uma vez que não é neutra. (D) não pode ser, uma vez que não é verificável.", "gabarito": "C", "explicacao": "A manutenção da estimativa de 2% (quando a análise indicava 5%) viola a neutralidade, um dos atributos da representação fidedigna."}, {"edicao": "2026.1", "numero": 12, "texto": "Em janeiro de 2026, uma entidade fabril assinou um contrato para a compra de uma máquina por R$ 50.000,00. O montante foi pago integralmente em fevereiro. A máquina foi recebida em março, quando foi instalada e disponibilizada para uso. No entanto, por decisão da entidade, a máquina começou a ser efetivamente utilizada em abril. No Balanço Patrimonial da entidade, a máquina deve ser reconhecida a partir de (A) janeiro. (B) fevereiro. (C) março. (D) abril. fc", "gabarito": "C", "explicacao": "O ativo é reconhecido no momento em que a entidade obtém o controle (máquina recebida, instalada e disponível para uso – março)."}, {"edicao": "2026.1", "numero": 13, "texto": "Em 01/03/2026, uma sociedade empresária adquiriu um equipamento de grande porte por um montante considerado relevante para ela. Para a aquisição, foram pagos R$ 100.000,00 à vista, e o restante tinha prazo para pagamento de 60 dias. Essa parcela complementar estava fixada em R$ 105.000,00, enquanto o seu valor presente na data da compra era de R$ 100.000,00. Assinale a opção que indica o custo histórico do passivo líquido no momento da compra, de acordo com a NBC TG ESTRUTURA CONCEITUAL (R2) – ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO: (A) R$ 100.000,00. (B) R$ 105.000,00. (C) R$ 200.000,00. (D) R$ 205.000,00.", "gabarito": "ANULADA", "explicacao": "Questão anulada pela banca FGV."}, {"edicao": "2026.1", "numero": 14, "texto": "Uma empresa S.A. atua no setor de bebidas e possui diversas unidades de negócios. Entre elas, destacam-se as operações de “Cervejas” e “Refrigerantes”. A administração da companhia utiliza regularmente informações de desempenho dessas unidades para fins de avaliação de resultados e alocação de recursos, sendo tais informações analisadas pelo principal responsável pela tomada de decisões operacionais da entidade (CODM – Chief Operating Decision Maker). A empresa avaliou os seguintes indicadores referentes ao exercício: • A unidade Cervejas representa 12% da receita combinada de todos os segmentos operacionais. • A unidade Refrigerantes possui 9% da receita combinada, mas 11% dos ativos combinados dos segmentos operacionais. • Ambas as unidades têm suas informações regularmente revisadas pelo principal responsável pela tomada de decisões operacionais. Considerando as informações apresentadas e os preceitos da NBC TG 22 (R2) – INFORMAÇÕES POR SEGMENTO, é correto afirmar que (A) apenas o segmento Cervejas deve ser divulgado separadamente, pois somente ele ultrapassa o limite de 10% da receita combinada dos segmentos operacionais. (B) apenas o segmento Refrigerantes, deve ser divulgado separadamente, pois o critério de ativos é suficiente para caracterizar segmento reportável. (C) ambos os segmentos devem ser divulgados separadamente, pois cada um atende a, pelo menos, um dos critérios quantitativos previstos para segmentação reportável. (D) nenhum dos segmentos deve ser divulgado separadamente, pois é necessário que o segmento atenda simultaneamente aos critérios de receita, re [...]", "gabarito": "C", "explicacao": "Fundamentação na NBC TG 26 e princípios de elaboração das demonstrações (continuidade operacional)."}, {"edicao": "2026.1", "numero": 15, "texto": "Uma empresa S.A. apresentou, em 31/12/2025, ativos fiscais diferidos decorrentes de prejuízos fiscais, bases negativas de contribuição social e diferenças temporárias dedutíveis, totalizando R$ 6.669.000,00 nas demonstrações individuais e R$ 7.121.000,00 nas demonstrações consolidadas. Conforme divulgado em nota explicativa, a realização desses ativos depende da geração futura de lucros tributáveis suficientes para permitir a compensação dos prejuízos fiscais e das bases negativas, bem como da reversão das diferenças temporárias dedutíveis. A administração elaborou projeções de resultados tributáveis futuros que suportam o reconhecimento desses ativos fiscais diferidos. O auditor independente incluiu, em seu relatório, parágrafo chamando a atenção para a nota explicativa, destacando a existência de incerteza relacionada ao prazo de realização dos ativos fiscais diferidos, mas afirmando que sua opinião não está ressalvada em relação a esse assunto. Considerando as informações apresentadas e os preceitos da NBC TG 32 (R4) – TRIBUTOS SOBRE O LUCRO, conclui-se que (A) a existência de prejuízos fiscais acumulados impede o reconhecimento de ativos fiscais diferidos, devendo tais valores ser reconhecidos somente quando ocorrer efetivamente lucro tributável suficiente para sua compensação. (B) a entidade deve reconhecer ativo fiscal diferido decorrente de prejuízos fiscais, somente quando for provável a existência de lucro tributável futuro suficiente para sua compensação. (C) os ativos fiscais diferidos decorrentes de prejuízos fiscais podem ser reconhecidos com base em estimativa [...]", "gabarito": "B", "explicacao": "Representação fidedigna exige que a informação seja completa, neutra e isenta de erros (NBC TG Estrutura Conceitual)."}, {"edicao": "2026.1", "numero": 16, "texto": "Uma companhia aberta brasileira atua no comércio varejista de bens de consumo por meio de lojas físicas e de plataforma digital. Em suas vendas on-line, a entidade também realiza o transporte das mercadorias por meio de logística própria. Em determinado dia, um cliente adquiriu um livro por meio do website da companhia. O pagamento foi realizado instantaneamente via PIX, e a nota fiscal eletrônica foi imediatamente emitida e enviada ao cliente por e-mail. O livro foi separado no centro de distribuição da empresa e despachado em caminhão pertencente à própria companhia, responsável pela entrega ao consumidor final. Durante o trajeto, antes da entrega ao cliente, o caminhão sofreu um acidente e parte das mercadorias transportadas foi completamente destruída, incluindo o livro adquirido pelo cliente. Considerando-se as informações apresentadas e os preceitos da NBC TG 47 – RECEITA DE CONTRATO COM CLIENTE, a receita deve ser reconhecida (A) quando o pagamento via PIX foi realizado, pois a contraprestação foi recebida e a nota fiscal emitida; a perda do livro deve ser reconhecida pelo cliente, que já havia quitado a compra. (B) no momento do despacho da mercadoria pelo centro de distribuição, pois a empresa já cumpriu sua obrigação principal; a perda decorrente do acidente deve ser reconhecida pelo cliente. (C) quando o livro for efetivamente entregue ao cliente, momento em que ocorre a transferência de controle do bem; como o acidente ocorreu antes da entrega, a perda do livro deve ser reconhecida pela própria companhia. (D) no momento da emissão da nota fiscal eletrônica, pois [...]", "gabarito": "C", "explicacao": "NBC TG 31: ativos não circulantes mantidos para venda são mensurados pelo menor entre valor contábil e valor justo menos despesas de venda; há reclassificação para circulante quando os critérios são atendidos."}, {"edicao": "2026.1", "numero": 17, "texto": "Com base na NBC TG 06 (R3) – OPERAÇÕES DE ARRENDAMENTO MERCANTIL, assinale a opção que apresenta o procedimento correto para a contabilização de um contrato de arrendamento de uma máquina celebrado entre a arrendatária ABC e a arrendadora XYZ. (A) O ativo de direito de uso deve ser mensurado inicialmente pelo valor justo da máquina, e posteriormente pelo mesmo valor contábil de máquinas similares de propriedade da ABC. (B) A empresa ABC, ao definir a vida útil para cálculo da depreciação do ativo de direito de uso, precisou definir se permanecerá ou não com a máquina permanentemente. Caso ela opte por não permanecer com a máquina ao final do contrato de arrendamento, a vida útil será a menor entre o prazo do arrendamento e a vida útil da máquina. (C) O reconhecimento do ativo de direito de uso pela ABC implica a baixa do ativo imobilizado pela XYZ, para evitar duplo reconhecimento do mesmo bem. (D) A depreciação do ativo de direito de uso na arrendatária ABC tem como contrapartida o passivo de arrendamento reconhecido junto à XYZ.", "gabarito": "B", "explicacao": "Fundamentação na estrutura conceitual e critérios de reconhecimento de ativos/passivos."}, {"edicao": "2026.1", "numero": 18, "texto": "Em 2023, uma empresa de consultoria contábil pagou R$ 20.000,00 a título de juros sobre empréstimo bancário. De acordo com a NBC TG 03 (R3) – DEMONSTRAÇÃO DOS FLUXOS DE CAIXA, os juros pagos podem ser classificados, na Demonstração dos Fluxos de Caixa, como fluxos de caixa (A) operacionais ou de investimento. (B) operacionais ou de financiamento. (C) de investimento ou de financiamento. (D) de financiamento ou de equivalentes de caixa.", "gabarito": "B", "explicacao": "As demonstrações devem fornecer informações comparativas de pelo menos um período anterior (NBC TG Estrutura Conceitual / NBC TG 26)."}, {"edicao": "2026.1", "numero": 19, "texto": "Na geração interna de um ativo intangível por uma sociedade empresária, foram gastos R$ 10.000,00 com atividades destinadas à obtenção de novo conhecimento, R$ 15.000,00 com formulação, projeto, avaliação e seleção final de alternativas possíveis para materiais e processos, e R$ 20.000,00 com o projeto, construção e teste de protótipos e modelos pré-produção. Sabe-se que estavam presentes todos os requisitos dispostos na NBC TG 04 (R4) – ATIVO INTANGÍVEL, para o reconhecimento dos gastos incorridos na fase de desenvolvimento de um Ativo Intangível. A vida útil estimada do ativo é de 10 anos e o valor residual é zero. Considerando que a sociedade empresária utiliza o método da linha reta para amortizar os seus ativos intangíveis, a despesa de amortização anual do ativo foi de (A) R$ 0,00. (B) R$ 2.000,00. (C) R$ 3.500,00. (D) R$ 4.500,00.", "gabarito": "B", "explicacao": "Aumento do passivo = compra a prazo (5.000) + adiantamento de clientes (10.000) + salários a pagar (12.000) = 27.000."}, {"edicao": "2026.1", "numero": 20, "texto": "Uma loja de celulares utiliza o Custo Médio Ponderado móvel em base diária para valoração do estoque. Em julho de 2025, não havia estoque inicial do celular de modelo “XPTO”. No mês, houve a seguinte movimentação em relação a esse modelo de celular: • 02/07: compra de 20 unidades por R$ 3.000,00 cada; • 10/07: venda de 10 unidades por R$ 5.000,00 cada; • 15/07: compra de 15 unidades por R$ 3.200,00 cada; • 20/07: venda de 8 unidades por R$ 5.000,00 cada; • 27/07: venda de 5 unidades por R$ 5.200,00 cada. O estoque de “XPTO” da loja, em 31/07/2025, era de (A) R$ 36.988,00. (B) R$ 37.200,00. (C) R$ 37.440,00. (D) R$ 61.200,00.", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas de contabilidade geral."}, {"edicao": "2026.1", "numero": 21, "texto": "Em sua Demonstração do Valor Adicionado, uma sociedade empresária apresentou os seguintes saldos: • Despesas financeiras: R$ 35.000,00; • Assistência médica a empregados: R$ 80.000,00; • Aluguel: R$ 120.000,00; • Remuneração direta de empregados: R$ 240.000,00. O saldo apresentado em “Remuneração de Capitais de Terceiros”, na segunda parte da Demonstração do Valor Adicionado, de acordo com a NBC TG 09 (R1) – DEMONSTRAÇÃO DO VALOR ADICIONADO, foi de (A) R$ 155.000,00. (B) R$ 235.000,00. (C) R$ 320.000,00. (D) R$ 475.000,00.", "gabarito": "A", "explicacao": "Explicação técnica conforme conteúdo de contabilidade de custos ou gerencial e gabarito oficial."}, {"edicao": "2026.1", "numero": 22, "texto": "Os saldos das contas de resultado do exercício da Cia. “G” S.A. em 31/12/X2 eram os seguintes: • Despesas com tributos sobre o lucro: R$ 510.000,00; • Despesas operacionais: R$ 20.000,00; • Receita bruta de serviços: R$ 1.500.000,00; • Impostos sobre serviços: R$ 40.000,00; • Descontos incondicionais: R$ 30.000,00; • Custo dos serviços prestados: R$ 400.000,00. Com base nessas informações, é correto afirmar que a Cia. “G” S.A. apurou (A) um lucro bruto de R$ 1.050.000,00. (B) uma receita líquida de serviços de R$ 1.030.000,00. (C) um lucro bruto de R$ 1.010.000,00. (D) um lucro líquido de R$ 500.000,00.", "gabarito": "D", "explicacao": "Fundamentação nas normas brasileiras de contabilidade e princípios aplicáveis."}, {"edicao": "2026.1", "numero": 23, "texto": "A Cia. “C” S.A. possuía, em 31/12/X1, um ativo registrado em seu imobilizado mensurado como segue: • Custo de aquisição: R$ 105.000,00; • (–) Depreciação acumulada: R$ 20.000,00; • (–) Perda por redução ao valor recuperável reconhecida em X0: R$ 10.000,00. Antes da elaboração das demonstrações contábeis, a empresa realizou o teste de recuperabilidade do ativo, apurando os seguintes valores: • Valor justo líquido de despesas de venda: R$ 80.000,00; • Valor em uso: R$ 90.000,00. Com base nos dados apresentados, é correto afirmar que (A) o valor contábil líquido do ativo, antes do ajuste da perda, é de R$ 85.000,00. (B) o valor recuperável do ativo, no momento da avaliação, é de R$ 80.000,00. (C) o valor recuperável do ativo, no momento da avaliação, é de R$ 90.000,00. (D) a perda estimada para esse ativo é de R$ 25.000,00.", "gabarito": "C", "explicacao": "Explicação alinhada à legislação e ao raciocínio da banca."}, {"edicao": "2026.1", "numero": 24, "texto": "A empresa “A” realizou a venda de 350.000 quadros de madeira (30x40 cm), totalizando R$ 250.000,00 em mercadorias vendidas. Sabe-se que o controle das mercadorias foi imediatamente transferido aos clientes. O recebimento foi distribuído da seguinte forma: 50% em Caixa, 25% em Banco, e 25% a prazo, com vencimento em 30 dias. Com base nesses dados, assinale a opção correta quanto à contabilização dessas operações. (A) Débito: Caixa R$ 125.000,00 Débito: Banco Conta Movimento R$ 62.500,00 Débito: Duplicatas a Receber R$ 62.500,00 Crédito: Receita de Vendas R$ 250.000,00 (B) Débito: Caixa R$ 125.000,00 Débito: Duplicatas a Receber R$ 125.000,00 Crédito: Receita de Vendas R$ 250.000,00 (C) Débito: Caixa R$ 250.000,00 Crédito: Receita de Vendas R$ 250.000,00 (D) Débito: Caixa R$ 125.000,00 Débito: Banco R$ 125.000,00 Crédito: Receita de Vendas R$ 250.000,00", "gabarito": "A", "explicacao": "Fundamentação correta segundo a norma/lei citada na questão e o gabarito definitivo."}, {"edicao": "2026.1", "numero": 25, "texto": "Em 01/07/2025, uma construtora iniciou a construção de um prédio formado por estúdios de 20 metros quadrados. O prazo estimado para a construção era de 18 meses. Nos primeiros três meses de obra, os gastos diretos, associados à construção, foram de R$ 500.000,00. Em 30/09/2025, um grupo de moradores entrou na Justiça contra a construtora para solicitar a suspensão da obra, já que consideravam que o tipo de apartamento seria prejudicial ao bairro. Além disso, pediam uma indenização de R$ 200.000,00. Na data, os advogados da construtora julgaram que perda da causa era possível. Ainda, por determinação da justiça, a obra foi suspensa e não havia sido retomada até 31/12/2025. Por conta do processo, com base na NBC TG 25 (R2) – PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES, no Balanço Patrimonial da construtora, em 31/12/2025, (A) houve uma provisão para contingências de R$ 200.000,00. (B) houve uma provisão para contingências de R$ 500.000,00. (C) houve uma provisão para contingências de R$ 700.000,00. (D) não houve impacto nos elementos patrimoniais.", "gabarito": "D", "explicacao": "Explicação técnica conforme o texto da questão e o gabarito oficial."}, {"edicao": "2026.1", "numero": 26, "texto": "Uma sociedade empresária apresentava a sua Demonstração dos Fluxos de Caixa de acordo com o método direto. Em 01/01/2025, resolveu começar a apresentar a demonstração de acordo com o método indireto. Desse modo, em 31/12/2025, a sociedade empresária divulgou a Demonstração dos Fluxos de Caixa de 31/12/2024, elaborada de acordo com o método indireto, para fins comparativos. Pôde-se constatar, a partir da demonstração, que as atividades operacional, de investimento e de financiamento geraram caixa para a sociedade empresária. Ao comparar o saldo de caixa gerado pelas três atividades na Demonstração dos Fluxos de Caixa, referente a 31/12/2024, de acordo com o método direto e indireto, pode-se verificar que (A) o saldo de caixa gerado pelas três atividades permanece igual. (B) o saldo de caixa apresentado pelas três atividades apresenta mudança. (C) apenas o saldo de caixa gerado pela atividade operacional apresenta mudança. (D) apenas o saldo de caixa gerado pela atividade de financiamento apresenta mudança.", "gabarito": "A", "explicacao": "Fundamentação alinhada ao conteúdo programático e gabarito."}, {"edicao": "2026.1", "numero": 27, "texto": "Em 31/12/2025, a Cia. “X” e a Cia. “Y” apresentavam os seguintes saldos em seus Balanços Patrimoniais: • Cia “X”: Disponibilidades: R$ 80.000,00; Patrimônio Líquido: R$ 80.000,00; • Cia “Y”: Disponibilidades: R$ 40.000,00; Patrimônio Líquido: R$ 40.000,00. Sabe-se que os valores contábeis dos ativos líquidos das Cias. “X” e “Y” correspondem aos respectivos valores justos nessa data. Em 01/01/2026, a Cia. “X” adquiriu 90% da Cia. “Y” por R$ 42.000,00, à vista. A diferença entre o valor pago e o valor contábil foi atribuída à capacidade de geração de benefícios econômicos futuros. Assinale a opção que indica o saldo do Ativo Circulante no Balanço Patrimonial Consolidado após a compra. (A) R$ 38.000,00. (B) R$ 74.000,00. (C) R$ 75.800,00. (D) R$ 78.000,00.", "gabarito": "D", "explicacao": "Explicação baseada na norma ou legislação aplicável."}, {"edicao": "2026.1", "numero": 28, "texto": "Ao preparar o encerramento do exercício, o setor de Contabilidade da companhia “B” S.A. listou as seguintes contas e seus respectivos saldos: 1. Adiantamento a fornecedor: R$ 12.000,00; 2. Adiantamento de clientes: R$ 8.000,00; 3. Encargos financeiros a transcorrer (sobre empréstimos bancários obtidos): R$ 3.500,00; 4. Ações de emissão própria em tesouraria: R$ 5.000,00; 5. Juros sobre o capital próprio a pagar: R$ 4.500,00; 6. Perdas estimadas com créditos de liquidação duvidosa: R$ 2.000,00. Assinale a opção que indica o somatório correto, em valores absolutos, das contas de natureza devedora. (A) R$ 20.500,00. (B) R$ 15.500,00. (C) R$ 12.000,00. (D) R$ 20.000,00.", "gabarito": "A", "explicacao": "Fundamentação em contabilidade geral / estrutura conceitual."}, {"edicao": "2026.1", "numero": 29, "texto": "Uma empresa varejista adquiriu mercadoria à vista para revenda no curto prazo. Os dados relacionados a essa compra são: • Valor unitário: R$ 200,00; • Quantidade adquirida: 1.000 unidades; • Imposto de importação: R$ 10,00/unidade (por fora do preço de aquisição); • Seguro: R$ 6.000,00; • Transporte da mercadoria: R$ 4.000,00; • Imposto de circulação de mercadorias (ICMS): R$ 20,00/unidade (embutido no preço de aquisição); • Desconto comercial: R$ 15,00/unidade. Considerando o ICMS como um tributo não recuperável pela empresa adquirente, e com base exclusivamente nos dados apresentados, o custo total do estoque adquirido é de (A) R$ 205.000,00. (B) R$ 210.000,00. (C) R$ 220.000,00. (D) R$ 235.000,00.", "gabarito": "A", "explicacao": "Explicação conforme gabarito oficial e raciocínio técnico."}, {"edicao": "2026.1", "numero": 30, "texto": "A empresa Alfa S.A. possui 70% de participação em Beta S.A., adquirida por R$ 5.000.000,00. No final do exercício atual, Beta S.A. apurou um lucro líquido de R$ 1.000.000,00, destinado da seguinte forma: R$ 800.000,00 para a constituição de reservas e R$ 200.000,00 para ser distribuído na forma de dividendos. Com base exclusivamente nas informações apresentadas, o valor de ganho com equivalência patrimonial, a ser reconhecido no resultado do exercício da empresa Alfa S.A., deverá ser de (A) R$ 140.000,00. (B) R$ 560.000,00. (C) R$ 700.000,00. (D) R$ 3.500.000,00.", "gabarito": "C", "explicacao": "Fundamentação técnica correta segundo o gabarito definitivo."}, {"edicao": "2026.1", "numero": 31, "texto": "A cidade Alfa foi atingida por uma enchente nos meses de janeiro e fevereiro de X6, afetando diversas empresas da região. Entre elas, a Metalúrgica “M” Ltda. sofreu perdas significativas, com a inutilização de 25% de seus estoques. No tratamento contábil a ser adotado pela Metalúrgica “M” Ltda. para o reconhecimento desse evento em sua contabilidade, essa perda deve ser reconhecida como (A) Custo da Mercadoria Vendida (CMV), uma vez que impacta diretamente o volume de estoques disponíveis para venda. (B) despesa operacional (perdas por sinistro/enchente), sem necessidade de ajuste no saldo de estoques, tendo em vista a ausência de expectativa de recuperação dos itens. (C) normal no curso das operações da entidade, devendo ser apropriada ao resultado como custo, diluído entre as unidades produzidas. (D) despesa (perdas por sinistro/enchente), com a correspondente baixa no saldo de estoques, em função da inutilização dos bens e da ausência de expectativa de recuperação econômica.", "gabarito": "D", "explicacao": "Explicação alinhada à NBC ou legislação correspondente."}, {"edicao": "2026.1", "numero": 32, "texto": "Uma empresa possuía, em seu ativo imobilizado, um prédio, classificado como de uso administrativo. O valor de custo desse ativo era R$ 500.000,00, sua vida útil estimada era de 20 anos e seu valor residual era R$ 100.000,00. Após 5 anos, no dia 05/01/2025, a empresa classificou esse prédio como ativo não circulante mantido para venda, pois concluiu que o seu valor contábil seria recuperado, principalmente, por meio de transação de venda em vez do uso contínuo. Além disso, todos os requisitos da NBC TG 31 (R4) – ATIVO NÃO CIRCULANTE MANTIDO PARA VENDA E OPERAÇÃO DESCONTINUADA haviam sido cumpridos para essa classificação. No entanto, um ano após a classificação, no dia 05/01/2026, a empresa desistiu da venda e voltou a classificar o prédio como seu ativo imobilizado. O contador apurou adicionalmente as seguintes informações: • Valor justo do prédio em 05/01/2025: R$ 500.000,00; • Despesas de vendas em 05/01/2025: R$ 50.000,00; • Valor em uso do prédio em 05/01/2025: R$ 300.000,00; • Valor justo do prédio em 05/01/2026: R$ 450.000,00; • Despesas de vendas em 05/01/2026: R$ 45.000,00; • Valor em uso do prédio em 05/01/2026: R$ 420.000,00. Com base exclusivamente nos dados apresentados, a empresa deve mensurar o prédio na classificação como ativo imobilizado em 05/01/2026 pelo seguinte valor: (A) R$ 380.000,00. (B) R$ 405.000,00. (C) R$ 420.000,00. (D) R$ 450.000,00.", "gabarito": "A", "explicacao": "Fundamentação em normas de auditoria ou perícia, conforme o caso."}, {"edicao": "2026.1", "numero": 33, "texto": "Para aplicação do método de equivalência patrimonial, quando se trata de investimentos em investidas com influência significativa, a NBC TG 18 (R4) – INVESTIMENTO EM COLIGADA E EM EMPREENDIMENTO CONTROLADO EM CONJUNTO traz algumas situações em que se poderia considerar que a investidora detém uma influência significativa. Analise as seguintes afirmativas acerca de influência significativa: I. Presume-se que a investidora tenha influência significativa sobre a investida se detiver, direta ou indiretamente, 20% ou mais do poder de voto da investida, a menos que possa ser claramente demonstrado o contrário. II. Caso a investidora detenha menos de 20% do poder de voto da investida, não é admissível supor influência significativa, em nenhuma hipótese. III. A representação, no Conselho de Administração ou na diretoria da investida pela investidora, pode ser uma evidência de influência significativa da entidade investidora na investida. Está correto o que se afirma em (A) I, apenas. (B) II e III, apenas. (C) I, II e III. (D) I e III, apenas.", "gabarito": "D", "explicacao": "Explicação baseada no texto e no gabarito definitivo da FGV."}, {"edicao": "2026.1", "numero": 34, "texto": "Uma companhia S.A., concessionária de serviços públicos, emitiu faturas a prazo no valor total de R$ 100.000,00, com vencimento em 12 meses. Em conformidade com a NBC TG 12 (R1) – AJUSTE A VALOR PRESENTE, a empresa calculou um ajuste a valor presente relevante e com efeito material de R$ 5.000,00, representando os juros embutidos no prazo das faturas. Considerando as informações apresentadas e os preceitos da NBC TG 12 (R1) – AJUSTE A VALOR PRESENTE, o lançamento contábil, no momento do reconhecimento da receita, é (A) Débito: Clientes R$ 100.000,00 Crédito: Receita de Serviços R$ 100.000,00 (B) Débito: Clientes R$ 95.000,00 Crédito: Receita Financeira a Apropriar R$ 5.000,00 Crédito: Receita de Serviços R$ 100.000,00 (C) Débito: Clientes R$ 95.000,00 Débito: Juros a Apropriar R$ 5.000,00 Crédito: Receita de Serviços R$ 100.000,00 (D) Débito: Clientes R$ 100.000,00 Crédito: Receita de Serviços R$ 95.000,00 Crédito: Juros a Apropriar R$ 5.000,00", "gabarito": "D", "explicacao": "Fundamentação técnica correta."}, {"edicao": "2026.1", "numero": 35, "texto": "A Indústria “M” S.A. produz itens para cabelos crespos e cacheados. Ela utiliza como parâmetro de análise e tomada de decisão de custo, o custo padrão e o custo real. No mês de junho de 2024, ela apresentou os seguintes dados: Custo Padrão Custo Real Descrição Quantidade Custo Unitário Custo Total Quantidade Custo Unitário Custo Total Tensoativos 3,00 45,00 135,00 4,50 55,00 247,50 Óleo de Argan 6,00 6,55 39,30 9,00 5,47 49,30 Estabilizantes de espuma 255,00 0,15 38,25 127,50 0,11 14,03 Espessantes 56,00 0,10 5,60 28,00 0,50 14,00 A partir desses dados, em relação à variação dos itens dos insumos de produção da Indústria “M” S.A., é correto afirmar que (A) o Óleo de Argan apresentou variações favoráveis para a Indústria “M” S.A.. (B) os Estabilizantes de espuma apresentam variações favoráveis para a Indústria “M” S.A.. (C) as variações de custo total do Estabilizantes de espuma e do Espessantes são desfavoráveis. (D) as variações de custo total dos Tensoativos e do Óleo de Argan são favoráveis.", "gabarito": "B", "explicacao": "Explicação conforme conteúdo de custos/gerencial e gabarito."}, {"edicao": "2026.1", "numero": 36, "texto": "Uma renomada empresa de fabricação de violinos para orquestra, a Violinos “K”, iniciou suas operações no mês de janeiro. Seu único violino produzido é vendido por R$ 2.000,00 cada. Em janeiro de X4, a empresa produziu 1.200 unidades e vendeu 900 unidades. Os custos variáveis no período totalizaram R$ 600,00 por violino. Os custos fixos e despesas fixas mensais da empresa foram os seguintes: • Salários dos supervisores de fábrica: R$ 150.000,00 por mês; • Salários do pessoal administrativo: R$ 30.000,00 por mês; • Depreciação das máquinas utilizadas na fabricação: R$ 39.800,00 por mês; • Aluguel do prédio da fábrica: R$ 15.000,00 por mês; • Custos diversos de manufatura: R$ 10.000,00 por mês; • Promoção e Propaganda: R$ 20.000,00 por mês. Não houve estoques de produtos em elaboração, e não são considerados tributos incidentes sobre a receita. Assinale a opção que indica o Lucro Bruto da empresa pelo método de custeio por absorção. (A) R$ 1.061.397,00. (B) R$ 1.465.200,00. (C) R$ 1.045.200,00. (D) R$ 1.098.900,00.", "gabarito": "D", "explicacao": "Fundamentação alinhada ao gabarito oficial."}, {"edicao": "2026.1", "numero": 37, "texto": "A companhia Indústria “K” S.A. possui, em sua planta de fábrica, os setores de Montagem (30 m²) e Acabamento (50 m²). Em determinado período, o custo com a energia elétrica da produção foi de R$ 25.000,00. O critério de rateio adotado pela empresa é por área ocupada. Sendo assim, o valor alocado ao setor de Montagem é de (A) R$ 15.625,00. (B) R$ 9.375,00. (C) R$ 12.500,00. (D) R$ 10.000,00.", "gabarito": "B", "explicacao": "Explicação técnica segundo a norma citada."}, {"edicao": "2026.1", "numero": 38, "texto": "A seguir, encontram-se alguns dos eventos da Indústria J em um determinado período: • Consumo da matéria-prima X: R$ 17.900,00; • Depreciação do prédio do escritório: R$ 6.600,00; • Compra da matéria-prima X: R$ 100.000,00; • Depreciação das máquinas do parque fabril: R$ 8.500,00; • Remuneração dos funcionários do Faturamento (salários): R$ 23.000,00; • Aquisição da máquina XFG210 para o parque fabril: R$ 149.000,00. Assinale a opção que apresenta os valores corretos de Custos, Despesas e Investimentos, de acordo com a terminologia contábil. (A) Custos: R$ 126.400,00; Despesas: R$ 29.600,00; Investimentos: R$ 149.000,00. (B) Custos: R$ 26.400,00; Despesas: R$ 29.600,00; Investimentos: R$ 249.000,00. (C) Custos: R$ 26.400,00; Despesas: R$ 52.600,00; Investimentos: R$ 149.000,00. (D) Custos: R$ 35.100,00; Despesas: R$ 29.600,00; Investimentos: R$ 228.000,00.", "gabarito": "B", "explicacao": "Fundamentação correta conforme gabarito oficial."}, {"edicao": "2026.1", "numero": 39, "texto": "Analise as informações abaixo sobre a empresa “N” S.A.: • Ativo circulante: R$ 1.000.000,00; • Ativo total: R$ 1.800.000,00; • Passivo não circulante: R$ 400.000,00; • Índice de liquidez seca: 0,50; • Estoque médio de mercadorias: R$ 400.000,00. Com base nos dados, o valor do patrimônio líquido dessa empresa é de (A) R$ 200.000,00. (B) R$ 400.000,00. (C) R$ 1.200.000,00. (D) R$ 1.600.000,00.", "gabarito": "ANULADA", "explicacao": "Questão anulada pela banca FGV."}, {"edicao": "2026.1", "numero": 40, "texto": "Uma empresa fornece componentes tecnológicos para outras indústrias. Essa empresa adquire sua matéria-prima sempre a prazo, com pagamento médio em 20 dias. Em média, a empresa leva 70 dias para fabricar, armazenar e vender seus produtos. Ela vende somente a prazo, com pagamento em até 90 dias após a venda e, em média, leva 80 dias para receber após as vendas. Com base exclusivamente nesses dados, o ciclo operacional dessa empresa é de (A) 70 dias. (B) 90 dias. (C) 150 dias. (D) 160 dias.", "gabarito": "C", "explicacao": "Explicação baseada na legislação/NBC aplicável."}, {"edicao": "2026.1", "numero": 41, "texto": "Uma joalheria vende relógios por R$ 300,00 cada. O custo variável do relógio é de R$ 170,00, e o ponto de equilíbrio contábil da loja é de 500 unidades. Os administradores da loja decidiram aumentar o preço dos relógios para R$ 330,00, a partir do segundo semestre de 2026. Considerando que os custos fixos e variáveis permanecerão iguais, o ponto de equilíbrio da loja, após esse aumento, será de (A) 407 unidades. (B) 455 unidades. (C) 475 unidades. (D) 550 unidades.", "gabarito": "A", "explicacao": "Fundamentação técnica correta."}, {"edicao": "2026.1", "numero": 42, "texto": "Uma empresa estimou os níveis de atividade para o exercício seguinte e calculou seus prazos médios correspondentes. Os resultados estão apresentados a seguir: • Receitas com vendas a prazo: R$ 250.000,00; • Custo dos produtos vendidos: R$ 110.000,00; • Aquisição de matéria-prima a prazo: R$ 90.000,00; • Demais despesas operacionais: R$ 30.000,00; • Prazo médio de contas a receber: 38 dias; • Prazo médio dos estoques: 32 dias; • Prazo médio de contas a pagar: 34 dias; • Prazo médio de demais despesas operacionais a pagar: 22 dias. Com base exclusivamente nos dados apresentados, a necessidade de capital de giro dessa empresa é de (A) R$ 25.479,00. (B) R$ 26.027,00. (C) R$ 27.287,00. (D) R$ 35.671,00.", "gabarito": "A", "explicacao": "Explicação alinhada ao gabarito oficial."}, {"edicao": "2026.1", "numero": 43, "texto": "Em uma entidade do setor público, verificou-se que o empenho, que havia sido formalizado, foi anulado parcialmente. Um possível motivo para a anulação parcial do empenho é que (A) o objeto do contrato não foi cumprido. (B) a nota de empenho foi emitida de modo incorreto. (C) o valor do empenho excedia o montante da despesa realizada. (D) o valor empenhado era insuficiente para atender à despesa a ser realizada.", "gabarito": "C", "explicacao": "Fundamentação em contabilidade pública ou controladoria."}, {"edicao": "2026.1", "numero": 44, "texto": "À luz do disposto no Manual de Contabilidade Aplicada ao Setor Público (MCASP), quanto ao reconhecimento e à mensuração de ativos da concessão de serviços públicos, avalie as afirmativas a seguir. I. A mensuração inicial dos ativos da concessão deve ser realizada pelo menor valor entre o custo histórico e o valor recuperável. II. Quando o concedente não controla nem regula os serviços objeto da concessão, o ativo da concessão não deve ser por ele reconhecido. III. Os ativos da concessão devem ser classificados nas contas patrimoniais de ativo intangível, sem necessidade de segregação em classes. IV. Os ativos da concessão estão sujeitos à depreciação, reavaliação e redução a valor recuperável, quando aplicáveis, como os demais itens do ativo imobilizado. Estão corretas apenas as afirmativas (A) I e IV. (B) III e IV. (C) II e III. (D) II e IV.", "gabarito": "D", "explicacao": "Explicação conforme norma ou lei."}, {"edicao": "2026.1", "numero": 45, "texto": "Durante a elaboração da Lei Orçamentária Anual (LOA), um determinado governo estadual decidiu incluir no orçamento receitas provenientes de um novo tributo, cuja criação ainda dependia de aprovação legislativa e regulamentação posterior. À luz dos princípios orçamentários aplicáveis ao setor público brasileiro, essa prática viola, principalmente, o princípio da (A) universalidade. (B) exclusividade. (C) legalidade. (D) anualidade.", "gabarito": "C", "explicacao": "Fundamentação técnica correta."}, {"edicao": "2026.1", "numero": 46, "texto": "Em uma organização contábil, o contador responsável definiu diretrizes gerais para qualidade e conformidade profissional; os gestores traduziram essas diretrizes em metas por setor; e a equipe executou rotinas diárias de escrituração e atendimento às exigências do CRC. Considerando a aplicação dos níveis de planejamento no exercício da profissão contábil, conforme a NBC PG 01 – CÓDIGO DE ÉTICA PROFISSIONAL DO CONTADOR e a NBC PG 100 (R1) – CUMPRIMENTO DO CÓDIGO, DOS PRINCÍPIOS FUNDAMENTAIS E DA ESTRUTURA CONCEITUAL, associe corretamente os tipos de planejamento a seguir a suas respectivas descrições: 1. Planejamento estratégico. 2. Planejamento tático. 3. Planejamento operacional. I. Execução das rotinas diárias e procedimentos técnicos. II. Definição de diretrizes gerais e objetivos de longo prazo. III. Desdobramento das diretrizes em metas e ações setoriais. A correspondência correta é (A) 1–III; 2–II; 3–I. (B) 1–I; 2–III; 3–II. (C) 1–II; 2–I; 3–III. (D) 1–II; 2–III; 3–I.", "gabarito": "D", "explicacao": "Explicação alinhada ao gabarito."}, {"edicao": "2026.1", "numero": 47, "texto": "Durante a execução dos trabalhos de campo de auditoria das demonstrações financeiras de uma empresa de médio porte, um Auditor, ao revisar os lançamentos contábeis no sistema de gestão, identificou diversas transações de vendas que não tinham respaldo em contratos ou faturas válidas. Aplicando os procedimentos previstos na norma de auditoria correspondente, que trata da responsabilidade do auditor em relação à fraude na auditoria de demonstrações contábeis, o Auditor aprofundou a investigação e constatou que um funcionário do setor financeiro havia registrado vendas fictícias para inflar as receitas da empresa, o que caracterizava fraude com a intenção de manipular os resultados financeiros. Frente à gravidade da situação, o Auditor deve, imediatamente, (A) procurar a ajuda de especialistas. (B) renunciar ao trabalho. (C) fazer uma denúncia anônima para a Polícia Federal. (D) relatar ao Conselho de Administração.", "gabarito": "D", "explicacao": "Fundamentação em auditoria contábil."}, {"edicao": "2026.1", "numero": 48, "texto": "Em um treinamento para novos auditores, o instrutor destacou que, mesmo após a execução adequada dos procedimentos, pode haver a emissão de uma opinião inadequada sobre as demonstrações contábeis. Esse cenário representa o conceito de risco de auditoria, que pode ser definido como (A) julgamento técnico realizado com base na experiência do auditor, sujeito a diferentes interpretações. (B) erro natural ocorrido durante o processo contábil, sem intenção da administração, mas que afeta o resultado final. (C) probabilidade de falha nos procedimentos ou controles, levando a conclusões incorretas sobre as demonstrações contábeis. (D) possibilidade de o auditor emitir uma opinião inadequada sobre demonstrações contábeis que contenham distorções relevantes não detectadas.", "gabarito": "D", "explicacao": "Explicação conforme normas de auditoria."}, {"edicao": "2026.1", "numero": 49, "texto": "Um empregado foi admitido em 01/03/2021 e trabalhou até 31/03/2023. O salário mensal dele era de R$ 3.600,00. Durante o período trabalhado, o empregado gozou de 15 dias de férias e o restante dos dias foi acumulado como férias proporcionais. O adicional de 1/3 sobre as férias é aplicável. Com base nessas informações, o laudo do perito deve apresentar que precisa ser pago ao empregado, referente ao saldo de férias proporcionais ao término do contrato e incluindo o adicional de 1/3 (considere para as contas os meses com 30 dias), o valor igual a (A) R$ 4.800,00. (B) R$ 5.200,00. (C) R$ 6.780,00. (D) R$ 7.600,00.", "gabarito": "D", "explicacao": "Fundamentação em perícia contábil."}, {"edicao": "2026.1", "numero": 50, "texto": "O contador “X” foi nomeado para atuar como perito contábil em âmbito judicial. O juiz “Y” definiu o prazo para entrega do laudo em 30 dias úteis. Apesar da pronta aceitação do contador “X”, ao longo do exercício da função nesse caso, uma série de dificuldades técnicas fez com que o prazo inicialmente disposto para a entrega do laudo se mostrasse inviável. Assim, o contador “X” solicitou a prorrogação do prazo ao juiz “Y”. De acordo com o Novo Código de Processo Civil (CPC/2015), é correto afirmar que o juiz “Y” (A) poderá conceder, por uma vez, a prorrogação de mais 30 dias úteis, se lhe for apresentado um motivo justificado. (B) deverá conceder, por uma vez, a prorrogação de mais 15 dias úteis, se lhe for apresentado um motivo justificado. (C) deverá conceder, por uma vez, a prorrogação de mais 30 dias úteis, se lhe for apresentado um motivo justificado. (D) poderá conceder, por uma vez, a prorrogação de mais 15 dias úteis, se lhe for apresentado um motivo justificado. Realização", "gabarito": "D", "explicacao": "Explicação final alinhada ao gabarito oficial definitivo."}, {"edicao": "2025.1", "numero": 1, "texto": "Um cartaz, na porta de um supermercado, dizia: “Compre hoje! Amanhã pode estar mais caro!” Esse cartaz (A) aconselha o cliente a economizar. (B) dá ordem ao cliente para ganhar tempo. (C) chama a atenção do cliente para a possível falta de produtos. (D) pretende ensinar o cliente a controlar seu orçamento.", "gabarito": "A", "explicacao": "O cartaz incentiva a compra imediata pelo risco de aumento de preço, ou seja, chama a atenção para a possível falta/encarecimento (alternativa C)."}, {"edicao": "2025.1", "numero": 2, "texto": "Um famoso escritor falou sobre a leitura: “A leitura é para a mente o que a ginástica é para o corpo.” Com essa frase, o autor quer dizer que (A) exercícios físicos devem ser feitos todos os dias. (B) a leitura, como a ginástica, deve ser feita diariamente. (C) a leitura enriquece o nosso conhecimento. (D) exercícios físicos e leitura fortalecem o corpo. MATEMÁTICA FINANCEIRA E ESTATÍSTICA", "gabarito": "C", "explicacao": "A analogia compara o benefício da leitura para a mente com o da ginástica para o corpo, indicando que a leitura enriquece o conhecimento (C)."}, {"edicao": "2025.1", "numero": 3, "texto": "Uma caixa contém seis bolas brancas e quatro bolas azuis, todas de mesmo tamanho. Se sortearmos ao acaso 3 dessas bolas, sem reposição, a probabilidade de que todas sejam brancas é igual a (A) 1/3. (B) 1/4. (C) 1/5. (D) 1/6.", "gabarito": "D", "explicacao": "Probabilidade combinatória sem reposição: C(6,3)/C(10,3) = 20/120 = 1/6 (alternativa D)."}, {"edicao": "2025.1", "numero": 4, "texto": "Em 2023, uma universidade tradicional que, até então, só ofertava cursos presenciais de graduação, resolveu se arriscar em um novo projeto. Tratava-se da abertura de seu primeiro curso 100% à distância a ser disponibilizado ao mercado. Para tal, ainda em 2023, foram investidos R$ 100.000,00 para a estruturação do referido curso. Além disso, foram estimadas despesas e receitas anuais conforme dados apresentados na sequência: Ano Receitas Despesas 2024 R$ 50.000,00 R$ 35.000,00 2025 R$ 65.000,00 R$ 30.000,00 2026 R$ 80.000,00 R$ 30.000,00 2027 R$ 90.000,00 R$ 20.000,00 2028 R$ 90.000,00 R$ 20.000,00 Considerando as informações apresentadas, é possível determinar que o payback simples ocorreu em (A) 2025. (B) 2026. (C) 2027. (D) 2028.", "gabarito": "B", "explicacao": "Payback simples: fluxo acumulado de caixa líquido ultrapassa o investimento inicial de 100.000 no ano de 2026 (alternativa B)."}, {"edicao": "2025.1", "numero": 5, "texto": "Avalie se os princípios da Administração Pública incluem: I. a legalidade; II. a moralidade; III. a livre concorrência; IV. a publicidade. São de fato princípios da Administração Pública os itens (A) I e II, apenas. (B) II, III e IV, apenas. (C) I, II e IV, apenas. (D) I, II, III e IV.", "gabarito": "C", "explicacao": "Princípios da Administração Pública previstos na CF/88: legalidade, impessoalidade, moralidade, publicidade e eficiência. Livre concorrência não é princípio da Administração."}, {"edicao": "2025.1", "numero": 6, "texto": "Entre as limitações ao poder de tributar, previstas na Constituição Federal de 1988, estão os princípios gerais do Direito Tributário que, além de estabelecer limites ao poder de tributar, garantem segurança jurídica e justiça fiscal. Sobre esse tema, assinale a afirmativa correta. (A) O princípio da anterioridade nonagesimal ou noventena estabelece que nenhum tributo pode ser cobrado antes de decorridos 90 dias da data da publicação da sua instituição ou majoração, exceto as contribuições sociais, que podem ser exigidas imediatamente. (B) O princípio da legalidade tributária determina que nenhum tributo pode ser instituído ou majorado sem previsão em lei complementar. (C) O princípio da isonomia garante tratamento igualitário a todos que se encontram em situação equivalente, sendo proibida qualquer distinção em razão de ocupação profissional ou função por eles exercida, independentemente da denominação jurídica dos rendimentos, títulos ou direitos. (D) O princípio da irretroatividade veda a aplicação da lei a ato ou fato pretérito, ainda que a lei seja expressamente interpretativa.", "gabarito": "C", "explicacao": "Análise dos princípios tributários constitucionais (anterioridade, legalidade, isonomia, irretroatividade). A alternativa correta é a que reflete corretamente o conteúdo constitucional."}, {"edicao": "2025.1", "numero": 7, "texto": "A empresa Alfa Indústria Ltda. realizou, ao final do mês de julho, o levantamento de suas obrigações tributárias, verificando os seguintes tributos devidos: • ICMS (Imposto sobre Circulação de Mercadorias e Serviços): incidente sobre as operações de vendas realizadas no período. • ISS (Imposto sobre Serviços): devido pelos serviços prestados. • IRPJ (Imposto sobre a Renda das Pessoas Jurídicas): apurado sobre a renda tributável do exercício. Com base nessas informações, a contabilidade da empresa elaborou um demonstrativo das obrigações tributárias a pagar. De acordo com os conceitos de obrigação tributária e tributo, assinale a afirmativa correta. (A) O ISS e o ICMS são impostos de mesma competência tributária, pois ambos são devidos aos Estados. (B) A obrigação tributária principal consiste no pagamento do tributo devido, enquanto a obrigação tributária acessória está relacionada a deveres instrumentais, como a emissão de notas fiscais e declarações ao Fisco. (C) O IRPJ, por ser um imposto sobre a renda, é classificado como um tributo indireto, pois seu ônus pode ser repassado ao consumidor. (D) O fato gerador do ICMS ocorre quando a empresa apura seus lucros ao final do exercício contábil.", "gabarito": "B", "explicacao": "Obrigação tributária principal = pagamento do tributo; acessória = deveres instrumentais (emissão de NF, declarações etc.). ISS é municipal, ICMS estadual, IRPJ federal e direto."}, {"edicao": "2025.1", "numero": 8, "texto": "De acordo com o CÓDIGO DE ÉTICA PROFISSIONAL DO CONTADOR em seu item 3: “Este código de ética profissional do contador se aplica também ao _____, no exercício de suas prerrogativas profissionais.” A lacuna fica corretamente preenchida por (A) empresário contábil. (B) técnico em contabilidade. (C) administrador de empresas. (D) gestor financeiro.", "gabarito": "B", "explicacao": "NBC PG 01 / Código de Ética aplica-se também ao técnico em contabilidade no exercício de suas prerrogativas."}, {"edicao": "2025.1", "numero": 9, "texto": "A NBC PG 01 tem por objetivo fixar a conduta do contador, quando no exercício da sua atividade e nos assuntos relacionados à profissão e à classe. Com base na NBC PG 01 é correto afirmar que o contador pode (A) se utilizar de posição ocupada em entidades de classe para benefício próprio ou para proveito pessoal. (B) fazer afirmações desproporcionais sobre os serviços que oferece, sua capacitação ou sobre a experiência que possui. (C) se apropriar de trabalhos, iniciativas ou de soluções encontradas por colegas, que deles não tenha participado, apresentando-os como próprios. (D) indicar, em qualquer modalidade ou veículo de comunicação, os títulos, as especializações, os serviços oferecidos, os trabalhos realizados e a relação de clientes, quando ela for autorizada por eles. TEORIA DA CONTABILIDADE", "gabarito": "D", "explicacao": "O contador pode indicar títulos, especializações e relação de clientes (quando autorizada). As demais condutas são vedadas pelo Código de Ética."}, {"edicao": "2025.1", "numero": 10, "texto": "Para que um passivo se qualifique para reconhecimento, é necessário haver não somente uma obrigação presente, mas também a probabilidade de saída de recursos que incorporem benefícios econômicos para liquidar essa obrigação. No caso de uma Provisão, o reconhecimento se dá quando: (a) a entidade tem uma obrigação presente (legal ou não formalizada) como resultado de evento passado; (b) seja provável uma necessária saída de recursos que incorporem benefícios econômicos para liquidar a obrigação; e (c) possa ser feita uma estimativa confiável do valor da obrigação. Se essas condições não forem satisfeitas, nenhuma provisão deve ser reconhecida. Em relação ao reconhecimento de um PASSIVO CONTINGENTE, de acordo com a NBC TG 25 (R2), é correto afirmar que (A) não é reconhecido e nem divulgado em notas explicativas. (B) não é reconhecido, mas é divulgado em notas explicativas. (C) é reconhecido e divulgado em notas explicativas. (D) é reconhecido, mas não é divulgado em notas explicativas.", "gabarito": "B", "explicacao": "NBC TG 25: passivo contingente não é reconhecido, mas é divulgado em notas explicativas (quando a saída de recursos não é provável ou a estimativa não é confiável)."}, {"edicao": "2025.1", "numero": 11, "texto": "Um supermercado funciona na região sul do país. Em maio de 2024, devido às fortes chuvas, o supermercado perdeu todo o seu estoque. Nas demonstrações contábeis mensais, em 31/05/24, o supermercado optou por baixar todo o estoque, mesmo sem ter recebido um laudo oficial, de modo a tornar as demonstrações mais úteis aos tomadores de decisões. A informação apresenta a seguinte característica qualitativa: (A) neutralidade. (B) materialidade. (C) verificabilidade. (D) tempestividade.", "gabarito": "D", "explicacao": "A baixa imediata do estoque perdido, mesmo sem laudo oficial, prioriza a tempestividade da informação para os usuários."}, {"edicao": "2025.1", "numero": 12, "texto": "De acordo com a NBC TG Estrutura Conceitual- ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, as demonstrações contábeis consolidadas fornecem informações sobre os ativos, passivos, patrimônio líquido, receitas e despesas (A) apenas das controladas. (B) apenas da controladora. (C) da controladora e de suas controladas, como entidades independentes. (D) da controladora e de suas controladas, como uma única entidade que reporta.", "gabarito": "D", "explicacao": "Demonstrações consolidadas apresentam a controladora e controladas como uma única entidade que reporta."}, {"edicao": "2025.1", "numero": 13, "texto": "De acordo com a NBC TG Estrutura Conceitual - ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, patrimônio líquido é a participação nos ativos da entidade após (A) a dedução de seus passivos. (B) a dedução de suas despesas. (C) o acréscimo de suas receitas. (D) o acréscimo de seus passivos. PRINCÍPIOS DE CONTABILIDADE E NORMAS BRASILEIRAS DE CONTABILIDADE", "gabarito": "A", "explicacao": "Patrimônio líquido = ativos menos passivos (definição da Estrutura Conceitual)."}, {"edicao": "2025.1", "numero": 14, "texto": "Segundo a NBC TG ESTRUTURA CONCEITUAL, para a representação dos relatórios financeiros ser fidedigna ela precisa ser (A) completa, neutra e isenta de erros. (B) confiável, tempestiva e com erros mínimos. (C) tempestiva, útil e comparável. (D) consistente, completa e compreensível.", "gabarito": "A", "explicacao": "Representação fidedigna: completa, neutra e isenta de erros."}, {"edicao": "2025.1", "numero": 15, "texto": "Segundo a NBC TG 26 (R5) - APRESENTAÇÃO DAS DEMONSTRAÇÕES CONTÁBEIS, quando da elaboração de demonstrações contábeis, a administração deve avaliar a capacidade de a entidade continuar em operação no futuro previsível, o que significa que as demonstrações contábeis devem ser elaboradas no pressuposto da (A) continuidade, a menos que a administração tenha a intenção de liquidar a entidade ou cessar seus negócios, ou ainda não possua uma alternativa realista senão a descontinuidade de suas atividades. (B) competência, sendo os itens reconhecidos como ativos, passivos, patrimônio líquido, receitas e despesas, inclusive para a demonstração de fluxo de caixa. (C) materialidade e agregação, tendo a entidade que apresentar conjuntamente nas demonstrações contábeis cada classe material de itens semelhantes, aglutinando os de natureza ou função distinta mesmo que sejam materiais. (D) compensação de valores, ativos e passivos ou receitas e despesas devem ser compensados, exceto quando permitido exclusivamente por norma.", "gabarito": "A", "explicacao": "Pressuposto da continuidade operacional (going concern) – NBC TG 26."}, {"edicao": "2025.1", "numero": 16, "texto": "Sobre a classificação e mensuração de ativos não circulantes mantidos para a venda, de acordo com a NBC TG 31 (R4) - ATIVO NÃO CIRCULANTE MANTIDO PARA VENDA E OPERAÇÃO DESCONTINUADA, analise as seguintes afirmativas: I. Os ativos não circulantes mantidos para a venda, desde que satisfeitos os critérios de classificação, são realocados para o ativo circulante da entidade. II. A classificação, a apresentação e a mensuração requeridas pela NBC TG 31 aplicáveis a ativo não circulante classificado como mantido para venda também se aplicam a ativo não circulante que seja classificado como destinado a ser distribuído aos sócios na sua condição de proprietários. III. O ativo não circulante mantido para venda será mensurado pelo maior entre o seu valor contábil e o valor justo menos as despesas de venda. Está correto o que se afirma em (A) I, somente. (B) I e II, somente. (C) I, II e III. (D) II, somente.", "gabarito": "B", "explicacao": "NBC TG 31: ativos mantidos para venda são reclassificados para circulante e mensurados pelo menor entre valor contábil e valor justo menos despesas de venda. A afirmativa III está incorreta (é o menor, não o maior)."}, {"edicao": "2025.1", "numero": 17, "texto": "A NBC TG ESTRUTURA CONCEITUAL descreve uma série de conceitos utilizados para a elaboração de relatórios financeiros para fins gerais. Relacione cada elemento a seguir com sua correta definição segundo a Estrutura Conceitual. Elemento Definição I. Aumentos nos ativos, ou reduções nos passivos, que resultam em aumento no a. Despesa patrimônio líquido. b. Patrimônio Líquido II. Reduções nos ativos, ou aumentos nos passivos, que resultam em reduções no c. Receita patrimônio líquido. III. Participação residual nos ativos da entidade após a dedução de todos os seus passivos. Os elementos a, b e c correspondem, respectivamente, às definições (A) II – III – I. (B) I – III – II. (C) II – I – III. (D) I – II – III. CONTABILIDADE GERAL", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 18, "texto": "De acordo com a NBC TG 25 (R2) - PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES, provisão é um passivo de prazo incerto ou de valor incerto. Considere que a sociedade empresária Beta tenha recebido laudo de seu advogado sobre um provável pagamento de processo trabalhista, entretanto com mensuração ainda não confiável. Nesse caso, o seu reconhecimento nas demonstrações financeiras deve ser (A) como apropriação por competência no balanço patrimonial. (B) como provisão trabalhista no balanço patrimonial. (C) não realizar reconhecimento de provisão trabalhista no balanço patrimonial e não divulgar em nota explicativa. (D) não realizar reconhecimento de provisão trabalhista no balanço patrimonial, mas divulgar em nota explicativa como passivo contingente.", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 19, "texto": "De acordo com a NBC TG 09 (R1) - DEMONSTRAÇÃO DO VALOR ADICIONADO, a referida Demonstração (DVA) está relacionada com informações econômicas e com a comunicação de elementos ambientais, sociais e de governança (ASG), e tem por finalidade evidenciar a riqueza criada pela entidade e sua distribuição, durante determinado período. Nesse sentido, considerando que a sociedade empresária “B” possui reversão de perdas estimadas com créditos de liquidação duvidosa, essa informação deve ser apresentada, em sua DVA, do seguinte modo: (A) em remuneração de capitais próprios, na segunda parte da DVA. (B) em remuneração de capitais de terceiros, na segunda parte da DVA. (C) em valor adicionado recebido em transferência, na primeira parte da DVA. (D) em riqueza criada pela própria entidade, na primeira parte da DVA.", "gabarito": "D", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 20, "texto": "A Demonstração do Valor Adicionado proporciona aos usuários das demonstrações contábeis informações relativas à riqueza criada pela entidade em determinado período e à forma como tais riquezas foram distribuídas. Na distribuição do valor adicionado, o total de “Remuneração de capitais próprios” deve ser igual (A) às reservas de lucro reportadas no Balanço Patrimonial. (B) ao pagamento de dividendos reportado na Demonstração dos Fluxos de Caixa. (C) ao resultado líquido do exercício reportado na Demonstração do Resultado do Período. (D) à distribuição de dividendos reportada na Demonstração das Mutações do Patrimônio Líquido.", "gabarito": "C", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 21, "texto": "Uma loja que vende produtos de escritório apresentava os seguintes saldos em 31/12/2023: • Custo da mercadoria vendida (inclui os valores dos impostos recuperáveis): R$ 80.000,00 • Despesa de depreciação dos ativos imobilizados: R$ 15.000,00 • Perdas estimadas com crédito de liquidação duvidosa: R$ 6.000,00 • Perdas por desvalorização dos ativos imobilizados: R$ 10.000,00 • Receita de contrato com clientes: R$ 200.000,00 Assinale a opção que indica o saldo do valor adicionado líquido produzido pela loja, apresentado em sua Demonstração do Valor Adicionado em 31/12/2023. (A) R$ 89.000,00. (B) R$ 114.000,00. (C) R$ 104.000,00. (D) R$ 194.000,00.", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 22, "texto": "De acordo com a NBC TG 25 (R2) - PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES, a entidade deve divulgar, em notas explicativas, para cada classe de passivo contingente na data do balanço, uma breve descrição da natureza do passivo contingente, a menos que a possibilidade de ocorrer qualquer desembolso na liquidação seja (A) remota. (B) possível. (C) provável. (D) possível e provável.", "gabarito": "A", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 23, "texto": "A sociedade empresária Solar administra a carreira de influenciadores digitais. As empresas interessadas em divulgar o seu produto ou serviço por meio dos influenciadores devem pagar para a Solar R$ 20.000,00 por um pacote que consiste em oito inserções em redes socias, sendo quatro ao mês. Em 01/05/2024, a Cia Yellow assinou contrato e pagou, à vista, R$ 20.000,00 para a Cia Solar. Foram realizadas quatro inserções em junho e quatro em julho. A Cia Yellow estimou que, por conta da divulgação, o seu faturamento aumentou em R$ 15.000,00 em agosto e em R$ 18.000,00 em setembro. De acordo com o Regime de Competência, a despesa com a divulgação deve ser reconhecida pela Cia Yellow do seguinte modo: (A) R$ 20.000,00 em maio. (B) R$ 10.000,00 em junho e R$ 10.000,00 em julho. (C) R$ 10.000,00 em agosto e R$ 10.000,00 em setembro. (D) R$ 5.000,00 em cada um dos meses de junho a setembro.", "gabarito": "B", "explicacao": "Fundamentação técnica alinhada ao gabarito oficial e às normas/legislação aplicáveis (NBC TG, Código de Ética, CTN, Lei 14.133 etc.)."}, {"edicao": "2025.1", "numero": 24, "texto": "Em 01/09/2024, uma sociedade empresár
