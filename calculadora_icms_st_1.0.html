<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora ICMS ST Pro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --ecac-blue: #003366;
      --ecac-blue-light: #e6f0f7;
      --ecac-gray: #f2f2f2;
      --ecac-border: #cccccc;
      --ecac-text: #333333;
      --primary: var(--ecac-blue);
      --danger: #cc0000;
      --success: #10b981;
      --bg: #f8f9fa;
      --card: #ffffff;
      --border: var(--ecac-border);
      --text: var(--ecac-text);
      --shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 5px;
      line-height: 1.1;
      -webkit-font-smoothing: antialiased;
    }

    .container { width: 100%; max-width: 1800px; margin: 0 auto; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px;
      box-shadow: var(--shadow);
      margin-bottom: 5px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
      border-bottom: 2px solid var(--ecac-blue);
      padding-bottom: 2px;
    }

    h1 { font-size: 1.1rem; color: var(--ecac-blue); font-weight: 800; }

    h2 {
      font-size: 0.75rem;
      margin: 8px 0 4px 0;
      color: var(--ecac-blue);
      font-weight: 800;
      text-transform: uppercase;
      border-bottom: 1px solid var(--ecac-border);
      padding-bottom: 1px;
    }

    .upload-section {
      background: var(--ecac-blue-light);
      border: 1px dashed var(--ecac-blue);
      border-radius: 4px;
      padding: 10px;
      text-align: center;
      margin: 5px 0;
      cursor: pointer;
    }

    .upload-section p { font-weight: 800; color: var(--ecac-blue); font-size: 0.8rem; }

    #fileInput { display: none; }

    .produtos-container { display: flex; flex-direction: column; gap: 3px; }

    .linha-produto {
      display: grid;
      grid-template-columns: 2fr 0.5fr 0.9fr 0.8fr 0.8fr 0.8fr 0.7fr 0.7fr 0.7fr 28px 28px;
      gap: 4px;
      align-items: flex-end;
      background: #fff;
      padding: 3px 6px;
      border-radius: 2px;
      border: 1px solid var(--border);
    }

    .campo { display: flex; flex-direction: column; gap: 1px; }

    label { font-size: 0.58rem; font-weight: 800; color: var(--ecac-blue); text-transform: uppercase; }

    input {
      height: 24px;
      border: 1px solid var(--ecac-border);
      border-radius: 2px;
      padding: 0 4px;
      font-size: 0.8rem;
      font-weight: 700;
      width: 100%;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      height: 28px;
      border-radius: 2px;
      font-weight: 800;
      font-size: 0.75rem;
      cursor: pointer;
      border: none;
      gap: 5px;
    }

    .btn-primary { background: var(--ecac-blue); color: white; }
    .btn-success { background: #28a745; color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-warning { background: #f39c12; color: white; }
    .btn-icon { width: 24px; height: 24px; padding: 0; font-size: 1rem; }

    .action-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 10px 0;
      padding: 8px;
      background: var(--ecac-gray);
      border-radius: 4px;
      border: 1px solid var(--ecac-border);
    }

    .grid-config {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
      margin-top: 5px;
      background: var(--ecac-gray);
      padding: 6px;
      border-radius: 2px;
      border: 1px solid var(--border);
    }

    .table-container { overflow-x: auto; margin-top: 10px; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
      border: 1px solid var(--ecac-border);
      table-layout: fixed;
    }

    th {
      background: var(--ecac-blue);
      padding: 4px 2px;
      text-align: center;
      font-weight: 800;
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      text-transform: uppercase;
      font-size: 0.62rem;
    }

    td {
      padding: 4px 2px;
      text-align: center;
      border: 1px solid var(--ecac-border);
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    th:nth-child(1), td:nth-child(1) { width: 16%; text-align: left; padding-left: 5px; }
    th:nth-child(2), td:nth-child(2) { width: 7%; }
    th:nth-child(3), td:nth-child(3) { width: 6%; }
    th:nth-child(4), td:nth-child(4) { width: 5%; }
    th:nth-child(5), td:nth-child(5) { width: 7%; }
    th:nth-child(6), td:nth-child(6) { width: 7%; }
    th:nth-child(7), td:nth-child(7) { width: 7%; }
    th:nth-child(8), td:nth-child(8) { width: 7%; }
    th:nth-child(9), td:nth-child(9) { width: 5%; }
    th:nth-child(10), td:nth-child(10) { width: 5%; }
    th:nth-child(11), td:nth-child(11) { width: 7%; }
    th:nth-child(12), td:nth-child(12) { width: 7%; }
    th:nth-child(13), td:nth-child(13) { width: 7%; }
    th:nth-child(14), td:nth-child(14) { width: 7%; }

    tfoot tr { background: #dcfce7 !important; }
    tfoot td { padding: 4px 2px; font-weight: 900; color: #065f46 !important; font-size: 0.75rem; }
    tfoot td:first-child { background: #10b981; color: #ffffff !important; text-align: center; }

    .editavel { cursor: pointer; background: #f0f7ff; }
    .editavel:hover { background: #d6eaf8; }

    .explicacao { margin-top: 10px; padding: 10px; background: #fff; border: 1px solid var(--ecac-border); border-radius: 4px; }
    .item-explicacao { margin-bottom: 5px; padding: 8px; background: var(--ecac-gray); border-radius: 4px; border: 1px solid var(--ecac-border); font-size: 0.85rem; }
    .item-explicacao strong { color: var(--ecac-blue); font-size: 0.95rem; }
    .item-explicacao p { margin: 2px 0; }
    .item-explicacao code { background: #fff; padding: 1px 5px; border-radius: 2px; border: 1px solid var(--ecac-border); font-family: monospace; font-weight: 800; color: #000; }

    .ocst-info {
      display: block;
      font-size: 0.72rem;
      color: #333;
      font-weight: 700;
      margin-top: 2px;
      white-space: normal;
      line-height: 1.2;
    }

    .ocst-code {
      background: #e1e1e1;
      color: #000;
      padding: 0px 3px;
      border-radius: 2px;
      font-weight: 800;
      margin-right: 3px;
      border: 1px solid #ccc;
    }

    .dropdown-estados {
      display: none; position: absolute; top: 100%; left: 0; z-index: 1000; width: 400px;
      background: #fff; border: 1px solid var(--ecac-blue); border-radius: 2px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15); padding: 5px; grid-template-columns: repeat(3, 1fr); gap: 3px;
    }
    .btn-sel-estado { height: 24px; font-size: 0.7rem; background: var(--ecac-gray); border: 1px solid var(--ecac-border); display: flex; align-items: center; padding: 0 5px; cursor: pointer; }
    .btn-sel-estado:hover { background: var(--ecac-blue); color: #fff; }

    .status-msg { padding: 5px; border-radius: 2px; margin-bottom: 5px; font-weight: 800; font-size: 0.8rem; display: none; text-align: center; }
    .status-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block; }
    .status-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block; }

    .vencimento-box {
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 4px;
      padding: 8px 12px;
      margin-top: 8px;
      font-weight: 800;
      color: #856404;
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
<div class="container">
  <div class="card">
    <header><h1>Calculadora ICMS ST Pro</h1></header>

    <div class="upload-section" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <p>📂 IMPORTAR XML OU TXT</p>
    </div>
    <input type="file" id="fileInput" accept=".xml,.txt" onchange="handleFileSelect(event)">
    <div id="statusMsg" class="status-msg"></div>

    <h2>Dados da Nota Fiscal</h2>
    <div class="grid-config" style="background: #fffdf0; border: 1px solid #ffeeba;">
      <div class="campo"><label>Número da NF</label><input type="text" id="numeroNF" placeholder="000.000"></div>
      <div class="campo" style="grid-column: span 2;"><label>Fornecedor (Emitente)</label><input type="text" id="nomeFornecedor" placeholder="Nome Completo do Emitente"></div>
      <div class="campo"><label>Data Emissão</label><input type="date" id="emissao"></div>
    </div>

    <h2>Produtos / Itens</h2>
    <div id="listaProdutos" class="produtos-container">
      <div class="linha-produto produto">
        <div class="campo"><label>Descrição</label><input type="text" class="descProduto" placeholder="Item"></div>
        <div class="campo"><label>O/CST</label><input type="text" class="ocstProduto formatar-ocst" placeholder="0/00" maxlength="5"></div>
        <div class="campo"><label>Valor (R$)</label><input type="text" class="valorProduto formatar-br" value="0,00"></div>
        <div class="campo"><label>IPI (R$)</label><input type="text" class="ipiProduto formatar-br" value="0,00"></div>
        <div class="campo"><label>Outras (R$)</label><input type="text" class="outrasProduto formatar-br" value="0,00"></div>
        <div class="campo"><label>Desconto (R$)</label><input type="text" class="descontoProduto formatar-br" value="0,00"></div>
        <div class="campo"><label>MVA %</label><input type="text" class="mvaProduto formatar-br" value="0,00"></div>
        <div class="campo"><label>Red. Base %</label><input type="text" class="reducaoBase formatar-br" value="100,00"></div>
        <div class="campo"><label>Red. Origem %</label><input type="text" class="reducaoOrigem formatar-br" value="0,00"></div>
        <div class="campo"><label>&nbsp;</label><button class="btn btn-success btn-icon" onclick="adicionarProduto()">+</button></div>
        <div class="campo"><label>&nbsp;</label><button class="btn btn-danger btn-icon" onclick="removerProduto(this)">×</button></div>
      </div>
    </div>

    <h2>Configurações</h2>
    <div class="grid-config">
      <div class="campo"><label>Frete (R$)</label><input type="text" id="frete" class="formatar-br" value="0,00"></div>
      <div class="campo" style="position: relative;">
        <label>Origem</label>
        <input type="text" id="estadoOrigem" readonly placeholder="UF" onclick="toggleDropdown()">
        <div class="dropdown-estados" id="dropdownEstados"></div>
      </div>
      <div class="campo"><label>Aliq. Interna (%)</label><input type="text" id="aliquotaInterna" class="formatar-br" value="20,00"></div>
      <div class="campo"><label>Aliq. Interestadual (%)</label><input type="text" id="aliquotaInterestadual" class="formatar-br" value="12,00"></div>
    </div>

    <div class="action-bar">
      <button class="btn btn-warning" onclick="resetarCalculadora()">RESETAR</button>
      <button class="btn btn-success" onclick="exportarTXT()">EXPORTAR TXT</button>
      <button class="btn btn-primary" onclick="calcularST()">CALCULAR</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Item / O-CST</th>
            <th>Valor</th>
            <th>IPI</th>
            <th>MVA %</th>
            <th>V. Operação</th>
            <th>V. MVA</th>
            <th>BC Antecip.</th>
            <th>ICMS Ant. Int.</th>
            <th>Al Int</th>
            <th>Al Intest</th>
            <th>BC ICMS</th>
            <th>ICMS Origem</th>
            <th>ICMS Ant. Orig.</th>
            <th>ICMS a Pagar</th>
          </tr>
        </thead>
        <tbody id="tabelaResultados"></tbody>
        <tfoot>
          <tr>
            <td>TOTAIS</td>
            <td id="totalProdutos"></td>
            <td id="totalIPI"></td>
            <td>-</td>
            <td id="totalOperacao"></td>
            <td id="totalMVA"></td>
            <td id="totalBCAnt"></td>
            <td id="totalICMSAntInt"></td>
            <td>-</td>
            <td>-</td>
            <td id="totalBCICMS"></td>
            <td id="totalICMSOrigem"></td>
            <td id="totalICMSAntOrig"></td>
            <td id="totalICMSPagar"></td>
          </tr>
        </tfoot>
      </table>
    </div>

    <div id="vencimentoBox" class="vencimento-box" style="display:none;"></div>
    <div class="explicacao" id="explicacao"></div>
  </div>
</div>

<script>
/* ========== TABELAS DE REFERÊNCIA ========== */
const tabelaOrigem = {
  "0": "Nacional",
  "1": "Estrangeira - Importação direta",
  "2": "Estrangeira - Adquirida no mercado interno",
  "3": "Nacional, Conteúdo Importação > 40% e <= 70%",
  "4": "Nacional, processos produtivos básicos",
  "5": "Nacional, Conteúdo Importação <= 40%",
  "6": "Estrangeira - Importação direta, sem similar nacional",
  "7": "Estrangeira - Adquirida no mercado interno, sem similar nacional",
  "8": "Nacional, Conteúdo Importação > 70%"
};

const tabelaCST = {
  "101": "Tributada Simples c/ crédito",
  "102": "Tributada Simples s/ crédito",
  "103": "Isenção ICMS Simples",
  "201": "Tributada Simples c/ crédito e ST",
  "202": "Tributada Simples s/ crédito e ST",
  "203": "Isenção ICMS Simples e ST",
  "300": "Imune",
  "400": "Não tributada Simples",
  "500": "ICMS cobrado anteriormente por ST",
  "900": "Outros",
  "00": "Tributada integralmente",
  "10": "Tributada e c/ cobrança ST",
  "20": "Com redução de base de cálculo",
  "30": "Isenta/Não tributada e c/ cobrança ST",
  "40": "Isenta",
  "41": "Não tributada",
  "50": "Suspensão",
  "51": "Diferimento",
  "60": "ICMS cobrado anteriormente por ST",
  "70": "Com redução de BC e cobrança ST",
  "90": "Outras"
};

const estadosData = [
  {sigla: "AC", nome: "Acre", aliq: 12}, {sigla: "AL", nome: "Alagoas", aliq: 12},
  {sigla: "AP", nome: "Amapá", aliq: 12}, {sigla: "AM", nome: "Amazonas", aliq: 12},
  {sigla: "BA", nome: "Bahia", aliq: 12}, {sigla: "CE", nome: "Ceará", aliq: 12},
  {sigla: "ES", nome: "Espírito Santo", aliq: 12}, {sigla: "GO", nome: "Goiás", aliq: 12},
  {sigla: "MA", nome: "Maranhão", aliq: 12}, {sigla: "MT", nome: "Mato Grosso", aliq: 12},
  {sigla: "MS", nome: "Mato Grosso do Sul", aliq: 12}, {sigla: "PA", nome: "Pará", aliq: 12},
  {sigla: "PB", nome: "Paraíba", aliq: 12}, {sigla: "PE", nome: "Pernambuco", aliq: 12},
  {sigla: "PI", nome: "Piauí", aliq: 12}, {sigla: "RN", nome: "Rio G. do Norte", aliq: 12},
  {sigla: "RO", nome: "Rondônia", aliq: 12}, {sigla: "RR", nome: "Roraima", aliq: 12},
  {sigla: "SE", nome: "Sergipe", aliq: 12}, {sigla: "TO", nome: "Tocantins", aliq: 12},
  {sigla: "MG", nome: "Minas Gerais", aliq: 7}, {sigla: "RJ", nome: "Rio de Janeiro", aliq: 7},
  {sigla: "SP", nome: "São Paulo", aliq: 7}, {sigla: "PR", nome: "Paraná", aliq: 7},
  {sigla: "SC", nome: "Santa Catarina", aliq: 7}, {sigla: "RS", nome: "Rio G. do Sul", aliq: 7}
];

/* ========== ESTADO GLOBAL ========== */
let aliquotasItens = {};

/* ========== MÁSCARAS ========== */
function aplicarMascaraBR(input) {
  let value = input.value.replace(/\D/g, "");
  if (value === "") value = "0";
  let num = (parseInt(value) / 100).toFixed(2);
  input.value = num.replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

function aplicarMascaraOCST(input) {
  let val = input.value.replace(/\D/g, "");
  if (val.length === 3) {
    input.value = val[0] + "/" + val.substring(1);
  } else if (val.length === 4) {
    input.value = val[0] + "/" + val.substring(1);
  }
}

function parseBR(str) {
  if (!str) return 0;
  return parseFloat(str.toString().replace(/\./g, "").replace(",", "."));
}

function formatBR(num) {
  return num.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

document.addEventListener("input", (e) => {
  if (e.target.classList.contains("formatar-br") || ["frete", "aliquotaInterna", "aliquotaInterestadual"].includes(e.target.id)) {
    aplicarMascaraBR(e.target);
  }
  if (e.target.classList.contains("formatar-ocst")) {
    aplicarMascaraOCST(e.target);
  }
});

/* ========== UPLOAD / DROP ========== */
const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.background = "#d1e3f0"; });
dropZone.addEventListener('dragleave', () => { dropZone.style.background = "var(--ecac-blue-light)"; });
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.style.background = "var(--ecac-blue-light)";
  const files = e.dataTransfer.files;
  if (files.length > 0) processarArquivo(files[0]);
});

function handleFileSelect(event) {
  const file = event.target.files[0];
  if (file) processarArquivo(file);
}

function processarArquivo(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const content = e.target.result;
    if (file.name.toLowerCase().endsWith('.xml')) {
      try {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(content, "text/xml");
        importarXML(xmlDoc);
        showStatus("✓ XML importado com sucesso!", "success");
      } catch (err) {
        showStatus("Erro ao processar XML", "error");
      }
    } else if (file.name.toLowerCase().endsWith('.txt')) {
      try {
        importarTXT(content);
        showStatus("✓ TXT importado com sucesso!", "success");
      } catch (err) {
        showStatus("Erro ao processar TXT", "error");
      }
    }
  };
  reader.readAsText(file);
}

/* ========== DROPDOWN ESTADOS ========== */
function renderizarDropdown() {
  const dropdown = document.getElementById("dropdownEstados");
  estadosData.forEach(estado => {
    const div = document.createElement("div");
    div.className = "btn-sel-estado";
    div.innerText = `${estado.sigla} - ${estado.nome}`;
    div.onclick = (e) => { e.stopPropagation(); selecionarEstado(estado); };
    dropdown.appendChild(div);
  });
}

function selecionarEstado(estado) {
  document.getElementById("estadoOrigem").value = `${estado.sigla} - ${estado.nome}`;
  document.getElementById("aliquotaInterestadual").value = formatBR(estado.aliq);
  document.getElementById("dropdownEstados").style.display = "none";
  aliquotasItens = {};
  calcularST();
}

function toggleDropdown() {
  const dropdown = document.getElementById("dropdownEstados");
  dropdown.style.display = dropdown.style.display === "grid" ? "none" : "grid";
}

window.onclick = (e) => {
  if (!e.target.matches('#estadoOrigem')) {
    document.getElementById("dropdownEstados").style.display = "none";
  }
};

/* ========== STATUS ========== */
function showStatus(msg, type) {
  const el = document.getElementById("statusMsg");
  el.innerText = msg;
  el.className = "status-msg status-" + type;
  el.style.display = "block";
  setTimeout(() => { el.style.display = "none"; }, 3000);
}

/* ========== RESET ========== */
function resetarCalculadora() {
  document.getElementById("listaProdutos").innerHTML = "";
  aliquotasItens = {};
  adicionarProduto();
  document.getElementById("frete").value = "0,00";
  document.getElementById("estadoOrigem").value = "";
  document.getElementById("aliquotaInterna").value = "20,00";
  document.getElementById("aliquotaInterestadual").value = "12,00";
  document.getElementById("numeroNF").value = "";
  document.getElementById("nomeFornecedor").value = "";
  document.getElementById("emissao").value = "";
  document.getElementById("tabelaResultados").innerHTML = "";
  document.getElementById("explicacao").innerHTML = "";
  document.getElementById("vencimentoBox").style.display = "none";
}

/* ========== IMPORTAR XML ========== */
function importarXML(xmlDoc) {
  document.getElementById("listaProdutos").innerHTML = "";
  aliquotasItens = {};

  const ide = xmlDoc.querySelector("ide");
  const nNF = ide?.querySelector("nNF")?.textContent || "";
  document.getElementById("numeroNF").value = nNF;

  const dhEmi = ide?.querySelector("dhEmi")?.textContent || ide?.querySelector("dEmi")?.textContent || "";
  if (dhEmi) {
    document.getElementById("emissao").value = dhEmi.substring(0, 10);
  }

  const emit = xmlDoc.querySelector("emit");
  const xNome = emit?.querySelector("xNome")?.textContent || "";
  document.getElementById("nomeFornecedor").value = xNome;

  const ufOrigem = emit?.querySelector("enderEmit > UF")?.textContent;
  if (ufOrigem) {
    const estado = estadosData.find(e => e.sigla === ufOrigem);
    if (estado) {
      document.getElementById("estadoOrigem").value = `${estado.sigla} - ${estado.nome}`;
      document.getElementById("aliquotaInterestadual").value = formatBR(estado.aliq);
    }
  }

  const ICMSTot = xmlDoc.querySelector("ICMSTot");
  if (ICMSTot) {
    document.getElementById("frete").value = formatBR(parseFloat(ICMSTot.querySelector("vFrete")?.textContent || 0));
  }

  const itens = xmlDoc.querySelectorAll("det");
  itens.forEach(det => {
    const prod = det.querySelector("prod");
    const imposto = det.querySelector("imposto");
    const icms = imposto?.querySelector("ICMS");

    let orig = "", cst = "";
    if (icms) {
      const tagsCST = ["CST", "CSOSN"];
      for (const tag of tagsCST) {
        const elCST = icms.querySelector(tag);
        if (elCST) { cst = elCST.textContent; break; }
        const elInner = icms.querySelector("* > " + tag);
        if (elInner) { cst = elInner.textContent; break; }
      }
      const elOrig = icms.querySelector("orig") || icms.querySelector("* > orig");
      if (elOrig) orig = elOrig.textContent;
    }

    const ipiEl = imposto?.querySelector("IPI vIPI") || imposto?.querySelector("IPI > * > vIPI");
    let mva = "0,00";
    let redBase = "100,00";
    if (icms) {
      const elMVA = icms.querySelector("pMVAST") || icms.querySelector("* > pMVAST");
      if (elMVA) mva = formatBR(parseFloat(elMVA.textContent || 0));
      const elRedBC = icms.querySelector("pRedBCST") || icms.querySelector("* > pRedBCST");
      if (elRedBC) {
        const red = parseFloat(elRedBC.textContent || 0);
        redBase = formatBR(100 - red);
      }
    }

    adicionarProduto(
      prod?.querySelector("xProd")?.textContent || "Item",
      formatBR(parseFloat(prod?.querySelector("vProd")?.textContent || 0)),
      formatBR(parseFloat(ipiEl?.textContent || 0)),
      formatBR(parseFloat(prod?.querySelector("vOutro")?.textContent || 0)),
      formatBR(parseFloat(prod?.querySelector("vDesc")?.textContent || 0)),
      mva,
      redBase,
      "0,00",
      orig && cst ? `${orig}/${cst}` : ""
    );
  });

  calcularST();
}

/* ========== EXPORTAR / IMPORTAR TXT ========== */
function exportarTXT() {
  let txt = "=== CÁLCULO ICMS ST ===\n\n";
  const numNF = document.getElementById("numeroNF").value;
  const nomeEmitente = document.getElementById("nomeFornecedor").value;
  const emissao = document.getElementById("emissao").value;

  txt += `NF: ${numNF}\n`;
  txt += `Fornecedor: ${nomeEmitente}\n`;
  txt += `Emissão: ${emissao}\n`;
  txt += `Frete Total: ${document.getElementById("frete").value}\n`;
  txt += `Estado Origem: ${document.getElementById("estadoOrigem").value}\n`;
  txt += `Aliq. Interna: ${document.getElementById("aliquotaInterna").value}\n`;
  txt += `Aliq. Interestadual: ${document.getElementById("aliquotaInterestadual").value}\n\n`;
  txt += "--- PRODUTOS ---\n";

  document.querySelectorAll(".produto").forEach((p, i) => {
    const aliqI = aliquotasItens[i]?.interna !== undefined ? aliquotasItens[i].interna : "";
    const aliqIntest = aliquotasItens[i]?.interestadual !== undefined ? aliquotasItens[i].interestadual : "";
    txt += `P${i+1}|${p.querySelector(".descProduto").value}|${p.querySelector(".valorProduto").value}|${p.querySelector(".ipiProduto").value}|${p.querySelector(".outrasProduto").value}|${p.querySelector(".descontoProduto").value}|${p.querySelector(".mvaProduto").value}|${p.querySelector(".reducaoBase").value}|${p.querySelector(".reducaoOrigem").value}|${aliqI}|${aliqIntest}|${p.querySelector(".ocstProduto").value}\n`;
  });

  txt += `\n--- RESULTADOS TOTAIS ---\n`;
  txt += `ICMS a Pagar Total: ${document.getElementById("totalICMSPagar").innerText}\n`;

  const blob = new Blob([txt], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const palavras = nomeEmitente.trim().split(/\s+/);
  const nomeResumido = palavras.slice(0, 2).join("_");
  a.href = url;
  a.download = `ST_NF_${numNF || 'S_N'}_${nomeResumido || 'EMITENTE'}.txt`;
  a.click();
}

function importarTXT(content) {
  const lines = content.split("\n");
  document.getElementById("listaProdutos").innerHTML = "";
  aliquotasItens = {};

  lines.forEach((line) => {
    if (line.startsWith("NF: ")) document.getElementById("numeroNF").value = line.split(": ")[1] || "";
    if (line.startsWith("Fornecedor: ")) document.getElementById("nomeFornecedor").value = line.split(": ")[1] || "";
    if (line.startsWith("Emissão: ")) document.getElementById("emissao").value = line.split(": ")[1] || "";
    if (line.startsWith("Frete Total: ")) document.getElementById("frete").value = line.split(": ")[1] || "0,00";
    if (line.startsWith("Estado Origem: ")) document.getElementById("estadoOrigem").value = line.split(": ")[1] || "";
    if (line.startsWith("Aliq. Interna: ")) document.getElementById("aliquotaInterna").value = line.split(": ")[1] || "20,00";
    if (line.startsWith("Aliq. Interestadual: ")) document.getElementById("aliquotaInterestadual").value = line.split(": ")[1] || "12,00";

    if (line.startsWith("P")) {
      const parts = line.split("|");
      const pIdx = document.querySelectorAll(".produto").length;
      adicionarProduto(
        parts[1] || "",
        parts[2] || "0,00",
        parts[3] || "0,00",
        parts[4] || "0,00",
        parts[5] || "0,00",
        parts[6] || "0,00",
        parts[7] || "100,00",
        parts[8] || "0,00",
        parts[11] || ""
      );
      if (parts[9] !== undefined && parts[9] !== "") {
        if (!aliquotasItens[pIdx]) aliquotasItens[pIdx] = {};
        aliquotasItens[pIdx].interna = parseFloat(parts[9]);
      }
      if (parts[10] !== undefined && parts[10] !== "") {
        if (!aliquotasItens[pIdx]) aliquotasItens[pIdx] = {};
        aliquotasItens[pIdx].interestadual = parseFloat(parts[10]);
      }
    }
  });

  calcularST();
}

/* ========== PRODUTOS ========== */
function adicionarProduto(desc = "", valor = "0,00", ipi = "0,00", outras = "0,00", desconto = "0,00", mva = "0,00", redBase = "100,00", redOrigem = "0,00", ocst = "") {
  const lista = document.getElementById("listaProdutos");
  const div = document.createElement("div");
  div.className = "linha-produto produto";
  div.innerHTML = `
    <div class="campo"><label>Descrição</label><input type="text" class="descProduto" value="${desc}"></div>
    <div class="campo"><label>O/CST</label><input type="text" class="ocstProduto formatar-ocst" value="${ocst}" placeholder="0/00" maxlength="5"></div>
    <div class="campo"><label>Valor</label><input type="text" class="valorProduto formatar-br" value="${valor}"></div>
    <div class="campo"><label>IPI</label><input type="text" class="ipiProduto formatar-br" value="${ipi}"></div>
    <div class="campo"><label>Outras</label><input type="text" class="outrasProduto formatar-br" value="${outras}"></div>
    <div class="campo"><label>Desc.</label><input type="text" class="descontoProduto formatar-br" value="${desconto}"></div>
    <div class="campo"><label>MVA %</label><input type="text" class="mvaProduto formatar-br" value="${mva}"></div>
    <div class="campo"><label>Red. Base %</label><input type="text" class="reducaoBase formatar-br" value="${redBase}"></div>
    <div class="campo"><label>Red. Origem %</label><input type="text" class="reducaoOrigem formatar-br" value="${redOrigem}"></div>
    <div class="campo"><label>&nbsp;</label><button class="btn btn-success btn-icon" onclick="adicionarProduto()">+</button></div>
    <div class="campo"><label>&nbsp;</label><button class="btn btn-danger btn-icon" onclick="removerProduto(this)">×</button></div>`;
  lista.appendChild(div);
}

function removerProduto(btn) {
  if (document.querySelectorAll(".produto").length > 1) {
    btn.closest(".produto").remove();
  }
}

/* ========== EDIÇÃO DE ALÍQUOTA NA TABELA ========== */
function editarAliquotaNaTabela(celula, tipo, indexProduto) {
  if (celula.querySelector('input')) return;
  const valorAtual = parseFloat(celula.innerText) || 0;
  const input = document.createElement('input');
  input.type = 'number';
  input.step = '0.1';
  input.value = valorAtual;
  input.style.width = '100%';
  input.style.height = '22px';
  input.style.fontWeight = '700';
  celula.innerHTML = '';
  celula.appendChild(input);
  input.focus();
  input.select();

  const salvarEdicao = () => {
    const novoValor = parseFloat(input.value) || 0;
    if (!aliquotasItens[indexProduto]) aliquotasItens[indexProduto] = {};
    if (tipo === 'interna') aliquotasItens[indexProduto].interna = novoValor;
    else if (tipo === 'interestadual') aliquotasItens[indexProduto].interestadual = novoValor;
    calcularST();
  };

  input.onblur = salvarEdicao;
  input.onkeypress = (e) => { if (e.key === 'Enter') salvarEdicao(); };
}

/* ========== CÁLCULO ICMS ST (LÓGICA ORIGINAL 100% PRESERVADA) ==========
 * valorOperacao           = valorProduto + frete + ipi + outras - descontos
 * valorMVA                = valorOperacao * (1 + mva/100)
 * baseCalculoAnt         = valorMVA * (reducaoBase / 100)
 * icmsAntecipadoInterno   = baseCalculoAnt * (aliquotaInterna / 100)
 * bcICMS                  = valorOperacao * ((100 - reducaoOrigem) / 100)
 * icmsOrigem              = bcICMS * (aliquotaInterestadual / 100)
 * icmsAntecipadoOrigem    = icmsOrigem * (reducaoBase / 100)
 * icmsAPagar              = icmsAntecipadoInterno - icmsAntecipadoOrigem
 */
function calcularST() {
  const produtos = document.querySelectorAll(".produto");
  const freteTotal = parseBR(document.getElementById("frete").value);
  const tabela = document.getElementById("tabelaResultados");
  tabela.innerHTML = "";

  let tProd = 0, tIPI = 0, tOper = 0, tMVA = 0, tBCAnt = 0;
  let tICMSAntInt = 0, tBCICMS = 0, tICMSOrig = 0, tICMSAntOrig = 0, tPagar = 0;

  const moeda = v => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const detalhes = [];

  let somaValorProdutos = 0;
  produtos.forEach(p => somaValorProdutos += parseBR(p.querySelector(".valorProduto").value));

  produtos.forEach((p, idx) => {
    const desc = p.querySelector(".descProduto").value || `Item ${idx + 1}`;
    const ocstRaw = p.querySelector(".ocstProduto").value || "";
    const vProd = parseBR(p.querySelector(".valorProduto").value);
    const vIPI = parseBR(p.querySelector(".ipiProduto").value);
    const vOutras = parseBR(p.querySelector(".outrasProduto").value);
    const vDesc = parseBR(p.querySelector(".descontoProduto").value);
    const mva = parseBR(p.querySelector(".mvaProduto").value);
    const reducaoBase = parseBR(p.querySelector(".reducaoBase").value);
    const reducaoOrigem = parseBR(p.querySelector(".reducaoOrigem").value);

    const aliqInterna = (aliquotasItens[idx]?.interna !== undefined
      ? aliquotasItens[idx].interna
      : parseBR(document.getElementById("aliquotaInterna").value));
    const aliqInterestadual = (aliquotasItens[idx]?.interestadual !== undefined
      ? aliquotasItens[idx].interestadual
      : parseBR(document.getElementById("aliquotaInterestadual").value));

    const freteItem = somaValorProdutos > 0 ? (vProd / somaValorProdutos) * freteTotal : 0;

    // ===== FÓRMULAS ORIGINAIS DO ST =====
    const valorOperacao = vProd + freteItem + vIPI + vOutras - vDesc;
    const valorMVA = valorOperacao * (1 + mva / 100);
    const baseCalculoAnt = valorMVA * (reducaoBase / 100);
    const icmsAntecipadoInterno = baseCalculoAnt * (aliqInterna / 100);
    const bcICMS = valorOperacao * ((100 - reducaoOrigem) / 100);
    const icmsOrigem = bcICMS * (aliqInterestadual / 100);
    const icmsAntecipadoOrigem = icmsOrigem * (reducaoBase / 100);
    const icmsAPagar = icmsAntecipadoInterno - icmsAntecipadoOrigem;

    tProd += vProd;
    tIPI += vIPI;
    tOper += valorOperacao;
    tMVA += valorMVA;
    tBCAnt += baseCalculoAnt;
    tICMSAntInt += icmsAntecipadoInterno;
    tBCICMS += bcICMS;
    tICMSOrig += icmsOrigem;
    tICMSAntOrig += icmsAntecipadoOrigem;
    tPagar += icmsAPagar;

    detalhes.push({
      desc, valorOperacao, valorMVA, baseCalculoAnt, icmsAntecipadoInterno,
      bcICMS, icmsOrigem, icmsAntecipadoOrigem, icmsAPagar,
      mva, reducaoBase, reducaoOrigem, aliqInterna, aliqInterestadual,
      freteItem, vProd, vIPI, vOutras, vDesc
    });

    let infoCombinada = "";
    if (ocstRaw.includes("/")) {
      const parts = ocstRaw.split("/");
      const dOrig = tabelaOrigem[parts[0]] || "Desconhecido";
      const dCst = tabelaCST[parts[1]] || "Desconhecido";
      infoCombinada = `<span class="ocst-info"><span class="ocst-code">${ocstRaw}</span> ${dOrig} - ${dCst}</span>`;
    }

    tabela.innerHTML += `<tr>
      <td title="${desc}">${desc}${infoCombinada}</td>
      <td>${moeda(vProd)}</td>
      <td>${moeda(vIPI)}</td>
      <td>${mva.toFixed(2)}%</td>
      <td>${moeda(valorOperacao)}</td>
      <td>${moeda(valorMVA)}</td>
      <td>${moeda(baseCalculoAnt)}</td>
      <td>${moeda(icmsAntecipadoInterno)}</td>
      <td class="editavel" onclick="editarAliquotaNaTabela(this, 'interna', ${idx})">${aliqInterna.toFixed(1)}%</td>
      <td class="editavel" onclick="editarAliquotaNaTabela(this, 'interestadual', ${idx})">${aliqInterestadual.toFixed(1)}%</td>
      <td>${moeda(bcICMS)}</td>
      <td>${moeda(icmsOrigem)}</td>
      <td>${moeda(icmsAntecipadoOrigem)}</td>
      <td><strong>${moeda(icmsAPagar)}</strong></td>
    </tr>`;
  });

  document.getElementById("totalProdutos").innerText = moeda(tProd);
  document.getElementById("totalIPI").innerText = moeda(tIPI);
  document.getElementById("totalOperacao").innerText = moeda(tOper);
  document.getElementById("totalMVA").innerText = moeda(tMVA);
  document.getElementById("totalBCAnt").innerText = moeda(tBCAnt);
  document.getElementById("totalICMSAntInt").innerText = moeda(tICMSAntInt);
  document.getElementById("totalBCICMS").innerText = moeda(tBCICMS);
  document.getElementById("totalICMSOrigem").innerText = moeda(tICMSOrig);
  document.getElementById("totalICMSAntOrig").innerText = moeda(tICMSAntOrig);
  document.getElementById("totalICMSPagar").innerText = moeda(tPagar);

  const emissaoInput = document.getElementById("emissao").value;
  const vencBox = document.getElementById("vencimentoBox");
  if (emissaoInput) {
    const emissao = new Date(emissaoInput + "T12:00:00");
    const vencimento = new Date(emissao);
    vencimento.setDate(vencimento.getDate() + 20);
    vencBox.innerHTML = `📅 Vencimento do ICMS ST: <strong>${vencimento.toLocaleDateString("pt-BR")}</strong> (Emissão + 20 dias)`;
    vencBox.style.display = "block";
  } else {
    vencBox.style.display = "none";
  }

  let html = "<h3>📊 Explicação Detalhada do Cálculo ICMS ST</h3>";
  detalhes.forEach(d => {
    html += `<div class="item-explicacao">
      <strong>${d.desc}:</strong><br>
      <p><strong>1. Valor da Operação:</strong> Valor + Frete + IPI + Outras − Descontos
        <code>${moeda(d.vProd)} + ${moeda(d.freteItem)} + ${moeda(d.vIPI)} + ${moeda(d.vOutras)} − ${moeda(d.vDesc)} = ${moeda(d.valorOperacao)}</code></p>
      <p><strong>2. Valor do MVA:</strong> Valor da Operação × (1 + MVA%)
        <code>${moeda(d.valorOperacao)} × (1 + ${d.mva.toFixed(2)}%) = ${moeda(d.valorMVA)}</code></p>
      <p><strong>3. Base de Cálculo da Antecipação:</strong> Valor MVA × (Redução Base / 100)
        <code>${moeda(d.valorMVA)} × (${d.reducaoBase.toFixed(2)} / 100) = ${moeda(d.baseCalculoAnt)}</code></p>
      <p><strong>4. ICMS Antecipado Interno:</strong> BC Antecipação × Alíquota Interna
        <code>${moeda(d.baseCalculoAnt)} × ${d.aliqInterna.toFixed(2)}% = ${moeda(d.icmsAntecipadoInterno)}</code></p>
      <p><strong>5. Base de Cálculo do ICMS:</strong> Valor Operação × ((100 − Redução Origem) / 100)
        <code>${moeda(d.valorOperacao)} × ((100 − ${d.reducaoOrigem.toFixed(2)}) / 100) = ${moeda(d.bcICMS)}</code></p>
      <p><strong>6. ICMS Origem:</strong> BC ICMS × Alíquota Interestadual
        <code>${moeda(d.bcICMS)} × ${d.aliqInterestadual.toFixed(2)}% = ${moeda(d.icmsOrigem)}</code></p>
      <p><strong>7. ICMS Antecipado Origem:</strong> ICMS Origem × (Redução Base / 100)
        <code>${moeda(d.icmsOrigem)} × (${d.reducaoBase.toFixed(2)} / 100) = ${moeda(d.icmsAntecipadoOrigem)}</code></p>
      <p><strong>8. ICMS a Pagar:</strong> ICMS Antecipado Interno − ICMS Antecipado Origem
        <code>${moeda(d.icmsAntecipadoInterno)} − ${moeda(d.icmsAntecipadoOrigem)} = <strong>${moeda(d.icmsAPagar)}</strong></code></p>
    </div>`;
  });
  document.getElementById("explicacao").innerHTML = html;
}
