<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora ICMS Antecipado Pro - v35</title>

  <!-- Fontes Profissionais -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --ecac-blue: #003366;
      --ecac-blue-light: #e6f0f7;
      --ecac-gray: #f2f2f2;
      --ecac-border: #cccccc;
      --ecac-text: #333333;
      --primary: var(--ecac-blue);
      --danger: #cc0000;
      --success: #10b981;
      --bg: #f8f9fa;
      --card: #ffffff;
      --border: var(--ecac-border);
      --text: var(--ecac-text);
      --shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 5px;
      line-height: 1.1;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 1800px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    .main-area {
      flex: 1;
      min-width: 0;
    }

    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px;
      box-shadow: var(--shadow);
      max-height: 95vh;
      overflow-y: auto;
      position: sticky;
      top: 5px;
    }

    .sidebar h3 {
      font-size: 0.75rem;
      color: var(--ecac-blue);
      font-weight: 800;
      text-transform: uppercase;
      border-bottom: 1px solid var(--ecac-border);
      padding-bottom: 4px;
      margin-bottom: 6px;
    }

    .note-list { display: flex; flex-direction: column; gap: 4px; }

    .note-item {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 8px;
      border: 1px solid var(--ecac-border);
      border-radius: 3px;
      background: #f8f9fa;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 700;
      transition: background 0.15s, border-color 0.15s;
    }

    .note-item:hover { background: var(--ecac-blue-light); border-color: var(--ecac-blue); }
    .note-item.active {
      background: var(--ecac-blue);
      color: #fff;
      border-color: var(--ecac-blue);
    }

    .note-item .note-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .note-item .btn-del-note {
      width: 18px;
      height: 18px;
      padding: 0;
      font-size: 0.7rem;
      background: transparent;
      border: none;
      color: #cc0000;
      cursor: pointer;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .note-item.active .btn-del-note { color: #ffb3b3; }
    .note-item .btn-del-note:hover { background: rgba(204,0,0,0.15); }

    .sidebar-actions {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }
    .sidebar-actions .btn { flex: 1; height: 26px; font-size: 0.65rem; padding: 0 4px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px;
      box-shadow: var(--shadow);
      margin-bottom: 5px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
      border-bottom: 2px solid var(--ecac-blue);
      padding-bottom: 2px;
    }

    h1 { font-size: 1.1rem; color: var(--ecac-blue); font-weight: 800; }

    h2 {
      font-size: 0.75rem;
      margin: 8px 0 4px 0;
      color: var(--ecac-blue);
      font-weight: 800;
      text-transform: uppercase;
      border-bottom: 1px solid var(--ecac-border);
      padding-bottom: 1px;
    }

    .upload-section {
      background: var(--ecac-blue-light);
      border: 2px dashed var(--ecac-blue);
      border-radius: 4px;
      padding: 15px;
      text-align: center;
      margin: 5px 0;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .upload-section.dragover {
      background: #cce0ff;
      border-color: #0056b3;
      transform: scale(1.01);
    }

    .upload-section p { font-weight: 800; color: var(--ecac-blue); font-size: 0.85rem; }

    #fileInput { display: none; }

    .produtos-container { display: flex; flex-direction: column; gap: 3px; }

    .linha-produto {
      display: grid;
      grid-template-columns: 2.5fr 0.5fr 1fr 1fr 1fr 1fr 28px 28px;
      gap: 5px;
      align-items: flex-end;
      background: #fff;
      padding: 3px 6px;
      border-radius: 2px;
      border: 1px solid var(--border);
    }

    .campo { display: flex; flex-direction: column; gap: 1px; }

    label { font-size: 0.6rem; font-weight: 800; color: var(--ecac-blue); text-transform: uppercase; }

    input {
      height: 24px;
      border: 1px solid var(--ecac-border);
      border-radius: 2px;
      padding: 0 5px;
      font-size: 0.85rem;
      font-weight: 700;
      width: 100%;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      height: 28px;
      border-radius: 2px;
      font-weight: 800;
      font-size: 0.75rem;
      cursor: pointer;
      border: none;
      gap: 5px;
    }

    .btn-primary { background: var(--ecac-blue); color: white; }
    .btn-success { background: #28a745; color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-warning { background: #f39c12; color: white; }
    
    .btn-icon { width: 24px; height: 24px; padding: 0; font-size: 1rem; }

    .action-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 10px 0;
      padding: 8px;
      background: var(--ecac-gray);
      border-radius: 4px;
      border: 1px solid var(--ecac-border);
    }

    .grid-config {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
      margin-top: 5px;
      background: var(--ecac-gray);
      padding: 6px;
      border-radius: 2px;
      border: 1px solid var(--border);
    }

    .table-container { overflow-x: auto; margin-top: 10px; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      border: 1px solid var(--ecac-border);
      table-layout: fixed;
    }

    th {
      background: var(--ecac-blue);
      padding: 4px 2px;
      text-align: center;
      font-weight: 800;
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      text-transform: uppercase;
      font-size: 0.7rem;
    }

    td {
      padding: 4px 2px;
      text-align: center;
      border: 1px solid var(--ecac-border);
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Larguras Harmônicas */
    th:nth-child(1), td:nth-child(1) { width: 25%; text-align: left; padding-left: 5px; }
    th:nth-child(2), td:nth-child(2) { width: 15%; }
    th:nth-child(3), td:nth-child(3) { width: 15%; }
    th:nth-child(4), td:nth-child(4) { width: 10%; }
    th:nth-child(5), td:nth-child(5) { width: 10%; }
    th:nth-child(6), td:nth-child(6) { width: 25%; }

    tfoot tr { background: #dcfce7 !important; }
    tfoot td { padding: 4px 2px; font-weight: 900; color: #065f46 !important; font-size: 0.8rem; }
    tfoot td:first-child { background: #10b981; color: #ffffff !important; text-align: center; }

    .explicacao { margin-top: 10px; padding: 10px; background: #fff; border: 1px solid var(--ecac-border); border-radius: 4px; }
    .calculo {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.85rem;
      line-height: 1.4;
      color: #333;
    }
    .calculo h2 { margin-top: 0; margin-bottom: 10px; border-bottom: 2px solid var(--ecac-blue); padding-bottom: 5px; }
    .calculo strong { color: var(--ecac-blue); }

    .ocst-info {
      display: block;
      font-size: 0.75rem;
      color: #555;
      font-weight: 600;
      margin-top: 2px;
      white-space: normal;
      line-height: 1.2;
    }

    .ocst-code {
      background: #e1e1e1;
      color: #000;
      padding: 0px 3px;
      border-radius: 2px;
      font-weight: 800;
      margin-right: 3px;
      border: 1px solid #ccc;
    }

    .dropdown-estados {
      display: none; position: absolute; top: 100%; left: 0; z-index: 1000; width: 400px;
      background: #fff; border: 1px solid var(--ecac-blue); border-radius: 2px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15); padding: 5px; grid-template-columns: repeat(3, 1fr); gap: 3px;
    }
    .btn-sel-estado { height: 24px; font-size: 0.7rem; background: var(--ecac-gray); border: 1px solid var(--ecac-border); display: flex; align-items: center; padding: 0 5px; cursor: pointer; }
    .btn-sel-estado:hover { background: var(--ecac-blue); color: #fff; }

    .status-msg { padding: 5px; border-radius: 2px; margin-bottom: 5px; font-weight: 800; font-size: 0.8rem; display: none; text-align: center; }
  </style>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>

<body>
<div class="container">
  <!-- Lista de notas à ESQUERDA -->
  <div class="sidebar">
    <h3>📋 Notas Abertas</h3>
    <div id="noteList" class="note-list"></div>
    <div class="sidebar-actions" style="flex-wrap:wrap;">
      <button class="btn btn-success" onclick="novaNotaEmBranco()" title="Nova nota em branco" style="flex:1 1 45%;font-size:0.6rem;">+ Nova</button>
      <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()" title="Importar TXT/XML" style="flex:1 1 45%;font-size:0.6rem;">Importar</button>
      <button class="btn btn-success" onclick="exportarTXTTodas()" title="Exportar todas em TXT" style="flex:1 1 45%;font-size:0.6rem;">TXT Todas</button>
      <button class="btn btn-success" onclick="exportarExcelTodas()" title="Excel de todas as notas" style="flex:1 1 45%;font-size:0.6rem;background:#1d6f42;">Excel Todas</button>
      <button class="btn btn-warning" onclick="fecharTodasNotas()" title="Fechar todas" style="flex:1 1 100%;font-size:0.6rem;">Limpar</button>
    </div>
  </div>

  <div class="main-area">
  <div class="card">
    <header><h1>Calculadora ICMS Antecipado Pro</h1></header>
    <div class="upload-section" id="dropZone">
      <p>📂 ARRASTE OU CLIQUE PARA IMPORTAR XML / TXT (múltiplos)</p>
    </div>
    <input type="file" id="fileInput" accept=".xml,.txt" multiple>
    <div id="statusMsg" class="status-msg"></div>

    <h2>Dados da Nota Fiscal</h2>
    <div class="grid-config" style="background: #fffdf0; border: 1px solid #ffeeba; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));">
      <div class="campo" style="grid-column: span 2;"><label>Chave de Acesso (44 dígitos)</label><input type="text" id="chNFe" placeholder="0000...0000" maxlength="44"></div>
      <div class="campo"><label>Número da NF</label><input type="text" id="numeroNF" placeholder="000.000"></div>
      <div class="campo" style="grid-column: span 2;"><label>Fornecedor (Emitente)</label><input type="text" id="nomeFornecedor" placeholder="Nome Completo do Emitente"></div>
      <div class="campo"><label>Data Emissão</label><input type="text" id="dataEmissao" placeholder="DD/MM/AAAA" onchange="calcularVigessimoDia()"></div>
      <div class="campo"><label>Vigésimo Dia (20 dias)</label><input type="text" id="vigessimoDia" readonly style="background-color: #f0f0f0; color: #cc0000; font-weight: 800;"></div>
    </div>

    <h2>Produtos / Itens</h2>
    <div id="listaProdutos" class="produtos-container">
      <div class="linha-produto produto">
        <div class="campo"><label>Descrição</label><input type="text" class="descProduto" placeholder="Item"></div>
        <div class="campo"><label>O/CST</label><input type="text" class="ocstProduto formatar-ocst" placeholder="0/00" maxlength="5"></div>
        <div class="campo"><label>Valor (R$)</label><input type="text" class="valorProduto formatar-br" value="0,00" onchange="aplicarMascaraBR(this)"></div>
        <div class="campo"><label>IPI (R$)</label><input type="text" class="ipiProduto formatar-br" value="0,00" onchange="aplicarMascaraBR(this)"></div>
        <div class="campo"><label>Outras (R$)</label><input type="text" class="outrasProduto formatar-br" value="0,00" onchange="aplicarMascaraBR(this)"></div>
        <div class="campo"><label>Desconto (R$)</label><input type="text" class="descontoProduto formatar-br" value="0,00" onchange="aplicarMascaraBR(this)"></div>
        <div class="campo"><label>&nbsp;</label><button class="btn btn-success btn-icon" onclick="adicionarProduto()">+</button></div>
        <div class="campo"><label>&nbsp;</label><button class="btn btn-danger btn-icon" onclick="removerProduto(this)">×</button></div>
      </div>
    </div>

    <h2>Configurações Gerais</h2>
    <div class="grid-config">
      <div class="campo"><label>Frete (R$)</label><input type="text" id="frete" class="formatar-br" value="0,00" onchange="aplicarMascaraBR(this)"></div>
      <div class="campo" style="position: relative;"><label>Origem</label><input type="text" id="estadoOrigem" readonly placeholder="UF" onclick="toggleDropdown()"><div class="dropdown-estados" id="dropdownEstados"></div></div>
      <div class="campo"><label>MVA (%)</label><input type="text" id="mva" class="formatar-pct" value="40,00" onchange="finalizarMascaraPercentual(this)"></div>
      <div class="campo"><label>Redução Base (%)</label><input type="text" id="reducaoBase" class="formatar-pct" value="35,00" onchange="finalizarMascaraPercentual(this)"></div>
      <div class="campo"><label>Aliq. Interna (%)</label><input type="text" id="aliquotaInterna" class="formatar-pct" value="20,00" onchange="finalizarMascaraPercentual(this)"></div>
      <div class="campo"><label>Aliq. Origem (%)</label><input type="text" id="aliquotaOrigem" class="formatar-pct" value="12,00" onchange="finalizarMascaraPercentual(this)"></div>
      <div class="campo"><label>Red. ICMS Origem (%)</label><input type="text" id="reducaoOrigem" class="formatar-pct" value="41,67" onchange="finalizarMascaraPercentual(this)"></div>
    </div>

    <div class="action-bar">
      <button class="btn btn-warning" onclick="resetarCalculadora()">RESETAR</button>
      <button class="btn btn-success" onclick="exportarTXT()" title="Exportar apenas esta nota">TXT (esta nota)</button>
      <button class="btn btn-success" onclick="exportarExcel()" style="background:#1d6f42;" title="Excel apenas desta nota">Excel (esta nota)</button>
      <button class="btn btn-primary" onclick="calcular()">CALCULAR</button>
    </div>

    <div class="table-container">
      <table>
        <thead><tr><th>Item / O-CST</th><th>Valor Produto</th><th>Base Antecipação</th><th>Aliq. Interna %</th><th>Aliq. Interest. %</th><th>ICMS a Pagar</th></tr></thead>
        <tbody id="tabelaResultados"></tbody>
        <tfoot><tr><td>TOTAIS</td><td id="totalProdutos"></td><td id="totalBase"></td><td>-</td><td>-</td><td id="totalICMS"></td></tr></tfoot>
      </table>
    </div>
    <div class="explicacao" id="explicacao"></div>
  </div>
  </div><!-- /main-area -->
</div>

<script>
const tabelaOrigem = {
  "0": "Nacional", "1": "Estrangeira - Imp. Direta", "2": "Estrangeira - Merc. Interno",
  "3": "Nacional, Conteúdo Imp. > 40% e <= 70%", "4": "Nacional, processos produtivos básicos",
  "5": "Nacional, Conteúdo Imp. <= 40%", "6": "Estrangeira - Imp. Direta, s/ similar",
  "7": "Estrangeira - Merc. Interno, s/ similar", "8": "Nacional, Conteúdo Imp. > 70%"
};

const tabelaCST = {
  "101": "Simples c/ crédito", "102": "Simples s/ crédito", "103": "Isenção Simples",
  "201": "Simples c/ crédito e ST", "202": "Simples s/ crédito e ST", "203": "Isenção Simples e ST",
  "300": "Imune", "400": "Não tributada Simples", "500": "ICMS cobrado por ST", "900": "Outros",
  "00": "Tributada integralmente", "10": "Tributada e c/ ST", "20": "Com red. base",
  "30": "Isenta/Não trib. e c/ ST", "40": "Isenta", "41": "Não tributada", "50": "Suspensão",
  "51": "Diferimento", "60": "ICMS cobrado por ST", "70": "Com red. BC e ST", "90": "Outras"
};

const estadosData = [
  {sigla: "AC", aliq: 12}, {sigla: "AL", aliq: 12}, {sigla: "AP", aliq: 12}, {sigla: "AM", aliq: 12},
  {sigla: "BA", aliq: 12}, {sigla: "CE", aliq: 12}, {sigla: "ES", aliq: 12}, {sigla: "GO", aliq: 12},
  {sigla: "MA", aliq: 12}, {sigla: "MT", aliq: 12}, {sigla: "MS", aliq: 12}, {sigla: "PA", aliq: 12},
  {sigla: "PB", aliq: 12}, {sigla: "PE", aliq: 12}, {sigla: "PI", aliq: 12}, {sigla: "RN", aliq: 12},
  {sigla: "RO", aliq: 12}, {sigla: "RR", aliq: 12}, {sigla: "SE", aliq: 12}, {sigla: "TO", aliq: 12},
  {sigla: "MG", aliq: 7}, {sigla: "RJ", aliq: 7}, {sigla: "SP", aliq: 7}, {sigla: "PR", aliq: 7},
  {sigla: "SC", aliq: 7}, {sigla: "RS", aliq: 7}
];

// ========== MULTI-NOTAS ==========
let notes = [];
let activeNoteId = null;
let noteIdCounter = 0;

function gerarIdNota() { return "n" + (++noteIdCounter); }

function capturarEstadoAtual() {
  const produtos = [];
  document.querySelectorAll(".produto").forEach(p => {
    produtos.push({
      desc: p.querySelector(".descProduto").value,
      ocst: p.querySelector(".ocstProduto").value,
      valor: p.querySelector(".valorProduto").value,
      ipi: p.querySelector(".ipiProduto").value,
      outras: p.querySelector(".outrasProduto").value,
      desconto: p.querySelector(".descontoProduto").value
    });
  });
  return {
    chNFe: document.getElementById("chNFe").value,
    numeroNF: document.getElementById("numeroNF").value,
    nomeFornecedor: document.getElementById("nomeFornecedor").value,
    dataEmissao: document.getElementById("dataEmissao").value,
    vigessimoDia: document.getElementById("vigessimoDia").value,
    frete: document.getElementById("frete").value,
    estadoOrigem: document.getElementById("estadoOrigem").value,
    mva: document.getElementById("mva").value,
    reducaoBase: document.getElementById("reducaoBase").value,
    aliquotaInterna: document.getElementById("aliquotaInterna").value,
    aliquotaOrigem: document.getElementById("aliquotaOrigem").value,
    reducaoOrigem: document.getElementById("reducaoOrigem").value,
    produtos
  };
}

function salvarNotaAtiva() {
  if (activeNoteId === null) return;
  const idx = notes.findIndex(n => n.id === activeNoteId);
  if (idx === -1) return;
  notes[idx] = { ...notes[idx], ...capturarEstadoAtual() };
}

function aplicarEstado(estado) {
  document.getElementById("chNFe").value = estado.chNFe || "";
  document.getElementById("numeroNF").value = estado.numeroNF || "";
  document.getElementById("nomeFornecedor").value = estado.nomeFornecedor || "";
  document.getElementById("dataEmissao").value = estado.dataEmissao || "";
  document.getElementById("vigessimoDia").value = estado.vigessimoDia || "";
  document.getElementById("frete").value = estado.frete || "0,00";
  document.getElementById("estadoOrigem").value = estado.estadoOrigem || "";
  document.getElementById("mva").value = estado.mva || "40,00";
  document.getElementById("reducaoBase").value = estado.reducaoBase || "35,00";
  document.getElementById("aliquotaInterna").value = estado.aliquotaInterna || "20,00";
  document.getElementById("aliquotaOrigem").value = estado.aliquotaOrigem || "12,00";
  document.getElementById("reducaoOrigem").value = estado.reducaoOrigem || "41,67";

  const lista = document.getElementById("listaProdutos");
  lista.innerHTML = "";
  if (estado.produtos && estado.produtos.length > 0) {
    estado.produtos.forEach(pr => {
      adicionarProduto(pr.desc, pr.valor, pr.ipi, pr.outras, pr.desconto, pr.ocst);
    });
  } else {
    adicionarProduto();
  }
}

function renderNoteList() {
  const list = document.getElementById("noteList");
  list.innerHTML = "";
  if (notes.length === 0) {
    list.innerHTML = '<div style="font-size:0.7rem;color:#888;padding:4px;">Nenhuma nota aberta</div>';
    return;
  }
  notes.forEach(n => {
    const div = document.createElement("div");
    div.className = "note-item" + (n.id === activeNoteId ? " active" : "");
    const label = (n.numeroNF || "S/N") + (n.nomeFornecedor ? " – " + n.nomeFornecedor.split(" ").slice(0,2).join(" ") : "");
    div.innerHTML = `<span class="note-label" title="${label}">${label}</span>
      <button class="btn-del-note" title="Fechar nota" onclick="event.stopPropagation(); fecharNota('${n.id}')">×</button>`;
    div.onclick = () => selecionarNota(n.id);
    list.appendChild(div);
  });
}

function selecionarNota(id) {
  if (id === activeNoteId) return;
  salvarNotaAtiva();
  const nota = notes.find(n => n.id === id);
  if (!nota) return;
  activeNoteId = id;
  aplicarEstado(nota);
  renderNoteList();
  calcular();
}

function fecharNota(id) {
  const idx = notes.findIndex(n => n.id === id);
  if (idx === -1) return;
  if (id === activeNoteId) salvarNotaAtiva();
  notes.splice(idx, 1);
  if (notes.length === 0) {
    activeNoteId = null;
    resetarFormulario();
  } else if (id === activeNoteId) {
    activeNoteId = notes[Math.min(idx, notes.length - 1)].id;
    aplicarEstado(notes.find(n => n.id === activeNoteId));
    calcular();
  }
  renderNoteList();
}

function aplicarMascaraBR(input) {
  let value = input.value.replace(/\D/g, "");
  if (value === "") value = "0";
  let num = (parseInt(value) / 100).toFixed(2);
  input.value = num.replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

// Máscara para percentuais: digitar 4 → 4 (não 0,04). Aceita vírgula para decimais (ex.: 7,5)
function aplicarMascaraPercentual(input) {
  let v = input.value.replace(/[^\d,]/g, "");
  const idx = v.indexOf(",");
  if (idx !== -1) {
    let intPart = v.slice(0, idx).replace(/^0+(?=\d)/, "") || "0";
    if (intPart.length > 3) intPart = intPart.slice(0, 3);
    let decPart = v.slice(idx + 1).replace(/,/g, "").slice(0, 2);
    input.value = intPart + "," + decPart;
  } else {
    let intPart = v.replace(/^0+(?=\d)/, "") || "0";
    if (intPart.length > 3) intPart = intPart.slice(0, 3);
    input.value = intPart;
  }
}

function finalizarMascaraPercentual(input) {
  // No blur/Enter, normaliza para 2 casas (4 → 4,00 | 7,5 → 7,50)
  const n = parseBR(input.value);
  input.value = formatBR(n);
}

function parseBR(str) {
  if (!str) return 0;
  return parseFloat(str.toString().replace(/\./g, "").replace(",", "."));
}

function moeda(v) {
  return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function formatBR(num) {
  return num.toFixed(2).replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

function calcularVigessimoDia() {
  const inputData = document.getElementById("dataEmissao").value;
  const target = document.getElementById("vigessimoDia");
  
  if (!inputData) {
    target.value = "";
    return;
  }

  // Formato esperado: DD/MM/AAAA
  const parts = inputData.split("/");
  if (parts.length === 3) {
    const day = parseInt(parts[0], 10);
    const month = parseInt(parts[1], 10) - 1;
    const year = parseInt(parts[2], 10);
    
    const date = new Date(year, month, day);
    if (!isNaN(date.getTime())) {
      date.setDate(date.getDate() + 20);
      const d = String(date.getDate()).padStart(2, '0');
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const y = date.getFullYear();
      target.value = `${d}/${m}/${y}`;
    } else {
      target.value = "Data Inválida";
    }
  }
}

function calcular() {
  salvarNotaAtiva();
  if (activeNoteId === null && document.getElementById("numeroNF").value) {
    criarNotaAPartirDoFormulario();
  }
  const produtos = document.querySelectorAll(".produto");
  const frete = parseBR(document.getElementById("frete").value);
  
  const mva = parseBR(document.getElementById("mva").value);
  const reducaoBase = parseBR(document.getElementById("reducaoBase").value);
  const aliquotaInterna = parseBR(document.getElementById("aliquotaInterna").value);
  const aliquotaInterestadual = parseBR(document.getElementById("aliquotaOrigem").value);
  const reducaoOrigem = parseBR(document.getElementById("reducaoOrigem").value);
  
  const tabela = document.getElementById("tabelaResultados");
  tabela.innerHTML = "";
  
  let totalProdutos = 0, totalBase = 0, totalICMS = 0, valorProdutoTotal = 0, vIpiTotal = 0, vOutrasTotal = 0, vDescTotal = 0;
  
  produtos.forEach(p => valorProdutoTotal += parseBR(p.querySelector(".valorProduto").value));
  
  produtos.forEach((p, idx) => {
    const desc = p.querySelector(".descProduto").value || `Item ${idx + 1}`;
    const ocstRaw = p.querySelector(".ocstProduto").value || "";
    const valor = parseBR(p.querySelector(".valorProduto").value);
    const vIPI = parseBR(p.querySelector(".ipiProduto").value);
    const vOutras = parseBR(p.querySelector(".outrasProduto").value);
    const vDesc = parseBR(p.querySelector(".descontoProduto").value);
    
    const rateioFrete = valorProdutoTotal > 0 ? (valor / valorProdutoTotal) * frete : 0;
    
    const valorOperacaoOriginal = valor + rateioFrete + vIPI + vOutras - vDesc;
    const valorOperacao = valorOperacaoOriginal * ((100 - reducaoOrigem) / 100);
    const valorMVA = valorOperacao * (1 + (mva / 100));
    const baseCalculo = valorMVA * (reducaoBase / 100);
    const icmsInterno = baseCalculo * (aliquotaInterna / 100);
    const bcOrigem = valorOperacao;
    const icmsOrigem = bcOrigem * (aliquotaInterestadual / 100);
    const icmsOrigemReduzido = icmsOrigem * (reducaoBase / 100);
    const icmsFinal = icmsInterno - icmsOrigemReduzido;
    
    totalProdutos += valor;
    totalBase += baseCalculo;
    totalICMS += icmsFinal;
    vIpiTotal += vIPI;
    vOutrasTotal += vOutras;
    vDescTotal += vDesc;
    
    let infoCombinada = "";
    if (ocstRaw.includes("/")) {
      const parts = ocstRaw.split("/");
      const dOrig = tabelaOrigem[parts[0]] || "Origem não encontrada";
      const dCst = tabelaCST[parts[1]] || "CST não encontrado";
      infoCombinada = `<span class="ocst-info"><span class="ocst-code">${ocstRaw}</span> ${dOrig} - ${dCst}</span>`;
    }
    
    tabela.innerHTML += `
      <tr>
        <td title="${desc}">${desc}${infoCombinada}</td>
        <td>${moeda(valor)}</td>
        <td>${moeda(baseCalculo)}</td>
        <td>${aliquotaInterna.toFixed(2)}%</td>
        <td>${aliquotaInterestadual.toFixed(2)}%</td>
        <td>${moeda(icmsFinal)}</td>
      </tr>
    `;
  });
  
  document.getElementById("totalProdutos").innerHTML = moeda(totalProdutos);
  document.getElementById("totalBase").innerHTML = moeda(totalBase);
  document.getElementById("totalICMS").innerHTML = moeda(totalICMS);
  
  const valorOperacaoTotalOriginal = totalProdutos + frete + vIpiTotal + vOutrasTotal - vDescTotal;
  const valorOperacaoTotal = valorOperacaoTotalOriginal * ((100 - reducaoOrigem) / 100);
  const valorMVATotal = valorOperacaoTotal * (1 + (mva / 100));
  const baseTotal = valorMVATotal * (reducaoBase / 100);
  const icmsInternoTotal = baseTotal * (aliquotaInterna / 100);
  const bcOrigemTotal = valorOperacaoTotal;
  const icmsOrigemTotal = bcOrigemTotal * (aliquotaInterestadual / 100);
  const icmsOrigemReduzidoTotal = icmsOrigemTotal * (reducaoBase / 100);
  
  document.getElementById("explicacao").innerHTML = `
    <div class="calculo">
      <h2>Explicação dos Cálculos</h2>
      Valor da Operação: (${moeda(totalProdutos)} + ${moeda(frete)} + ${moeda(vIpiTotal)} + ${moeda(vOutrasTotal)} - ${moeda(vDescTotal)}) = ${moeda(valorOperacaoTotalOriginal)}<br><br>
      <strong>Base de Cálculo com Redução Origem (${reducaoOrigem.toFixed(2)}%):</strong> ${moeda(valorOperacaoTotalOriginal)} × (100 - ${reducaoOrigem.toFixed(2)}%) = ${moeda(valorOperacaoTotal)}<br><br>
      Valor do MVA: ${moeda(valorOperacaoTotal)} × (1 + ${mva.toFixed(2)}%) = ${moeda(valorMVATotal)}<br><br>
      Base de Cálculo da Antecipação: ${moeda(valorMVATotal)} × ${reducaoBase.toFixed(2)}% = ${moeda(baseTotal)}<br><br>
      ICMS Antecipado Interno: ${moeda(baseTotal)} × ${aliquotaInterna.toFixed(2)}% = ${moeda(icmsInternoTotal)}<br><br>
      ICMS Origem: ${moeda(bcOrigemTotal)} × ${aliquotaInterestadual.toFixed(2)}% = ${moeda(icmsOrigemTotal)}<br><br>
      ICMS Antecipado Origem (Crédito): ${moeda(icmsOrigemTotal)} × ${reducaoBase.toFixed(2)}% = ${moeda(icmsOrigemReduzidoTotal)}<br><br>
      <strong>ICMS a Pagar: ${moeda(icmsInternoTotal)} - ${moeda(icmsOrigemReduzidoTotal)} = ${moeda(totalICMS)}</strong>
    </div>
  `;
}

function processarMultiplosArquivos(fileList) {
  const files = Array.from(fileList);
  let processados = 0;
  const total = files.length;

  files.forEach((file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const content = e.target.result;
      salvarNotaAtiva();

      try {
        const isTxt = file.name.toLowerCase().endsWith('.txt');
        const isMultiNotaTxt = isTxt && (content.split("=== CÁLCULO ICMS ANTECIPADO ===").length > 2 || content.includes("--- FIM NOTA ---"));

        if (isMultiNotaTxt) {
          importarTXT(content, true);
        } else {
          const id = gerarIdNota();
          notes.push({
            id,
            chNFe: "",
            numeroNF: "",
            nomeFornecedor: "",
            dataEmissao: "",
            vigessimoDia: "",
            frete: "0,00",
            estadoOrigem: "",
            mva: "40,00",
            reducaoBase: "35,00",
            aliquotaInterna: "20,00",
            aliquotaOrigem: "12,00",
            reducaoOrigem: "41,67",
            produtos: []
          });
          activeNoteId = id;
          resetarFormulario();

          if (file.name.toLowerCase().endsWith('.xml')) importarXML(content, true);
          else if (isTxt) importarTXT(content, true);
          criarNotaAPartirDoFormulario();
        }
      } catch (err) {
        console.error(err);
        showStatus("Erro em " + file.name);
      }

      processados++;
      if (processados === total) {
        if (notes.length > 0) {
          activeNoteId = notes[notes.length - 1].id;
          aplicarEstado(notes.find(n => n.id === activeNoteId));
          renderNoteList();
          calcular();
        }
        showStatus(`✓ ${total} arquivo(s) importado(s)!`);
      }
    };
    reader.readAsText(file);
  });
}

function showStatus(msg) {
  const el = document.getElementById("statusMsg");

  el.innerText = msg;
  el.style.display = "block";
  el.style.background = "#d4edda";

}

function importarXML(xmlContent, skipCalc = false) {
  const parser = new DOMParser();
  const xmlDoc = parser.parseFromString(xmlContent, "text/xml");
  document.getElementById("listaProdutos").innerHTML = "";
  
  const ide = xmlDoc.querySelector("ide");
  const emit = xmlDoc.querySelector("emit");
  const infProt = xmlDoc.querySelector("infProt");
  
  if (ide) document.getElementById("numeroNF").value = ide.querySelector("nNF")?.textContent || "";
  if (emit) document.getElementById("nomeFornecedor").value = emit.querySelector("xNome")?.textContent || "";
  
  // Chave de Acesso
  const chNFe = infProt ? infProt.querySelector("chNFe")?.textContent : xmlDoc.querySelector("infNFe")?.getAttribute("Id")?.replace("NFe", "");
  if (chNFe) document.getElementById("chNFe").value = chNFe;

  // Data de Emissão
  const dhEmi = ide?.querySelector("dhEmi")?.textContent || ide?.querySelector("dEmi")?.textContent;
  if (dhEmi) {
    const datePart = dhEmi.substring(0, 10);
    const [y, m, d] = datePart.split("-");
    document.getElementById("dataEmissao").value = `${d}/${m}/${y}`;
    calcularVigessimoDia();
  }
  
  // UF origem
  const ufOrigem = emit?.querySelector("enderEmit > UF")?.textContent;
  if (ufOrigem) {
    const estado = estadosData.find(e => e.sigla === ufOrigem);
    if (estado) {
      document.getElementById("estadoOrigem").value = estado.sigla;
      document.getElementById("aliquotaOrigem").value = formatBR(estado.aliq);
    }
  }

  // Frete
  const ICMSTot = xmlDoc.querySelector("ICMSTot");
  if (ICMSTot) {
    const vFrete = parseFloat(ICMSTot.querySelector("vFrete")?.textContent || 0);
    if (vFrete) document.getElementById("frete").value = formatBR(vFrete);
  }
  
  const prods = xmlDoc.querySelectorAll("det");
  prods.forEach((prod) => {
    const prod_elem = prod.querySelector("prod");
    const ipi_elem = prod.querySelector("imposto > IPI > IPINT, imposto > IPI > IPISaida, imposto > IPI > IPITrib");
    const ipi = ipi_elem ? parseFloat(ipi_elem.querySelector("vIPI")?.textContent || 0) : 0;
    const icms = prod.querySelector("imposto > ICMS");
    let ocst = "";
    if (icms) {
      const inner = icms.children[0];
      const orig = inner.querySelector("orig")?.textContent || "0";
      const cst = inner.querySelector("CST")?.textContent || inner.querySelector("CSOSN")?.textContent || "00";
      ocst = `${orig}/${cst}`;
    }
    adicionarProduto(
      prod_elem?.querySelector("xProd")?.textContent || "Item",
      formatBR(parseFloat(prod_elem?.querySelector("vProd")?.textContent || 0)),
      formatBR(ipi),
      formatBR(parseFloat(prod_elem?.querySelector("vOutro")?.textContent || 0)),
      formatBR(parseFloat(prod_elem?.querySelector("vDesc")?.textContent || 0)),
      ocst
    );
  });
  if (!skipCalc) {
    criarNotaAPartirDoFormulario();
    calcular();
  }
}

function serializarNotaTXT(estado) {
  let txt = "=== CÁLCULO ICMS ANTECIPADO ===\n\n";
  txt += `CHAVE: ${estado.chNFe || ""}\n`;
  txt += `NF: ${estado.numeroNF || ""}\n`;
  txt += `DATA EMISSÃO: ${estado.dataEmissao || ""}\n`;
  txt += `VIGÉSIMO DIA: ${estado.vigessimoDia || ""}\n`;
  txt += `FORNECEDOR: ${estado.nomeFornecedor || ""}\n`;
  txt += `Frete Total: ${estado.frete || "0,00"}\n`;
  txt += `Estado Origem: ${estado.estadoOrigem || ""}\n`;
  txt += `MVA: ${estado.mva || "40,00"}\n`;
  txt += `Redução Base: ${estado.reducaoBase || "35,00"}\n`;
  txt += `Aliq. Interna: ${estado.aliquotaInterna || "20,00"}\n`;
  txt += `Aliq. Origem: ${estado.aliquotaOrigem || "12,00"}\n`;
  txt += `Red. ICMS Origem: ${estado.reducaoOrigem || "41,67"}\n\n`;
  txt += `--- PRODUTOS ---\n`;
  (estado.produtos || []).forEach((pr, i) => {
    txt += `P${i+1}|${pr.desc || ""}|${pr.valor || "0,00"}|${pr.ipi || "0,00"}|${pr.outras || "0,00"}|${pr.desconto || "0,00"}|${pr.ocst || ""}\n`;
  });
  txt += `\n--- FIM NOTA ---\n`;
  return txt;
}

function obterNotaAtivaParaExport() {
  salvarNotaAtiva();
  if (activeNoteId === null && document.getElementById("numeroNF").value) {
    criarNotaAPartirDoFormulario();
  }
  if (activeNoteId !== null) {
    const n = notes.find(x => x.id === activeNoteId);
    if (n) return n;
  }
  return capturarEstadoAtual();
}

function baixarTXT(conteudo, fileName) {
  const blob = new Blob([conteudo], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = fileName; a.click();
  URL.revokeObjectURL(url);
}

function exportarTXT() {
  const nota = obterNotaAtivaParaExport();
  const txt = serializarNotaTXT(nota);
  const nf = nota.numeroNF || "S_N";
  const forn = (nota.nomeFornecedor || "EMITENTE").trim().split(/\s+/).slice(0, 2).join("_");
  baixarTXT(txt, `Antecipado_NF_${nf}_${forn}.txt`);
  showStatus("✓ TXT da nota atual exportado");
}

function exportarTXTTodas() {
  salvarNotaAtiva();
  let lista = notes.slice();
  if (lista.length === 0) lista = [{ id: "temp", ...capturarEstadoAtual() }];
  let txt = "";
  lista.forEach((nota, i) => {
    if (i > 0) txt += "\n\n";
    txt += serializarNotaTXT(nota);
  });
  baixarTXT(txt, `Notas_Antecipado_${lista.length}_${new Date().toISOString().slice(0,10)}.txt`);
  showStatus(`✓ ${lista.length} nota(s) exportada(s) em TXT`);
}

function parseNotaTXT(block) {
  const lines = block.split("\n");
  const estado = {
    chNFe: "",
    numeroNF: "",
    nomeFornecedor: "",
    dataEmissao: "",
    vigessimoDia: "",
    frete: "0,00",
    estadoOrigem: "",
    mva: "40,00",
    reducaoBase: "35,00",
    aliquotaInterna: "20,00",
    aliquotaOrigem: "12,00",
    reducaoOrigem: "41,67",
    produtos: []
  };
  lines.forEach((line) => {
    if (line.startsWith("CHAVE: ")) estado.chNFe = line.split(": ").slice(1).join(": ");
    if (line.startsWith("NF: ")) estado.numeroNF = line.split(": ").slice(1).join(": ");
    if (line.startsWith("DATA EMISSÃO: ")) estado.dataEmissao = line.split(": ").slice(1).join(": ");
    if (line.startsWith("VIGÉSIMO DIA: ")) estado.vigessimoDia = line.split(": ").slice(1).join(": ");
    if (line.startsWith("FORNECEDOR: ")) estado.nomeFornecedor = line.split(": ").slice(1).join(": ");
    if (line.startsWith("Frete Total: ")) estado.frete = line.split(": ").slice(1).join(": ");
    if (line.startsWith("Estado Origem: ")) estado.estadoOrigem = line.split(": ").slice(1).join(": ");
    if (line.startsWith("MVA: ")) estado.mva = line.split(": ").slice(1).join(": ");
    if (line.startsWith("Redução Base: ")) estado.reducaoBase = line.split(": ").slice(1).join(": ");
    if (line.startsWith("Aliq. Interna: ")) estado.aliquotaInterna = line.split(": ").slice(1).join(": ");
    if (line.startsWith("Aliq. Origem: ")) estado.aliquotaOrigem = line.split(": ").slice(1).join(": ");
    if (line.startsWith("Red. ICMS Origem: ")) estado.reducaoOrigem = line.split(": ").slice(1).join(": ");
    if (line.startsWith("P") && line.includes("|")) {
      const p = line.split("|");
      if (p.length >= 6) {
        estado.produtos.push({
          desc: p[1] || "",
          valor: p[2] || "0,00",
          ipi: p[3] || "0,00",
          outras: p[4] || "0,00",
          desconto: p[5] || "0,00",
          ocst: p[6] || ""
        });
      }
    }
  });
  return estado;
}

function importarTXT(content, skipCalc = false) {
  const blocks = content.split(/=== CÁLCULO ICMS ANTECIPADO ===/).map(b => b.trim()).filter(b => b.length > 0);

  if (blocks.length === 0) blocks.push(content);

  if (blocks.length > 1 || content.includes("--- FIM NOTA ---")) {
    salvarNotaAtiva();
    blocks.forEach((block) => {
      const estado = parseNotaTXT(block);
      const id = gerarIdNota();
      notes.push({ id, ...estado });
      activeNoteId = id;
    });
    if (notes.length > 0) {
      activeNoteId = notes[notes.length - 1].id;
      aplicarEstado(notes.find(n => n.id === activeNoteId));
      renderNoteList();
      if (!skipCalc) calcular();
    }
    return;
  }

  // Uma única nota
  const estado = parseNotaTXT(blocks[0] || content);
  document.getElementById("listaProdutos").innerHTML = "";
  document.getElementById("chNFe").value = estado.chNFe;
  document.getElementById("numeroNF").value = estado.numeroNF;
  document.getElementById("nomeFornecedor").value = estado.nomeFornecedor;
  document.getElementById("dataEmissao").value = estado.dataEmissao;
  document.getElementById("vigessimoDia").value = estado.vigessimoDia || "";
  if (estado.dataEmissao && !estado.vigessimoDia) calcularVigessimoDia();
  document.getElementById("frete").value = estado.frete;
  document.getElementById("estadoOrigem").value = estado.estadoOrigem;
  document.getElementById("mva").value = estado.mva;
  document.getElementById("reducaoBase").value = estado.reducaoBase;
  document.getElementById("aliquotaInterna").value = estado.aliquotaInterna;
  document.getElementById("aliquotaOrigem").value = estado.aliquotaOrigem;
  document.getElementById("reducaoOrigem").value = estado.reducaoOrigem;
  if (estado.produtos.length === 0) adicionarProduto();
  else estado.produtos.forEach(pr => adicionarProduto(pr.desc, pr.valor, pr.ipi, pr.outras, pr.desconto, pr.ocst));
  if (!skipCalc) {
    criarNotaAPartirDoFormulario();
    calcular();
  }
}

function calcularNotaParaExport(estado) {
  const frete = parseBR(estado.frete || "0,00");
  const mva = parseBR(estado.mva || "40,00");
  const reducaoBase = parseBR(estado.reducaoBase || "35,00");
  const aliquotaInterna = parseBR(estado.aliquotaInterna || "20,00");
  const aliquotaInterestadual = parseBR(estado.aliquotaOrigem || "12,00");
  const reducaoOrigem = parseBR(estado.reducaoOrigem || "41,67");
  const produtos = estado.produtos || [];

  let valorProdutoTotal = 0;
  produtos.forEach(pr => valorProdutoTotal += parseBR(pr.valor || "0,00"));

  const linhas = [];
  let tProd = 0, tBase = 0, tICMS = 0;

  produtos.forEach((pr, idx) => {
    const valor = parseBR(pr.valor || "0,00");
    const vIPI = parseBR(pr.ipi || "0,00");
    const vOutras = parseBR(pr.outras || "0,00");
    const vDesc = parseBR(pr.desconto || "0,00");
    const rateioFrete = valorProdutoTotal > 0 ? (valor / valorProdutoTotal) * frete : 0;
    const valorOperacaoOriginal = valor + rateioFrete + vIPI + vOutras - vDesc;
    const valorOperacao = valorOperacaoOriginal * ((100 - reducaoOrigem) / 100);
    const valorMVA = valorOperacao * (1 + (mva / 100));
    const baseCalculo = valorMVA * (reducaoBase / 100);
    const icmsInterno = baseCalculo * (aliquotaInterna / 100);
    const bcOrigem = valorOperacao;
    const icmsOrigem = bcOrigem * (aliquotaInterestadual / 100);
    const icmsOrigemReduzido = icmsOrigem * (reducaoBase / 100);
    const icmsFinal = icmsInterno - icmsOrigemReduzido;

    tProd += valor; tBase += baseCalculo; tICMS += icmsFinal;
    const ocst = pr.ocst || "";
    const itemLabel = ocst ? `${pr.desc || "Item " + (idx+1)} [${ocst}]` : (pr.desc || `Item ${idx+1}`);
    linhas.push({
      item: itemLabel,
      valor, base: baseCalculo,
      aliqInt: aliquotaInterna, aliqIntest: aliquotaInterestadual,
      icms: icmsFinal
    });
  });

  return {
    numeroNF: estado.numeroNF || "",
    nomeFornecedor: estado.nomeFornecedor || "",
    linhas,
    totais: { tProd, tBase, tICMS }
  };
}

function montarPlanilhaExcel(lista, fileName) {
  if (typeof XLSX === "undefined") {
    alert("Biblioteca Excel não carregou. Verifique a conexão com a internet e recarregue a página.");
    return;
  }
  const aoa = [];
  aoa.push([
    "NF", "Fornecedor", "Item / O-CST", "Valor Produto (R$)",
    "Base Antecipação (R$)", "Aliq. Interna %", "Aliq. Interest. %", "ICMS a Pagar (R$)"
  ]);

  let tProd = 0, tBase = 0, tICMS = 0;
  lista.forEach((nota) => {
    const r = calcularNotaParaExport(nota);
    tProd += r.totais.tProd;
    tBase += r.totais.tBase;
    tICMS += r.totais.tICMS;
    r.linhas.forEach(l => {
      aoa.push([
        r.numeroNF || "S/N",
        r.nomeFornecedor || "",
        l.item,
        Number(l.valor.toFixed(2)),
        Number(l.base.toFixed(2)),
        Number(l.aliqInt.toFixed(2)),
        Number(l.aliqIntest.toFixed(2)),
        Number(l.icms.toFixed(2))
      ]);
    });
  });

  aoa.push([]);
  aoa.push([
    "TOTAIS", "", "",
    Number(tProd.toFixed(2)),
    Number(tBase.toFixed(2)),
    "", "",
    Number(tICMS.toFixed(2))
  ]);

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = [
    { wch: 12 }, { wch: 30 }, { wch: 40 }, { wch: 14 },
    { wch: 16 }, { wch: 12 }, { wch: 14 }, { wch: 14 }
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "ICMS Antecipado");
  XLSX.writeFile(wb, fileName);
  showStatus("✓ Excel exportado: " + fileName);
}

function exportarExcel() {
  const nota = obterNotaAtivaParaExport();
  const nf = nota.numeroNF || "S_N";
  const forn = (nota.nomeFornecedor || "EMITENTE").trim().split(/\s+/).slice(0, 2).join("_");
  montarPlanilhaExcel([nota], `Antecipado_NF_${nf}_${forn}.xlsx`);
}

function exportarExcelTodas() {
  salvarNotaAtiva();
  let lista = notes.slice();
  if (lista.length === 0) lista = [{ id: "temp", ...capturarEstadoAtual() }];
  const dataStr = new Date().toISOString().slice(0, 10);
  montarPlanilhaExcel(lista, `Relatorio_Antecipado_${lista.length}notas_${dataStr}.xlsx`);
}
