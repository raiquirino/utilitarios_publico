<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OFX ↔ Excel x Excel ↔ OFX</title>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface2: #243044;
      --border: #2d3a4f;
      --text: #e8eef7;
      --muted: #8b9bb4;
      --blue: #3b82f6;
      --blue-dim: #1e3a5f;
      --green: #22c55e;
      --green-dim: #14532d;
      --accent: #60a5fa;
      --danger: #f87171;
      --ok: #4ade80;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #111827 0%, #1e293b 100%);
      border-bottom: 1px solid var(--border);
      padding: 0.65rem 1.4rem;
      display: flex;
      align-items: center;
    }
    header h1 { font-size: 1rem; font-weight: 600; color: var(--text); }
    main { max-width: 1180px; margin: 0.75rem auto; padding: 0 0.85rem 1.2rem; }
    main > h1 { font-size: 1.1rem; font-weight: 700; text-align: center; margin-bottom: 0.7rem; }
    .layout {
      display: grid;
      grid-template-columns: 270px 1fr;
      gap: 0.85rem;
      align-items: start;
    }
    .sidebar { display: flex; flex-direction: column; gap: 0.6rem; position: sticky; top: 0.55rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .card h2 {
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; padding: 0.42rem 0.7rem; color: #fff;
    }
    .card-ofx h2 { background: linear-gradient(90deg, #2563eb, #3b82f6); }
    .card-excel h2 { background: linear-gradient(90deg, #16a34a, #22c55e); }
    .card-body { padding: 0.55rem 0.65rem 0.65rem; }
    .drop-zone {
      border: 2px dashed transparent; border-radius: 8px; padding: 0.75rem 0.45rem;
      text-align: center; cursor: pointer; position: relative; margin-bottom: 0.5rem;
      transition: all 0.2s; min-height: 62px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0.2rem;
    }
    .card-ofx .drop-zone { background: var(--blue-dim); border-color: #3b82f680; }
    .card-excel .drop-zone { background: var(--green-dim); border-color: #22c55e80; }
    .drop-zone:hover, .drop-zone.drag-over {
      transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }
    .card-ofx .drop-zone:hover, .card-ofx .drop-zone.drag-over { border-color: var(--blue); background: #1e40af55; }
    .card-excel .drop-zone:hover, .card-excel .drop-zone.drag-over { border-color: var(--green); background: #16653455; }
    .drop-zone .icon { font-size: 1.3rem; }
    .drop-zone .label { font-size: 0.7rem; font-weight: 600; color: var(--text); opacity: 0.9; }
    .drop-zone .filename {
      display: none; font-size: 0.65rem; font-weight: 700; color: var(--accent); word-break: break-all;
    }
    .card-excel .drop-zone .filename { color: var(--ok); }
    .drop-zone.has-file .filename { display: block; }
    .drop-zone.has-file .icon { display: none; }
    .drop-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .fields {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.3rem; margin-bottom: 0.5rem;
    }
    .fields label {
      font-size: 0.58rem; color: var(--muted); display: flex; flex-direction: column; gap: 0.12rem;
    }
    .fields input {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 5px;
      color: var(--text); padding: 0.28rem 0.35rem; font-size: 0.7rem; width: 100%;
    }
    .fields input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 2px #22c55e33; }
    .fields input::placeholder { color: #5a6a82; }
    .bank-search-wrap { position: relative; margin-bottom: 0.4rem; }
    .bank-search-wrap input {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 5px; color: var(--text); padding: 0.32rem 0.4rem; font-size: 0.7rem;
    }
    .bank-search-wrap input:focus { outline: none; border-color: var(--green); }
    .bank-search-results {
      display: none; position: absolute; z-index: 20; left: 0; right: 0; top: 100%;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
      max-height: 180px; overflow-y: auto; margin-top: 2px;
    }
    .bank-search-results.open { display: block; }
    .bank-search-results button {
      display: block; width: 100%; text-align: left; border: none; background: transparent;
      color: var(--text); padding: 0.35rem 0.5rem; font-size: 0.68rem; cursor: pointer;
    }
    .bank-search-results button:hover { background: #1e40af55; }
    .bank-search-results .code { color: var(--accent); font-weight: 700; margin-right: 0.35rem; }
    .bank-hint {
      font-size: 0.62rem; color: var(--ok); margin: -0.25rem 0 0.4rem; min-height: 0.85rem;
    }
    .btn {
      width: 100%; border: none; border-radius: 6px; padding: 0.42rem;
      font-size: 0.75rem; font-weight: 700; color: #fff; cursor: pointer;
      transition: transform 0.1s, filter 0.15s;
    }
    .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .card-ofx .btn { background: linear-gradient(90deg, #2563eb, #3b82f6); }
    .card-excel .btn { background: linear-gradient(90deg, #16a34a, #22c55e); }
    .progress-area { margin-top: 0.35rem; min-height: 0.9rem; }
    .progress-text { font-size: 0.62rem; color: var(--muted); min-height: 0.7rem; margin-bottom: 0.12rem; }
    .progress-track { height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
    .progress-track > div { height: 100%; width: 0%; transition: width 0.3s; border-radius: 2px; }
    .card-ofx .progress-track > div { background: var(--blue); }
    .card-excel .progress-track > div { background: var(--green); }
    .links { display: flex; flex-direction: column; gap: 0.25rem; margin-top: 0.35rem; }
    .links a {
      font-size: 0.66rem; font-weight: 600; text-decoration: none;
      padding: 0.32rem 0.45rem; border-radius: 5px; border: 1px solid var(--border);
    }
    .card-ofx .links a { background: var(--blue-dim); color: #93c5fd; }
    .card-excel .links a { background: var(--green-dim); color: #86efac; }
    .preview-column { min-width: 0; }
    .preview-placeholder {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      min-height: 400px; display: flex; align-items: center; justify-content: center;
      text-align: center; color: var(--muted); font-size: 0.88rem; line-height: 1.5; padding: 2rem;
    }
    .preview-placeholder.hidden { display: none; }
    .preview-box {
      display: none; background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden; min-height: 400px;
    }
    .preview-box.visible { display: block; }
    .preview-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.6rem 1rem; background: var(--surface2); border-bottom: 1px solid var(--border);
      font-size: 0.8rem; font-weight: 700;
    }
    .preview-header .file-tag { font-size: 0.72rem; font-weight: 600; color: var(--accent); }
    .preview-body { padding: 0.85rem 1rem 1rem; }
    .preview-fields {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.4rem;
      margin-bottom: 0.9rem;
    }
    .preview-fields .pf {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; padding: 0.4rem 0.5rem;
      min-width: 0;
    }
    .preview-fields .pf .lbl {
      font-size: 0.58rem; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.03em; margin-bottom: 0.12rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .preview-fields .pf .val {
      font-size: 0.8rem; font-weight: 600; color: var(--text);
      word-break: break-word;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @media (max-width: 1000px) {
      .preview-fields { grid-template-columns: repeat(3, 1fr); }
    }
    .preview-table-wrap {
      overflow: auto;
      max-height: 480px;
      border: 1px solid #c5c5c5;
      border-radius: 4px;
      background: #ffffff;
      box-shadow: inset 0 0 0 1px #e8e8e8;
    }
    .preview-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      font-family: 'Calibri', 'Segoe UI', system-ui, sans-serif;
      background: #fff;
      color: #000;
    }
    .preview-table th {
      position: sticky;
      top: 0;
      background: #f2f2f2;
      text-align: left;
      padding: 0.45rem 0.7rem;
      font-weight: 700;
      color: #333;
      border-bottom: 1px solid #b0b0b0;
      border-right: 1px solid #e0e0e0;
      white-space: nowrap;
      z-index: 1;
    }
    .preview-table th:last-child { border-right: none; }
    .preview-table td {
      padding: 0.35rem 0.7rem;
      border-bottom: 1px solid #e8e8e8;
      border-right: 1px solid #f0f0f0;
      color: #222;
      max-width: 420px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: #fff;
    }
    .preview-table td:last-child { border-right: none; }
    .preview-table tbody tr:nth-child(even) td { background: #fafafa; }
    .preview-table tbody tr:hover td { background: #e8f0fe; }
    .preview-table .neg { color: #c00000; font-weight: 600; }
    .preview-table .pos { color: #006100; font-weight: 600; }
    .preview-count { margin-top: 0.5rem; font-size: 0.7rem; color: var(--muted); }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; }
    }
  </style>
</head>
<body>
  <header><h1>Ferramentas Contábeis</h1></header>
  <main>
    <h1>Conversor OFX ↔ Excel</h1>
    <div class="layout">
      <aside class="sidebar">
        <div class="card card-ofx">
          <h2>OFX → Excel</h2>
          <div class="card-body">
            <div class="drop-zone" id="dropZoneOFX">
              <span class="icon">📂</span>
              <span class="label">Cole (Ctrl+V) · arraste ou clique · .ofx</span>
              <span class="filename" id="fileNameOFX"></span>
              <input type="file" id="ofxInput" multiple accept=".ofx,.OFX,text/plain" />
            </div>
            <button class="btn" id="btnConvertOFX">Converter</button>
            <div class="progress-area">
              <div class="progress-text" id="progressOFX"></div>
              <div class="progress-track"><div id="progressBarOFX"></div></div>
            </div>
            <div class="links" id="downloadExcelLinks"></div>
          </div>
        </div>
        <div class="card card-excel">
          <h2>Excel → OFX</h2>
          <div class="card-body">
            <div class="drop-zone" id="dropZoneExcel">
              <span class="icon">📊</span>
              <span class="label">Cole (Ctrl+V) · arraste ou clique · .xlsx</span>
              <span class="filename" id="fileNameExcel"></span>
              <input type="file" id="csvInput" multiple accept=".xlsx,.xls,.csv" />
            </div>
            <div class="bank-search-wrap">
              <input type="text" id="fldBankSearch" placeholder="Buscar banco por nome..." autocomplete="off" />
              <div class="bank-search-results" id="bankSearchResults"></div>
            </div>
            <div class="fields">
              <label>Banco (BANKID)<input type="text" id="fldBankId" placeholder="001" /></label>
              <label>Agência (BRANCHID)<input type="text" id="fldBranchId" placeholder="1234-5" /></label>
              <label>Conta (ACCTID)<input type="text" id="fldAcctId" placeholder="22063-9" /></label>
              <label>Instituição (ORG)<input type="text" id="fldOrg" placeholder="Banco do Brasil" /></label>
              <label>Período início (DTSTART)<input type="text" id="fldDtStart" placeholder="DD/MM/AAAA" maxlength="10" inputmode="numeric" /></label>
              <label>Período fim (DTEND)<input type="text" id="fldDtEnd" placeholder="DD/MM/AAAA" maxlength="10" inputmode="numeric" /></label>
            </div>
            <div class="bank-hint" id="bankHint"></div>
            <button class="btn" id="btnConvertCSV">Converter</button>
            <div class="progress-area">
              <div class="progress-text" id="progressCSV"></div>
              <div class="progress-track"><div id="progressBarCSV"></div></div>
            </div>
            <div class="links" id="downloadOFXLinks"></div>
          </div>
        </div>
      </aside>
      <div class="preview-column">
        <div class="preview-placeholder" id="previewPlaceholder">
          Selecione um arquivo OFX ou Excel na lateral<br>para visualizar os dados aqui
        </div>
        <div class="preview-box" id="previewOFX">
          <div class="preview-header">
            <span>Pré-visualização OFX</span>
            <span class="file-tag" id="previewOFXFile"></span>
          </div>
          <div class="preview-body">
            <div class="preview-fields" id="previewOFXMeta"></div>
            <div class="preview-table-wrap">
              <table class="preview-table">
                <thead><tr><th>Data</th><th>Memo</th><th>Valor</th></tr></thead>
                <tbody id="previewOFXBody"></tbody>
              </table>
            </div>
            <div class="preview-count" id="previewOFXCount"></div>
          </div>
        </div>
        <div class="preview-box" id="previewExcel">
          <div class="preview-header">
            <span>Pré-visualização Excel</span>
            <span class="file-tag" id="previewExcelFile"></span>
          </div>
          <div class="preview-body">
            <div class="preview-fields" id="previewExcelMeta"></div>
            <div class="preview-table-wrap">
              <table class="preview-table">
                <thead id="previewExcelHead"></thead>
                <tbody id="previewExcelBody"></tbody>
              </table>
            </div>
            <div class="preview-count" id="previewExcelCount"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
<script src="ofx_to_excel_to_ofx.js"></script>
</body>
</html>
