<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exemplo - Página Protegida</title>

  <!-- 1. CSS do login (obrigatório) -->
  <link rel="stylesheet" href="login.css" />

  <!-- Seus estilos da página -->
  <style>
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f1419;
      color: #e7ecf3;
      min-height: 100vh;
      margin: 0;
      line-height: 1.5;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #8b9bb4;
      margin-bottom: 32px;
    }

    /* Menu de links */
    .menu-links {
      display: grid;
      gap: 12px;
      margin-top: 24px;
    }

    .menu-links a {
      display: block;
      padding: 14px 18px;
      background: #1a2332;
      border: 1px solid #2a3548;
      border-radius: 8px;
      color: #e7ecf3;
      text-decoration: none;
      font-size: 1rem;
      transition: background 0.2s, border-color 0.2s;
    }

    .menu-links a:hover {
      background: #243044;
      border-color: #3d4f6a;
    }

    .menu-links a span {
      color: #8b9bb4;
      font-size: 0.85rem;
      display: block;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- ========== TELA DE LOGIN (não mexa) ========== -->
  <div id="loginOverlay">
    <div class="login-box">
      <h2>Acesso Restrito</h2>
      <div class="login-sub">Nome da sua página</div>
      <input type="text" id="loginUser" placeholder="Usuário" autocomplete="off" autofocus>
      <input type="password" id="loginPass" placeholder="Senha">
      <button id="loginBtn">Entrar</button>
      <div class="login-error" id="loginError">Usuário ou senha incorretos</div>
    </div>
  </div>

  <!-- ========== CONTEÚDO PROTEGIDO ========== -->
  <div id="mainApp" style="display:none;">

    <button class="btn-sair" id="btnSair">Sair</button>

    <div class="container">
      <h1>MENU</h1>
      <p class="subtitle">Escolha para onde deseja ir:</p>

      <!-- ====== AQUI VOCÊ COLOCA OS LINKS ====== -->
      <div class="menu-links">

        <!-- Link 1 -->
        <a href="conciliacao_1.0.html">
          Conciliador
          <span>Conciliação de contas</span>
        </a>

        <!-- Link 2 -->
        <a href="pagina2.html">
          Página 2
          <span>Outra página protegida ou pública</span>
        </a>

        <!-- Link 3 -->
        <a href="https://seusite.com/outra-pagina">
          Link externo
          <span>Pode ser um site de fora também</span>
        </a>

        <!-- Adicione quantos links quiser copiando o modelo acima -->

      </div>
      <!-- ====== FIM DOS LINKS ====== -->

    </div>
  </div>

  <!-- 2. JavaScript do login (obrigatório) -->
  <script src="login.js"></script>
</body>
</html>
