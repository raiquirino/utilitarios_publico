<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conciliador de Contas</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="conciliacao.css">
</head>
<body>
  <header>
    <h1>Conciliador de Contas</h1>
    <span class="hint">Ctrl+clique = marcar linha · Duplo clique = copiar</span>
  </header>

  <div class="toolbar">
    <div class="group">
      <input type="file" id="inputExcel" accept=".xlsx,.xls">
      <label class="chk">
        <input type="checkbox" id="usarMacro1"> Macro Balancete
      </label>
    </div>

    <div class="sep"></div>

    <div class="group">
      <span class="group-label">Fmt</span>
      <button class="btn-format" id="btnDate">Data</button>
      <button class="btn-format" id="btnValue">Valor</button>
      <button class="btn-format" id="btnOriginal">Original</button>
      <button class="btn-format" id="btnDesativar">Off</button>
    </div>

    <div class="sep"></div>

    <div class="group">
      <span class="group-label">Col</span>
      <input type="text" id="col1" maxlength="3" value="F" title="Coluna 1">
      <input type="text" id="col2" maxlength="3" value="E" title="Coluna 2">
      <input type="text" id="colR" maxlength="3" value="G" title="Resultado">
      <button class="btn-primary" id="btnConciliar">Conciliar</button>
    </div>

    <div class="sep"></div>

    <div class="group">
      <button class="btn-filter" id="btnConciliados">✓ Conciliados</button>
      <button class="btn-filter" id="btnNaoConciliados">✗ Não Conc.</button>
      <button id="btnTodos">Todos</button>
      <button class="btn-success" id="btnSalvar">Salvar Excel</button>
    </div>
  </div>

  <div id="totais"></div>
  <div id="output"></div>
  <div id="copiado-msg">Copiado!</div>

  <script src='conciliacao.js'></script>
</body>
</html>
